<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#F4ECD7">
<meta name="format-detection" content="telephone=no">
<title>히즈 온라인</title>
<link rel="icon" type="image/png" sizes="32x32" href="his-icon-32.png?v=4">
<link rel="icon" href="favicon.ico?v=4">
<link rel="apple-touch-icon" href="his-icon-180.png?v=4">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#F4ECD7;color:#0C4631;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid #C9A227;outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(36px + env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.wrap.wide{max-width:1480px}
.top{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 0}
.logo{height:22px;width:auto;display:block}
.brand{font-weight:800;font-size:16px;letter-spacing:-.2px;white-space:nowrap}
.sp{flex:1 1 auto;min-width:0}
.me{font-size:13px;color:#6B6E62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
@media (max-width:359px){.top{gap:6px}.top .logo{height:19px}.top .brand{font-size:15px}}
.hit{position:relative}
.hit:after{content:"";position:absolute;left:-8px;right:-8px;top:-8px;bottom:-8px}
.tbtn{background:none;border:0;padding:6px 2px;font-size:13px;font-weight:700;color:#0C4631;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.card{background:#FAFAF5;border:1px solid #E0C97A;border-radius:16px;padding:16px}
.btn-fill{display:block;width:100%;min-height:50px;border:0;border-radius:12px;background:#0C4631;color:#F4ECD7;font-size:16px;font-weight:800;padding:12px 16px}
.btn-line{display:block;width:100%;min-height:50px;border:1px solid #C9A227;border-radius:12px;background:#FAFAF5;color:#0C4631;font-size:16px;font-weight:700;padding:12px 16px}
.btn-fill[disabled],.btn-line[disabled]{opacity:.55;cursor:default}
.btn-sm{display:inline-block;min-height:36px;border:1px solid #C9A227;border-radius:10px;background:#FAFAF5;color:#0C4631;font-size:14px;font-weight:700;padding:6px 14px}
.sub{font-size:13px;color:#6B6E62}
.err{font-size:14px;font-weight:700;color:#9A3F33;min-height:21px;margin:10px 0 0}
.norec{margin:0 0 12px;padding:9px 12px;border-radius:10px;background:#F2F1EA;color:#6B6E62;font-size:13px;font-weight:600}
.foot{margin:28px 0 0;text-align:center;font-size:13px;color:#6B6E62}
.foot a{font-weight:700;color:#0C4631}
.foot a.hit:after{top:-14px;bottom:-14px}
.foot .now{display:block;margin-top:2px}
/* 로그인 */
.login{max-width:400px;margin:0 auto;padding-top:9vh}
.login .head{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px}
.login .head .logo{height:30px}
.login h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.4px}
.fld{display:block;margin:0 0 14px}
.fld span{display:block;font-size:14px;font-weight:700;margin:0 0 6px}
.fld input{display:block;width:100%;height:50px;border:1px solid #D9CFAE;border-radius:12px;background:#fff;padding:0 14px;font-size:17px}
.fld input:focus{border-color:#C9A227;outline:none;box-shadow:0 0 0 3px rgba(201,162,39,.18)}
.demo{margin-top:22px;padding:14px;border:1px dashed #C9A227;border-radius:14px;background:rgba(250,250,245,.6)}
.demo p{margin:0 0 10px;font-size:13px;color:#6B6E62}
.demo .chips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{border:1px solid #D9CFAE;background:#FAFAF5;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:#0C4631}
.dchip small{font-size:11px;font-weight:600;color:#6B6E62}
/* 동의 */
.cons{max-width:560px;margin:0 auto}
.cons h1{margin:6px 0 14px;font-size:22px;font-weight:800;letter-spacing:-.3px}
.cons ol{margin:0;padding:0;list-style:none;counter-reset:c}
.cons li{position:relative;padding:12px 0 12px 32px;border-top:1px solid #EDE3C6;text-align:justify;font-size:15px;word-break:normal;line-break:strict}
.cons li:first-child{border-top:0;padding-top:4px}
.cons li:before{counter-increment:c;content:counter(c);position:absolute;left:0;top:12px;width:22px;height:22px;border-radius:50%;border:1px solid #C9A227;font-size:12px;font-weight:800;line-height:20px;text-align:center}
.cons li:first-child:before{top:4px}
.cons .links{display:flex;flex-wrap:wrap;gap:0 18px;margin-top:2px}
.cons .links a{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:700;text-underline-offset:3px}
.cons .btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.cons .cur{margin:14px 0 0;font-size:14px;font-weight:700;color:#1E5A3E}
/* 목록 */
.cont{display:block;text-decoration:none;margin:0 0 18px}
.cont .lab{font-size:12px;font-weight:800;color:#8A6520;letter-spacing:.2px}
.cont .tt{font-size:17px;font-weight:800;margin:2px 0 0}
.cont .bk{font-size:13px;color:#6B6E62}
.cont .ln{display:flex;align-items:center;gap:10px;margin-top:10px}
.cont .ln b{font-size:14px;white-space:nowrap}
.pbar{flex:1 1 auto;height:6px;border-radius:3px;background:#E6E0CC;overflow:hidden}
.abs1{display:block;margin:0 0 18px;border-color:#C9A227;box-shadow:inset 4px 0 0 #C9A227}
.abs1 .absgo{display:block;text-decoration:none;color:inherit}
.abs1 .lab{font-size:12px;font-weight:800;color:#8A6520;letter-spacing:.2px}
.abs1 .tt{font-size:17px;font-weight:800;margin:2px 0 0}
.abs1 .bk{font-size:13px;color:#6B6E62}
.abs1 .ln{display:flex;align-items:center;gap:10px;margin-top:10px}
.abs1 .ln b{font-size:14px;white-space:nowrap}
.abs1 .ln em{font-style:normal;font-size:13px;font-weight:800;color:#1E5A3E;white-space:nowrap}
.abs1 .tip{margin:8px 0 0;font-size:12px;color:#6B6E62}
/* 결석 카드 안의 줄(이어서 보기 · «N편 더») = 카드 장수에 안 셈(검수 A M6) */
.absln{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin:12px 0 0;padding:10px 0 0;border:0;border-top:1px solid #EDE3C6;background:none;border-radius:0;font-size:14px;font-weight:800;color:#8A6520;text-align:left;text-decoration:none}
.absln + .absln{margin-top:0}
.abscont{gap:4px}
.absln .k{flex:0 0 auto;white-space:nowrap}
.absln .v{flex:1 1 auto;min-width:0;font-weight:700;color:#4A4D44;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 누를 수 있는 줄 표시 «›»(C2 검수 L3 · 글자가 아니라 꾸밈이라 읽어 주지 않음) */
.absln::after{content:'\203A';flex:0 0 auto;margin-left:auto;padding-left:4px;font-size:20px;line-height:1;font-weight:700;color:#8A6520}
/* 학교 시험 카드(C2) · 범위 영상 */
.exam1{display:block;text-decoration:none;margin:0 0 18px;border-color:#9DBFAE;box-shadow:inset 4px 0 0 #1E5A3E}
.exam1 .lab{font-size:12px;font-weight:800;color:#1E5A3E;letter-spacing:.2px}
.exam1 .tt{font-size:17px;font-weight:800;margin:2px 0 0}
.exam1 .bk{font-size:13px;color:#6B6E62}
.exam1 .ln{display:flex;align-items:center;gap:10px;margin-top:10px}
.exam1 .ln b{font-size:14px;flex:0 1 auto}
.rhead{margin:4px 0 14px}
.rhead h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
.rhead p{margin:4px 0 0;font-size:14px;color:#6B6E62}
.pbar i{display:block;height:100%;background:#8CC4A6;border-radius:3px}
.grp{margin:0 0 18px}
.grp h2{margin:0 0 8px;padding:0 2px;font-size:14px;font-weight:800;color:#6B6E62}
.rows{background:#FAFAF5;border:1px solid #E0C97A;border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 14px;border-top:1px solid #EDE3C6;text-decoration:none;color:inherit}
.row:first-child{border-top:0}
a.row:active{background:#F4EEDB}
.row .mn{flex:1 1 auto;min-width:0}
.row .tt{font-size:16px;font-weight:800;line-height:1.35}
.row .mt{font-size:13px;color:#6B6E62;margin-top:3px}
.row .mt .mi{white-space:nowrap}
.row .st{font-size:13px;font-weight:700;margin-top:4px}
.row .st.pre{color:#6B6E62}
.row .st.ing{color:#0C4631}
.row .st.ok{color:#1E5A3E}
.row .st.in{color:#6B6E62}
.row .ab{font-size:12px;font-weight:800;color:#8A6520;margin-top:4px}
.row .ab.in{color:#6B6E62;font-weight:700}
.row.flash{background:#FBF0C9;transition:background .6s}
.row .un{font-size:12px;font-weight:700;color:#7A5410;margin-top:3px}
.row.off{opacity:.55;cursor:default}
.tag{display:inline-block;vertical-align:2px;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:800;line-height:18px;white-space:nowrap}
.tag.new{background:#FBF0C9;color:#7A5410}
.tag.ans{background:#DFEAF8;color:#1F4C7E}
.tag.end{background:#F2F1EA;color:#6B6E62;margin-left:0;margin-top:5px;vertical-align:0}
.ring{flex:0 0 auto;display:block}
.empty{padding:28px 18px;text-align:center;color:#6B6E62;font-size:14px}
/* 플레이어 */
.ptop{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 0}
.ptop .pt{flex:1 1 auto;min-width:0}
.ptop .pt b{display:block;font-size:16px;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .pt span{display:block;font-size:12px;color:#6B6E62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backb{flex:0 0 auto;background:none;border:0;padding:8px 2px;font-size:14px;font-weight:800;color:#0C4631;white-space:nowrap}
.vid{position:relative;width:100%;padding-top:56.25%;background:#0C4631;border-radius:12px;overflow:hidden}
.vid iframe,.vid .yt,.vid .fake{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.fake{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#F4ECD7;background:#0C4631}
.fake .fl{font-size:12px;letter-spacing:.3px;opacity:.75}
.fake .ft{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.fake button{min-width:96px;min-height:44px;border:1px solid rgba(244,236,215,.6);border-radius:999px;background:transparent;color:#F4ECD7;font-weight:800;padding:6px 18px}
.verr{padding:22px 18px;text-align:center}
.verr p{margin:0 0 14px;font-size:16px;font-weight:800}
.resume{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:10px 0 0;font-size:14px;color:#6B6E62}
.resume button{background:none;border:0;padding:4px 2px;font-weight:800;color:#0C4631;text-decoration:underline;text-underline-offset:3px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 0}
.spd{display:flex;align-items:center;gap:0;border:1px solid #D9CFAE;border-radius:12px;overflow:hidden;background:#FAFAF5}
.spd span{padding:0 8px 0 10px;font-size:12px;font-weight:700;color:#6B6E62}
.spd button{min-width:44px;height:44px;border:0;border-left:1px solid #EDE3C6;background:transparent;font-size:14px;font-weight:700;color:#0C4631;padding:0 6px}
.spd button.on{background:#DDF0E5;color:#1E5A3E;font-weight:800}
.b10{height:46px;border:1px solid #D9CFAE;border-radius:12px;background:#FAFAF5;font-size:14px;font-weight:700;color:#0C4631;padding:0 14px}
.nowl{display:flex;align-items:flex-start;gap:10px;margin:12px 0 0}
.nowl .ch{flex:1 1 auto;min-width:0;font-size:14px;font-weight:700}
.nowl .ch em{font-style:normal;font-size:12px;font-weight:700;color:#6B6E62;margin-right:6px}
.nowl .ms{flex:0 0 auto;font-size:13px;font-weight:800;color:#1E5A3E;white-space:nowrap}
.mybar{margin:8px 0 0}
/* C3 종이 자리 · C7 멈추고 풀기(영상 밖 옆 판: 폰 = 영상 바로 아래 · PC = 오른쪽 칸 맨 위) */
.paper{margin:0 0 8px;font-size:13px;font-weight:700;color:#5F6256}
.tag.wb{background:#F2F1EA;color:#5F6256}
.toc .tag.wb{display:table;margin:3px 0 0}  /* 검수 A L7: 목차 꼬리표는 늘 제목 아래 줄 */
.stopw{margin:12px 0 0;padding:14px 16px;border:1px solid #C9A227;border-radius:14px;background:#FAFAF5;box-shadow:inset 4px 0 0 #C9A227}
.stopw .sq{margin:0;font-size:16px;font-weight:800;line-height:1.45;word-break:keep-all}
.stopw .sb{display:flex;gap:8px;margin:12px 0 0}
.stopw .sb button{flex:1 1 0;min-width:0;min-height:44px;border-radius:12px;font-size:15px;font-weight:800;padding:8px 12px}
.stopw .go{border:0;background:#0C4631;color:#F4ECD7}
.stopw .lt{border:1px solid #C9A227;background:#FAFAF5;color:#0C4631;font-weight:700}
.stopw.w{display:none}
.tabs{display:flex;gap:0;border-bottom:1px solid #E0C97A;margin:22px 0 0}
.tabs button{flex:0 0 auto;min-height:44px;border:0;background:none;padding:8px 14px;font-size:15px;font-weight:700;color:rgba(12,70,49,.75);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:#0C4631;font-weight:800;border-bottom-color:#0C4631}
.tabs .tag{margin-left:5px}
.tbody{padding:12px 0 0}
.toc{list-style:none;margin:0;padding:0}
.toc button{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;border:0;border-bottom:1px solid #EDE3C6;background:none;padding:8px 4px;text-align:left}
.toc button.cur{background:rgba(201,162,39,.09)}
.toc .tt{flex:1 1 auto;min-width:0;font-size:14px;font-weight:600}
.toc button.cur .tt{font-weight:800}
.toc .tm{flex:0 0 auto;font-size:13px;color:#6B6E62;font-variant-numeric:tabular-nums}
.dot{flex:0 0 auto;width:12px;height:12px;border-radius:50%;border:1.5px solid #C9C3B0;background:transparent}
.dot.half{border-color:#8CC4A6;background:linear-gradient(90deg,#8CC4A6 50%,transparent 50%)}
.dot.full{border-color:#8CC4A6;background:#8CC4A6}
/* 질문 */
.qf{background:#FAFAF5;border:1px solid #E0C97A;border-radius:16px;padding:14px}
.kinds{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.kc{min-height:34px;border:1px solid #D9CFAE;border-radius:999px;background:#fff;padding:4px 13px;font-size:13px;font-weight:700;color:#0C4631}
.kc.on{background:#DDF0E5;border-color:#8CC4A6;color:#1E5A3E;font-weight:800}
.qf textarea,.rf textarea{display:block;width:100%;min-height:96px;resize:vertical;border:1px solid #D9CFAE;border-radius:12px;background:#fff;padding:10px 12px;font-size:16px;line-height:1.5}
.qf textarea:focus,.rf textarea:focus{border-color:#C9A227;outline:none}
.qrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:10px 0 0}
.scn{min-height:32px;border:1px solid #BFDCCB;border-radius:999px;background:#DDF0E5;color:#1E5A3E;padding:3px 12px;font-size:13px;font-weight:700}
.scn.off{background:#fff;border-color:#D9CFAE;color:#6B6E62}
.cnt{margin-left:auto;font-size:12px;color:#6B6E62;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.chk input{width:18px;height:18px;margin:0;accent-color:#0C4631}
.qf .send{display:flex;align-items:center;gap:12px;margin:12px 0 0}
.qf .send .err{flex:1 1 auto;margin:0;min-height:0}
.qf .send .btn-fill{width:auto;min-width:110px;min-height:44px;font-size:15px;margin-left:auto}
.qnote{padding:16px;border-radius:14px;background:#F2F1EA;color:#6B6E62;font-size:14px;font-weight:600}
.qnote a{font-weight:800;color:#0C4631}
.qlist{margin:14px 0 0}
.q{background:#FAFAF5;border:1px solid #E0C97A;border-radius:16px;padding:14px;margin:0 0 12px}
.qh{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.qh .who{font-size:14px;font-weight:800}
.qh .when{font-size:12px;color:#6B6E62}
.qh .st{margin-left:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;line-height:18px;white-space:nowrap}
.pill.k-c{background:#F2F1EA;color:#6B6E62}
.pill.k-t{background:#DFEAF8;color:#1F4C7E}
.pill.pv{background:#FBE9E3;color:#9A3F33}
.q .bd{margin:8px 0 0;white-space:pre-wrap;text-align:justify;font-size:15px;word-break:normal;line-break:strict}
.q .scb{margin:8px 0 0;min-height:30px;border:1px solid #BFDCCB;border-radius:999px;background:#DDF0E5;color:#1E5A3E;padding:2px 11px;font-size:13px;font-weight:700}
.rp{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:#F2F1EA}
.rp.t{background:#EEF6F1;border-left:3px solid #8CC4A6}
.rp .qh .who{font-size:13px}
.rp .bd{margin:4px 0 0;font-size:14px}
.acts{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0}
.acts .tbtn{font-size:13px}
.acts .no{font-size:12px;color:#6B6E62}
.acts .ask{font-size:13px;font-weight:800;color:#9A3F33}
.rf{margin:10px 0 0}
.rf .send{display:flex;align-items:center;gap:12px;margin:8px 0 0}
.rf .send .err{flex:1 1 auto;margin:0;min-height:0}
/* 폰에서 누르는 자리 44px 가까이(보이는 크기는 그대로) */
.kc,.scn,.q .scb,.btn-sm,.chk,.dchip{position:relative}
.kc:after,.scn:after,.q .scb:after,.btn-sm:after,.dchip:after,.chk:after{content:"";position:absolute;left:0;right:0;top:-5px;bottom:-5px}
.scn:after{top:-6px;bottom:-6px}
.q .scb:after{top:-7px;bottom:-7px}
.btn-sm:after,.dchip:after{top:-4px;bottom:-4px}
.chk:after{left:-4px;right:-4px;top:-12px;bottom:-12px}
.end1{max-width:480px;margin:12vh auto 0;text-align:center}
.end1 p{margin:0 0 16px;font-size:18px;font-weight:800}
@media (min-width:1100px){
  .pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,420px);gap:28px;align-items:start}
  .pgrid .pr{position:-webkit-sticky;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
  .pgrid .tabs{margin-top:0}
  .stopw.m{display:none}
  .stopw.w{display:block;margin:0 0 14px}
}
</style>
</head>

<div id="app"></div>
<script>
(function () {
  'use strict';
  var demo = /[?&]demo=1(?:&|$)/.test(location.search);
  var list = demo ? ['class-mock.js', 'class-api.js'] : ['class-api.js'];
  function next() {
    if (!list.length) { if (window.__lecStart) window.__lecStart(); return; }
    var s = document.createElement('script');
    s.src = list.shift();
    s.onload = next;
    s.onerror = function () {
      var a = document.getElementById('app');
      if (a) a.innerHTML = '<div class="wrap"><div class="end1"><p>인터넷 연결을 확인해 주세요.</p></div></div>';
    };
    document.head.appendChild(s);

})();

<script>
/* 히즈 강의실 · 학생 화면 (ES5 · class-api.js 의 window.Lec 을 씀) */
window.__lecStart = function () {
  'use strict';
  var L = window.Lec;
  var app = document.getElementById('app');
  if (!L) { app.innerHTML = '<div class="wrap"><div class="end1"><p>인터넷 연결을 확인해 주세요.</p></div></div>'; return; }
  var esc = L.esc;
  var LS = L.LS;
  var SESS_MS = 20 * 60000;
  var BEAT_MS = 60000;
  var RATES = [0.75, 1, 1.25, 1.5, 2];
  var DEV = L.devName();

  var M = {
    input: '이름과 번호 4자리를 확인해 주세요.',
    nomatch: '이름이나 번호가 맞지 않아요. 등원할 때 누르는 번호예요.',
    many: '같은 이름과 번호가 두 명 있어요. 선생님께 말씀해 주세요.',
    net: '인터넷 연결을 확인해 주세요.',
    again: '다시 들어와 주세요',
    gone: '학원 명단에서 찾을 수 없어요. 선생님께 여쭤 주세요',
    norec: '기록 없이 보는 중이에요 · 진도와 질문이 남지 않아요',
    qnorec: '질문을 남기려면 기록에 동의해 주세요',
    ended: '공개 기간이 끝난 영상이에요',
    endedChip: '공개 기간이 끝난 영상',
    absLab: '결석한 날 수업',
    absTip: '1.5배까지 권해요',
    inLab: '교실에서 들음',
    examLab: '학교 시험',
    contLab: '이어서 보기',
    qmany: '한 시간에 질문은 20개까지 올릴 수 있어요.',
    qinput: '내용을 1~1000자로 써 주세요.',
    qparent: '답을 달 수 없는 질문이에요.',
    qanswered: '답이 달린 질문은 지울 수 없어요'
  };

  var S = {
    key: '', name: '', home: null, lectures: [], consent: null, cver: L.CONSENT_VER,
    att: null, /* lec_att 답(출결) · 없거나 옛 서버면 null = 예전 화면 그대로 */
    paper: null, /* lec_paper 답(지문 줄 · {강의 id: [{no, at, stop, wb}]}) · 없거나 옛 서버면 null = 종이 줄 · 멈춤 없음 */
    rng: null, /* C2 lec_range_me 답(학교 시험 범위) · 없거나 옛 서버면 null = 시험 카드 없음 */
    absAt: 0, /* «N편 더»를 누른 수(누를 때마다 다음 결석 강의로 · 검수 A L19) */
    loginErr: '', nav: false, view: '', tab: 'toc',
    q: null
  };
  var T = null; /* 지금 여는 강의의 재생·진도 */

  /* ------------------------------------------------------------ 작은 도움 */
  function $(id) { return document.getElementById(id); }
  function findAct(n) {
    while (n && n !== document) {
      if (n.getAttribute && n.getAttribute('data-act')) return n;
      n = n.parentNode;
    }
    return null;
  }
  function attr(el, k) { return el ? el.getAttribute(k) : null; }
  function setHTML(id, h) { var e = $(id); if (e) e.innerHTML = h; }
  function nowIso() { return new Date(L.now()).toISOString(); }
  function pathOnly() { return location.pathname + location.search; }
  function clearHash() {
    try { history.replaceState(null, '', pathOnly()); } catch (e) { location.hash = ''; }
  }
  function findLec(id) {
    var i;
    for (i = 0; i < S.lectures.length; i += 1) { if (S.lectures[i].id === id) return S.lectures[i]; }
    return null;
  }
  function recMode() {
    var c = S.consent;
    if (!c || c.ver !== S.cver) return 'pending';
    if (c.choice === 'agree') return 'agree';
    if (c.choice === 'none') return 'none';
    return 'pending';
  }
  function isDone(l, pct) { return !!l.confirmed || pct >= L.DONE; }
  function dayDiff(a, b) {
    var x = L.ts(a), y = L.ts(b);
    if (!isFinite(x) || !isFinite(y)) return 9999;
    return Math.round((x - y) / 86400000);
  }

  function footHTML() {
    var m = recMode(), line = '';
    if (m === 'agree') line = '지금: 기록함 · ' + esc(L.fmtMD(S.consent.at)) + ' 동의';
    else if (m === 'none') line = '지금: 기록 안 함';
    return '<div class="foot"><a href="#rec" class="hit">기록 안내</a>' +
           (line ? '<span class="now">' + line + '</span>' : '') + '</div>';
  }
  function norecHTML() { return recMode() === 'none' ? '<p class="norec">' + M.norec + '</p>' : ''; }

  function ring(pct, done) {
    var r = 17, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct || 0));
    var off = c * (1 - p / 100);
    var h = '<svg class="ring" viewBox="0 0 44 44" width="44" height="44" aria-hidden="true">' +
      '<circle cx="22" cy="22" r="17" fill="none" stroke="#E6E0CC" stroke-width="4"/>';
    if (p > 0) {
      h += '<circle cx="22" cy="22" r="17" fill="none" stroke="#8CC4A6" stroke-width="4" stroke-linecap="round" stroke-dasharray="' +
        c.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '" transform="rotate(-90 22 22)"/>';
    }
    if (done) h += '<path d="M15 22.5l4.6 4.6 9.2-9.8" fill="none" stroke="#1E5A3E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>';
    else h += '<text x="22" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#1E5A3E">' + p + '%</text>';
    return h + '</svg>';
  }

  /* ------------------------------------------------------------ 로그인 */
  function showLogin(err) {
    teardown();
    S.view = 'login';
    var h = '<div class="wrap"><div class="login">' +
      '<div class="head"><img class="logo" src="his_fish_green.png" alt="히즈어학원"><h1>히즈 온라인</h1></div>' +
      '<form id="loginForm" class="card" novalidate autocomplete="off">' +
      '<label class="fld"><span>이름</span><input id="lgName" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40"></label>' +
      '<label class="fld"><span>등원 번호 4자리</span><input id="lgPin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"></label>' +
      '<button id="lgBtn" class="btn-fill" type="submit">들어가기</button>' +
      '<p id="lgErr" class="err" role="alert">' + esc(err || '') + '</p>' +
      '</form>';
    if (L.DEMO) {
      h += '<div class="demo"><p>연습용 화면이에요. 학생을 누르면 이름과 번호가 채워져요.</p><div class="chips">' +
        '<button class="dchip" type="button" data-act="dfill" data-n="김하늘" data-p="1234">김하늘 <small>동의 전</small></button>' +
        '<button class="dchip" type="button" data-act="dfill" data-n="박구름" data-p="3456">박구름 <small>기록 안 함</small></button>' +
        '<button class="dchip" type="button" data-act="dfill" data-n="이바다" data-p="2345">이바다 <small>선생님 확인</small></button>' +
        '<button class="dchip" type="button" data-act="dfill" data-n="최새봄" data-p="4567">최새봄 <small>답변 대기</small></button>' +
        '<button class="dchip" type="button" data-act="dgone">오가을 <small>명단에서 빠짐</small></button>' +
        '<button class="dchip" type="button" data-act="dreset">처음 상태로</button>' +
        '</div></div>';
    }
    h += '</div></div>';
    app.innerHTML = h;
  }

  function doLogin() {
    var nEl = $('lgName'), pEl = $('lgPin'), b = $('lgBtn');
    if (!nEl || !pEl || b.disabled) return;
    var name = L.btrim(String(nEl.value || '').replace(/^\s+|\s+$/g, ''));
    var pin = String(pEl.value || '').replace(/[^0-9]/g, '');
    if (!name || pin.length !== 4) { setHTML('lgErr', esc(M.input)); return; }
    b.disabled = true;
    setHTML('lgErr', '');
    L.login(name, pin, DEV).then(function (r) {
      b.disabled = false;
      if (r && r.ok) {
        S.key = r.key; S.name = r.name || name; S.att = null; S.paper = null; S.rng = null;
        L.lsSet(LS.key, r.key);
        loadHome();
        return;
      }
      var e = r && r.err, m = M.net;
      if (e === 'input') m = M.input;
      else if (e === 'nomatch') m = M.nomatch;
      else if (e === 'many') m = M.many;
      else if (e === 'locked') m = L.lockMsg(r);
      setHTML('lgErr', esc(m));
    }, function () {
      b.disabled = false;
      setHTML('lgErr', esc(M.net));
    });
  }

  function reLogin() {
    L.lsDel(LS.key); L.lsDel(LS.sess);
    S.key = ''; S.home = null; S.lectures = []; S.consent = null; S.att = null; S.paper = null; S.rng = null;
    clearHash();
    showLogin(M.again);
  }

  function showGone() {
    teardown();
    S.view = 'gone';
    app.innerHTML = '<div class="wrap"><div class="end1"><img class="logo" src="his_fish_green.png" alt="" style="margin:0 auto 18px;height:26px">' +
      '<p>' + esc(M.gone) + '</p><button class="btn-line" type="button" data-act="out">처음 화면으로</button></div></div>';
  }
  function showNet() {
    teardown();
    S.view = 'net';
    app.innerHTML = '<div class="wrap"><div class="end1"><p>' + esc(M.net) + '</p>' +
      '<button class="btn-fill" type="button" data-act="retry">다시 해 보기</button></div></div>';
  }

  /* ------------------------------------------------------------ 집 정보 */
  function loadHome(quiet) {
    if (!S.key) { showLogin(''); return; }
    var k = S.key;
    var side = quiet ? null : sideStart(k);
    L.home(k).then(function (r) {
      if (k !== S.key) return; /* 그새 나감(다른 학생) = 버림 */
      if (!r || !r.ok) {
        if (r && r.err === 'gone') { showGone(); return; }
        reLogin();
        return;
      }
      S.home = r;
      S.name = (r.me && r.me.name) || S.name;
      S.lectures = r.lectures || [];
      S.consent = r.consent || null;
      if (r.consent_ver) S.cver = r.consent_ver;
      if (quiet) { quietList(); return; }
      sideWait(side, k, route);
    }, function () {
      if (quiet || k !== S.key) return;
      showNet();
    });
  }
  /* 검수 A M4: 출결(결석한 날 수업 · 교실에서 들음) · 학교 시험 범위(C2) · 지문 줄을 집 정보와 같이 부름 → 맨 위 카드와 목록을 한 번에 그림.
     집 정보가 온 뒤 SIDE_MS(0.6초)까지만 기다림 · 그보다 늦게 온 것은 이미 그린 목록을 밀지 않고 다음에 목록을 다시 그릴 때(영상에서 돌아올 때) 들어감.
     못 받으면(옛 서버 · 끊김) 카드 없이 예전 화면 그대로 */
  var SIDE_MS = 600;
  function sideStart(k) {
    var sd = { n: 2, cb: null };
    function one() {
      sd.n -= 1;
      if (sd.n <= 0 && sd.cb) { var f = sd.cb; sd.cb = null; f(); }
    }
    S.att = null; S.rng = null; S.absAt = 0;
    L.att(k).then(function (a) { if (k === S.key) S.att = a; one(); }, one);
    L.rngMe(k).then(function (r) { if (k === S.key) S.rng = r; one(); }, one);
    loadPaper(k);
    return sd;
  }
  function sideWait(sd, k, f) {
    if (!sd || sd.n <= 0) { f(); return; }
    var t = setTimeout(function () {
      if (!sd.cb) return;
      sd.cb = null;
      if (k === S.key) f();
    }, SIDE_MS);
    sd.cb = function () { clearTimeout(t); if (k === S.key) f(); };
  }
  /* 지문 줄(C3 종이 자리 · C7 멈추고 풀기) · 집 정보와 같이 한 번 · 못 받으면(옛 서버 · 끊김) 둘 다 조용히 없음 */
  function loadPaper(k) {
    L.paper(k).then(function (r) {
      if (k !== S.key) return;
      S.paper = r ? L.paperMap(r) : null;
      if (S.view === 'player' && T) paperPaint();
    });
  }
  function lecPaper(id) { return (S.paper && S.paper[String(id)]) || null; }
  function attMap() {
    var m = {}, a = S.att, i;
    if (!a || !a.items) return m;
    for (i = 0; i < a.items.length; i += 1) { if (a.items[i] && a.items[i].id) m['i' + a.items[i].id] = a.items[i]; }
    return m;
  }
  /* 영상에서 돌아온 뒤 새 진도로 목록을 다시 그림. 누르는 중이거나 막 뗐으면 조금 미룸:
     누른 단추를 다시 그리면 그 누름이 사라짐(아이폰 사파리·마우스) → «나가기»를 눌러도 안 나가던 것 */
  function quietList() {
    if (S.view !== 'list' && S.view !== 'rng') return;
    var ago = Date.now() - press.at;
    if (press.on ? ago < 3000 : ago < 400) { setTimeout(quietList, 100); return; }
    if (S.view === 'rng') showRange(); else showList();
  }

  /* ------------------------------------------------------------ 길 찾기 */
  function route() {
    var hs = String(location.hash || '').replace(/^#/, '');
    if (!S.key) { showLogin(S.loginErr); return; }
    if (!S.home) { loadHome(); return; }
    if (recMode() === 'pending') { teardown(); showConsent(false); return; }
    if (hs === 'rec') { teardown(); showConsent(true); return; }
    var m = hs.match(/^v=([^&]+)/);
    if (m) {
      var id = '', l;
      try { id = decodeURIComponent(m[1]); } catch (e) { id = ''; } /* 깨진 주소 = 목록으로 */
      l = findLec(id);
      if (!l) { clearHash(); teardown(); showList(); return; }
      if (l.ended) { teardown(); showEnded(); return; }
      if (T && T.lec.id === id && S.view === 'player') return;
      teardown();
      showPlayer(l);
      return;
    }
    var wasPlayer = S.view === 'player';
    teardown();
    if (hs === 'rng') showRange(); else showList();   /* C2 학교 시험 범위 영상 */
    if (wasPlayer) loadHome(true);
  }
  function goList() {
    if (S.nav) { history.back(); return; }
    clearHash();
    route();
  }

  /* ------------------------------------------------------------ 동의 */
  function showConsent(again) {
    S.view = again ? 'rec' : 'consent';
    var m = recMode(), cur = '';
    if (again && m === 'agree') cur = '지금: 기록함 · ' + esc(L.fmtMD(S.consent.at)) + ' 동의';
    else if (again && m === 'none') cur = '지금: 기록 안 함';
    var h = '<div class="wrap"><div class="top">' +
      (again ? '<button class="backb hit" type="button" data-act="recback">← 돌아가기</button>' : '<img class="logo" src="his_fish_green.png" alt="히즈어학원"><span class="brand">히즈 온라인</span>') +
      '<span class="sp"></span></div><div class="cons"><div class="card">' +
      '<h1>히즈 온라인 기록 안내</h1><ol>' +
      '<li>기록하는 것: 영상을 어디까지 봤는지(재생 위치·본 칸), 남긴 질문과 받은 답</li>' +
      '<li>보는 사람: 원장 선생님과 담당 선생님</li>' +
      '<li>보관: 강의가 내려가면 그 강의 기록도 함께 지우고, 학원을 그만두면 30일 안에 지웁니다</li>' +
      '<li>지우기: 지워 달라고 하면 30일 안에 지웁니다. 동의는 맨 아래 ‘기록 안내’에서 언제든 바꿀 수 있어요</li>' +
      '<li>영상: 히즈 온라인은 YouTube API 서비스로 영상을 틉니다<span class="links">' +
      '<a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener">YouTube 서비스 약관</a>' +
      '<a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google 개인정보처리방침</a></span></li>' +
      '</ol>' + (cur ? '<p class="cur">' + cur + '</p>' : '') +
      '<div class="btns"><button class="btn-fill" type="button" data-act="agree">동의하고 들어가기</button>' +
      '<button class="btn-line" type="button" data-act="none">기록 없이 보기</button></div>' +
      '<p id="cErr" class="err" role="alert"></p>' +
      '</div></div></div>';
    app.innerHTML = h;
  }

  function choose(choice, btn) {
    var again = S.view === 'rec';
    var bs = app.querySelectorAll('.cons button');
    var i;
    for (i = 0; i < bs.length; i += 1) bs[i].disabled = true;
    var k = S.key;
    L.consent(k, choice, S.cver).then(function (r) {
      if (k !== S.key) return;
      if (r && r.ok) {
        S.consent = { choice: r.choice, ver: r.ver, at: r.at };
        if (r.choice === 'none') pendDropKey(S.key);
        if (again) clearHash();
        route();
        return;
      }
      if (r && r.err === 'key') { reLogin(); return; }
      if (r && r.err === 'ver') { S.home = null; loadHome(); return; }
      for (i = 0; i < bs.length; i += 1) bs[i].disabled = false;
      setHTML('cErr', esc(M.net));
    }, function () {
      if (k !== S.key) return;
      for (i = 0; i < bs.length; i += 1) bs[i].disabled = false;
      setHTML('cErr', esc(M.net));
    });
  }

  /* ------------------------------------------------------------ 목록 */
  function statusOf(l) {
    var pct = +l.pct || 0;
    if (l.confirmed) return { cls: 'ok', txt: '학습완료 · 선생님 확인' };
    if (pct >= L.DONE) return { cls: 'ok', txt: '학습완료' + (l.done_at || l.last_at ? ' · ' + L.fmtDay(l.done_at || l.last_at) : '') };
    if (pct > 0 || l.first_at) return { cls: 'ing', txt: '학습중 ' + pct + '%' + (l.last_at ? ' · ' + L.fmtDay(l.last_at) : '') };
    return { cls: 'pre', txt: '학습 전' };
  }
  /* 메타 줄(이스케이프한 HTML) · 조각마다 한 덩어리로 묶어 이름과 값이 줄바꿈으로 갈리지 않게 */
  function metaOf(l, at) {
    var a = [], h = [], i, ld = l.lesson_on ? L.isoDay(l.lesson_on) : '';
    /* C1 고침(11-16): 수업일마다 반이 정해진 강의면 내 반의 수업일(출결 days)로 · 첫 수업일이 그 안에 있으면 지금처럼 */
    if (at && Object.prototype.toString.call(at.days) === '[object Array]' && at.days.length && at.days.indexOf(ld) < 0 && typeof at.days[0] === 'string' && L.isoDay(at.days[0])) {
      ld = L.isoDay(at.days[0]);
    }
    /* 검수 A L2: 내 반 수업일이 둘 이상이면 «수업일 11.11(수) 외 1일»(선생님 표와 같은 꼴) */
    var more = at && Object.prototype.toString.call(at.days) === '[object Array]' && at.days.length >= 2 ? at.days.length - 1 : 0;
    if (ld) a.push('수업일 ' + L.fmtDay(ld) + (more ? ' 외 ' + more + '일' : ''));
    if (l.posted_on && !(ld && L.isoDay(l.posted_on) === ld)) a.push('탑재일 ' + L.fmtDay(l.posted_on)); /* 수업일과 같은 날이면 뺌 */
    if (+l.dur > 0) a.push('강의시간 ' + L.fmtDur(l.dur));
    var n = (l.chapters && l.chapters.length) || 0;
    if (n) a.push('목차 ' + n);
    for (i = 0; i < a.length; i += 1) h.push('<span class="mi">' + esc(a[i]) + (i < a.length - 1 ? ' ·' : '') + '</span>');
    return h.join(' ');
  }
  function showList() {
    S.view = 'list';
    var m = recMode(), rec = m === 'agree';
    var arr = S.lectures.slice().reverse(); /* 서버는 오래된 차례 → 새것부터 */
    var today = L.isoDay();
    var h = '<div class="wrap"><div class="top"><img class="logo" src="his_fish_green.png" alt="히즈어학원">' +
      '<span class="brand">히즈 온라인</span><span class="sp"></span>' +
      '<span class="me">' + esc(S.name) + '</span>' +
      '<button class="tbtn hit" type="button" data-act="logout">나가기</button></div>';
    h += norecHTML();
    var am = attMap(), ab = absList(arr, am, today), i;
    /* 맨 위 카드는 두 장까지 · 차례 결석한 날 수업 › 학교 시험 범위 › 이어서 보기(C2 정한 것 · 검수 A M6)
       결석 카드가 있으면 «이어서 보기»와 «결석한 날 수업 N편 더»는 그 카드 안의 줄(카드 장수에 안 셈) */
    /* «이어서 보기»는 결석한 날 수업(결석 카드 · «N편 더»가 이미 가리킴)을 빼고 고름(C2 검수 L2) */
    var skip = {};
    for (i = 0; i < ab.length; i += 1) skip['i' + ab[i].id] = 1;
    var best = rec ? contBest(arr, skip) : null, ex = examTop(rec), tops = 0;
    if (ab.length) {
      if (best && best.id === ab[0].id) best = null; /* 같은 강의면 결석 카드가 대신함 */
      h += absCardHTML(ab[0], am['i' + ab[0].id], rec, best, ab.length - 1);
      best = null;
      tops += 1;
    }
    if (ex) { h += examCardHTML(ex, rec); tops += 1; }
    if (best && tops < 2) {
      h += '<a class="cont card" href="#v=' + encodeURIComponent(best.id) + '" data-act="go" data-top="cont">' +
        '<span class="lab">' + esc(M.contLab) + '</span><div class="tt">' + esc(best.title) + '</div>' +
        '<div class="bk">' + esc(best.book || '') + '</div>' +
        '<div class="ln"><b>' + esc(L.fmtDur(best.pos || 0)) + '부터</b><span class="pbar"><i style="width:' + (+best.pct || 0) + '%"></i></span></div></a>';
    }
    if (!arr.length) {
      h += '<div class="rows"><div class="empty">아직 올라온 강의가 없어요.<br>수업 영상이 올라오면 여기에 보여요.</div></div>';
    } else {
      var groups = [], gmap = {}, j, g, bk;
      for (j = 0; j < arr.length; j += 1) {
        bk = arr[j].book || '';
        if (!gmap.hasOwnProperty('b' + bk)) { gmap['b' + bk] = groups.length; groups.push({ book: bk, list: [] }); }
        groups[gmap['b' + bk]].list.push(arr[j]);
      }
      for (j = 0; j < groups.length; j += 1) {
        g = groups[j];
        h += '<section class="grp"><h2>' + esc(g.book || '강의') + '</h2><div class="rows">';
        for (i = 0; i < g.list.length; i += 1) h += rowHTML(g.list[i], rec, today, am['i' + g.list[i].id]);
        h += '</div></section>';
      }
    }
    h += footHTML() + '</div>';
    app.innerHTML = h;
  }
  /* 결석한 날 수업 카드에 올릴 강의: 결석 · 아직 열림 · 다 보지 않음(선생님 확인 = 끝남) · 결석한 날이 오늘~13일 전 ·
     최근 결석한 날 → 많이 본 것 → id 차례 */
  function absList(arr, am, today) {
    var out = [], i, l, a, dd;
    for (i = 0; i < arr.length; i += 1) {
      l = arr[i]; a = am['i' + l.id];
      if (!a || a.att !== 'abs' || !a.day || l.ended || l.confirmed || (+l.pct || 0) >= L.DONE) continue;
      dd = dayDiff(today, a.day);
      if (dd < 0 || dd > 13) continue;
      out.push(l);
    }
    out.sort(function (x, y) {
      var dx = am['i' + x.id].day, dy = am['i' + y.id].day;
      if (dx !== dy) return dx < dy ? 1 : -1;
      var px = +x.pct || 0, py = +y.pct || 0;
      if (px !== py) return py - px;
      return x.id < y.id ? -1 : (x.id > y.id ? 1 : 0);
    });
    return out;
  }
  /* 결석 카드 = 카드 하나(div) 안에 링크: 위 = 그 강의 · 아래 줄 = 다른 강의 «이어서 보기»(cont) · «결석한 날 수업 N편 더»(more) */
  function absCardHTML(l, a, rec, cont, more) {
    var pct = +l.pct || 0, pos = +l.pos || 0;
    var h = '<div class="abs1 card" data-top="abs"><a class="absgo" href="#v=' + encodeURIComponent(l.id) + '" data-act="go">' +
      '<span class="lab">' + esc(M.absLab) + ' · ' + esc(L.fmtDay(a.day)) + '</span>' +
      '<div class="tt">' + esc(l.title) + '</div>' +
      '<div class="bk">' + esc(l.book || '') + '</div><div class="ln">';
    if (rec && pos > 0) h += '<b>' + esc(L.fmtDur(pos)) + '부터 이어 보기</b>';
    else h += '<b>처음부터 보기</b>';
    if (rec && pct > 0) h += '<span class="pbar"><i style="width:' + pct + '%"></i></span><em>' + pct + '%</em>';
    h += '</div><p class="tip">' + esc(M.absTip) + '</p></a>';
    if (cont) {
      /* «이어서 보기 · 18~32번 · 12:40부터»(C2 검수 L3 · 어디부터인지는 본 자리가 있을 때만) */
      var cpos = +cont.pos || 0;
      h += '<a class="absln abscont" href="#v=' + encodeURIComponent(cont.id) + '" data-act="go">' +
        '<span class="k">' + esc(M.contLab) + '</span><span class="v">· ' + esc(cont.title) +
        (rec && cpos > 0 ? ' · ' + esc(L.fmtDur(cpos)) + '부터' : '') + '</span></a>';
    }
    if (more > 0) {
      h += '<button class="absln absmore" type="button" data-act="absmore"><span class="k">' +
        esc(M.absLab) + ' ' + more + '편 더</span></button>';
    }
    return h + '</div>';
  }
  /* 이어서 보기: 다 보지 않은 강의 중 마지막으로 본 것(기록 동의일 때만) · skip = 뺄 강의({'i'+id: 1} · 결석한 날 수업) */
  function contBest(arr, skip) {
    var best = null, bt = -Infinity, i, l, t;
    skip = skip || {};
    for (i = 0; i < arr.length; i += 1) {
      l = arr[i];
      if (l.ended || l.confirmed || (+l.pct || 0) >= L.DONE || !l.last_at || skip['i' + l.id]) continue;
      t = L.ts(l.last_at);
      if (t > bt) { bt = t; best = l; }
    }
    return best;
  }

  /* ------------------------------------------------------------ 학교 시험 범위(C2) */
  /* 범위 한 줄의 강의 중 이 목록에서 열 수 있는 것(공개 끝 뺌 · 서버 차례 = 수업일 이른 차례) */
  function rngLecs(it) {
    var out = [], ids = it && Object.prototype.toString.call(it.lectures) === '[object Array]' ? it.lectures : [], i, l;
    for (i = 0; i < ids.length; i += 1) {
      l = findLec(ids[i]);
      if (l && !l.ended && out.indexOf(l) < 0) out.push(l);
    }
    return out;
  }
  /* 카드에 띄울 시험 → {it, c:{title, sub, n, during, total, done}, ls} · 없으면 null
     범위가 저장된 시험만(서버가 D-20부터 시험 끝날까지만 줌 · 여기서도 D-20 넘으면 안 띄움) · 일정 없는 학교 = 빈 카드도 없음 */
  function examTop(rec) {
    var r = S.rng, today = L.isoDay(), items = [], i, it, ls, n, j, best, c;
    if (!r || Object.prototype.toString.call(r.items) !== '[object Array]') return null;
    for (i = 0; i < r.items.length; i += 1) {
      it = r.items[i];
      if (!it || typeof it !== 'object') continue;
      ls = rngLecs(it);
      if (!ls.length) continue;
      for (n = 0, j = 0; j < ls.length; j += 1) { if (isDone(ls[j], +ls[j].pct || 0)) n += 1; }
      items.push({ id: it.id, name: it.name, exam_on: it.exam_on, end_on: it.end_on, lectures: ls, done: n, src: it });
    }
    best = L.rngPickItem(items, today);
    if (!best) return null;
    c = L.rngCard(best, today, rec);
    if (!c || (!c.during && c.n > 20)) return null;
    return { it: best.src, c: c, ls: best.lectures };
  }
  function examCardHTML(ex, rec) {
    var c = ex.c, p = c.total ? Math.round(c.done * 100 / c.total) : 0;
    return '<a class="exam1 card" href="#rng" data-act="go" data-top="exam">' +
      '<span class="lab">' + esc(M.examLab) + '</span>' +
      '<div class="tt">' + esc(c.title) + '</div>' +
      '<div class="ln"><b>' + esc(c.sub) + '</b>' +
      (rec ? '<span class="pbar"><i style="width:' + p + '%"></i></span>' : '') + '</div></a>';
  }
  /* 범위 영상 목록(#rng): 덜 본 것 먼저(다 본 것은 아래 · 같으면 수업일 이른 차례) */
  function showRange() {
    var m = recMode(), rec = m === 'agree', ex = examTop(rec);
    if (!ex) { clearHash(); showList(); return; } /* 시험이 지났거나 범위가 빠짐 = 목록으로 */
    S.view = 'rng';
    var today = L.isoDay(), am = attMap(), ls = ex.ls.slice(), ord = {}, i;
    for (i = 0; i < ls.length; i += 1) ord[ls[i].id] = i;
    if (rec) {
      ls.sort(function (x, y) {
        var px = +x.pct || 0, py = +y.pct || 0, dx = isDone(x, px) ? 1 : 0, dy = isDone(y, py) ? 1 : 0;
        return (dx - dy) || (px - py) || (ord[x.id] - ord[y.id]);
      });
    }
    var h = '<div class="wrap"><div class="top">' +
      '<button class="backb hit" type="button" data-act="list">← 목록</button><span class="sp"></span>' +
      '<span class="me">' + esc(S.name) + '</span></div>' + norecHTML() +
      '<div class="rhead"><h1>' + esc(ex.c.title) + '</h1><p>' + esc(ex.c.sub) + (rec ? ' · 덜 본 영상부터' : '') + '</p></div>' +
      '<section class="grp"><div class="rows">';
    for (i = 0; i < ls.length; i += 1) h += rowHTML(ls[i], rec, today, am['i' + ls[i].id]);
    h += '</div></section>' + footHTML() + '</div>';
    app.innerHTML = h;
  }
  /* 강의 줄의 출결 한 줄 · 결석 = «결석한 날 수업 · 11.11(수)»(아래에 진도 그대로) · 교실 = 진도 대신 회색 «교실에서 들음» */
  function attLine(l, a, rec, st) {
    if (!a || l.ended) return { lab: '', st: rec ? '<div class="st ' + st.cls + '">' + esc(st.txt) + '</div>' : '' };
    if (a.att === 'abs') {
      /* 검수 A L1: 날짜는 수업일이 둘 이상일 때만(한 날이면 위 «수업일» 줄과 같은 날짜가 두 번 나옴) */
      var many = Object.prototype.toString.call(a.days) === '[object Array]' && a.days.length >= 2;
      return { lab: '<div class="ab">' + esc(M.absLab) + (a.day && many ? ' · ' + esc(L.fmtDay(a.day)) : '') + '</div>',
        st: rec ? '<div class="st ' + st.cls + '">' + esc(st.txt) + '</div>' : '' };
    }
    if (a.att === 'in') {
      var pct = +l.pct || 0, t = M.inLab;
      if (!rec) return { lab: '<div class="ab in">' + esc(t) + '</div>', st: '' }; /* 기록 안 함 = 진도 줄 없이 출결만 */
      if (l.confirmed) return { lab: '', st: '<div class="st ' + st.cls + '">' + esc(st.txt) + '</div>' };
      if (pct >= L.DONE) t += ' · 복습 완료';
      else if (pct > 0 || l.first_at) t += ' · 복습 ' + pct + '%';
      return { lab: '', st: '<div class="st in">' + esc(t) + '</div>' };
    }
    return { lab: '', st: rec ? '<div class="st ' + st.cls + '">' + esc(st.txt) + '</div>' : '' };
  }
  function rowHTML(l, rec, today, a) {
    var pct = +l.pct || 0, st = statusOf(l), done = isDone(l, pct);
    var isNew = !l.first_at && l.posted_on && dayDiff(today, l.posted_on) <= 3 && dayDiff(today, l.posted_on) >= 0;
    var tags = '';
    if (isNew && !l.ended) tags += '<span class="tag new">NEW</span>';
    if (+l.ans_new > 0) tags += '<span class="tag ans">새 답변 ' + (+l.ans_new) + '</span>';
    var al = attLine(l, a, rec, st);
    var inner = '<div class="mn"><div class="tt">' + esc(l.title) + tags + '</div>' +
      '<div class="mt">' + metaOf(l, a) + '</div>' + al.lab;
    if (l.ended) {
      inner += '<span class="tag end">' + M.endedChip + '</span>';
    } else {
      inner += al.st;
      var un = L.untilNote(l.until);
      if (un) inner += '<div class="un">' + esc(un) + '</div>';
    }
    inner += '</div>';
    /* 검수 A M7: 교실에서 들은 강의는 복습 진도가 없으면 0% 고리를 숨김(안 본 강의처럼 보이지 않게) */
    if (rec && !l.ended && !(a && a.att === 'in' && !(pct > 0) && !done)) inner += ring(pct, done);
    if (l.ended) return '<div class="row off" aria-disabled="true" data-id="' + esc(l.id) + '">' + inner + '</div>';
    return '<a class="row" href="#v=' + encodeURIComponent(l.id) + '" data-act="go" data-id="' + esc(l.id) + '">' + inner + '</a>';
  }

  /* «결석한 날 수업 N편 더» = 다음 결석한 날 수업 줄로 내려가 잠깐 칠함 · 누를 때마다 그다음 강의로(끝나면 둘째부터 다시 · 검수 A L19) */
  function jumpAbs() {
    var ab = absList(S.lectures.slice().reverse(), attMap(), L.isoDay()), id;
    if (ab.length < 2) return;
    id = ab[1 + (S.absAt % (ab.length - 1))].id;
    S.absAt += 1;
    var rs = app.querySelectorAll('.row[data-id]'), i, r = null;
    for (i = 0; i < rs.length; i += 1) { if (rs[i].getAttribute('data-id') === id) { r = rs[i]; break; } }
    if (!r) return;
    try { r.scrollIntoView({ block: 'center' }); } catch (e) { r.scrollIntoView(); }
    var base = r.className.replace(/(^|\s)flash(?=\s|$)/g, ''); /* 칠하는 중에 또 눌러도 칠이 남지 않게 */
    r.className = base + ' flash';
    try { r.focus(); } catch (e2) { /* 없음 */ }
    setTimeout(function () { r.className = base; }, 1600);
  }

  function showEnded() {
    S.view = 'ended';
    app.innerHTML = '<div class="wrap"><div class="end1"><img class="logo" src="his_fish_green.png" alt="" style="margin:0 auto 18px;height:26px">' +
      '<p>' + M.ended + '</p><button class="btn-line" type="button" data-act="list">목록으로</button></div></div>';
  }

  /* ------------------------------------------------------------ 재생기 */
  /* 유튜브: {time(), dur(), state(), seek(t), play(), pause(), rate(r)} */
  function YTP(box, vid, start, cb) {
    var s = this;
    s.p = null; s.ok = false; s.dead = false;
    L.loadYT().then(function (YT) {
      if (s.dead) return;
      var pv = { playsinline: 1, rel: 0, modestbranding: 1 };
      if (start > 0) pv.start = Math.floor(start);
      if (/^https?:$/.test(location.protocol)) pv.origin = location.protocol + '//' + location.host;
      try {
        s.p = new YT.Player(box, {
          host: 'https://www.youtube-nocookie.com',
          videoId: vid, width: '100%', height: '100%', playerVars: pv,
          events: {
            onReady: function () { if (s.dead) return; s.ok = true; cb.ready(); },
            onStateChange: function (e) { if (!s.dead) cb.state(e.data); },
            onPlaybackRateChange: function (e) { if (!s.dead) cb.rate(e.data); },
            onError: function (e) { if (!s.dead) cb.error(e.data); }
          }
        });
      } catch (e1) { cb.error(5); }
    }, function () { if (!s.dead) cb.error(-1); });
  }
  YTP.prototype.call = function (fn, a, b) {
    if (!this.ok || !this.p || typeof this.p[fn] !== 'function') return undefined;
    try { return this.p[fn](a, b); } catch (e) { return undefined; }
  };
  YTP.prototype.time = function () { return +this.call('getCurrentTime') || 0; };
  YTP.prototype.dur = function () { return +this.call('getDuration') || 0; };
  YTP.prototype.state = function () { var v = this.call('getPlayerState'); return v == null ? -1 : +v; };
  YTP.prototype.seek = function (t) { this.call('seekTo', Math.max(0, t), true); };
  YTP.prototype.play = function () { this.call('playVideo'); };
  YTP.prototype.pause = function () { this.call('pauseVideo'); };
  YTP.prototype.rate = function (r) {
    if (arguments.length) { this.call('setPlaybackRate', r); return r; }
    var v = +this.call('getPlaybackRate');
    return v > 0 ? v : 1;
  };
  YTP.prototype.destroy = function () {
    this.dead = true;
    try { if (this.p && this.p.destroy) this.p.destroy(); } catch (e) { /* 없음 */ }
  };

  /* 가짜 재생기(&fake=1): 시계는 Lec.now() · 아이폰처럼 처음 틀기 전 길이 0 */
  function Fake(box, D, cb) {
    var s = this;
    s.D = D; s.t = 0; s.on = false; s.r = 1; s.w = 0; s.st = -1; s.started = false; s.cb = cb; s.dead = false;
    box.className = 'fake';
    box.innerHTML = '<span class="fl">연습용 재생기</span><span class="ft" id="fkT">0:00</span>' +
      '<button type="button" data-act="fake" id="fkB">재생</button>';
    s.box = box;
    s.iv = setInterval(function () { s.adv(); s.draw(); }, 250);
    setTimeout(function () { if (!s.dead) cb.ready(); }, 0);
  }
  Fake.prototype.fire = function (k, v) {
    var cb = this.cb, s = this;
    setTimeout(function () { if (!s.dead) cb[k](v); }, 0);
  };
  Fake.prototype.adv = function () {
    if (!this.on) return;
    var w = L.now();
    this.t += Math.max(0, w - this.w) / 1000 * this.r;
    this.w = w;
    if (this.t >= this.D) { this.t = this.D; this.on = false; this.st = 0; this.fire('state', 0); }
  };
  Fake.prototype.draw = function () {
    var a = $('fkT'), b = $('fkB');
    if (a) a.innerHTML = L.fmtDur(this.t) + ' / ' + L.fmtDur(this.D);
    if (b) b.innerHTML = this.on ? '멈춤' : '재생';
  };
  Fake.prototype.time = function () { this.adv(); return this.t; };
  Fake.prototype.dur = function () { return this.started ? this.D : 0; };
  Fake.prototype.state = function () { this.adv(); return this.st; };
  Fake.prototype.play = function () {
    this.adv();
    if (this.t >= this.D) this.t = 0;
    this.started = true; this.on = true; this.w = L.now(); this.st = 1;
    this.fire('state', 1); this.draw();
  };
  Fake.prototype.pause = function () {
    this.adv();
    if (!this.on) return;
    this.on = false; this.st = 2;
    this.fire('state', 2); this.draw();
  };
  Fake.prototype.seek = function (x) {
    this.adv();
    this.t = Math.max(0, Math.min(this.D, +x || 0));
    this.w = L.now();
    if (this.st === 0) this.st = 2;
    this.draw();
  };
  Fake.prototype.rate = function (r) {
    if (arguments.length) { this.adv(); this.w = L.now(); this.r = +r || 1; this.fire('rate', this.r); return this.r; }
    return this.r;
  };
  Fake.prototype.destroy = function () { this.dead = true; clearInterval(this.iv); };

  /* ------------------------------------------------------------ 플레이어 화면 */
  function showPlayer(l) {
    S.view = 'player';
    S.tab = 'toc';
    S.q = { kind: 'content', at: null, frozen: false, useAt: true, priv: false, items: null, reply: null, del: null, busy: false };
    var rec = recMode() === 'agree';
    var h = '<div class="wrap wide"><div class="ptop">' +
      '<button class="backb hit" type="button" data-act="list">← 목록</button>' +
      '<div class="pt"><b>' + esc(l.title) + '</b><span>' + esc(l.book || '') + '</span></div></div>' +
      norecHTML() +
      '<div class="pgrid"><div class="pl">' +
      '<p class="paper" id="paperL" hidden></p>' +
      '<div class="vid" id="vid"><div class="yt" id="ytbox"></div></div>' +
      '<div class="stopw m" id="stopM" role="status" hidden></div>' +
      '<div class="card verr" id="verr" hidden><p id="verrT"></p><button class="btn-line" type="button" data-act="list">목록으로</button></div>' +

    if (S.tab === 'qna' && S.q && !S.q.frozen && S.q.useAt) paintScene();
    if (T.played && T.P.state() === 1) {
      var rs = $('resume');
      if (rs && !rs.hidden && t > T.resumeL + 20) rs.hidden = true;
    }
  }

  function drawTabs() {
    var a = $('tabToc'), b = $('tabQna');
    if (!a || !b) return;
    a.className = S.tab === 'toc' ? 'on' : '';
    b.className = S.tab === 'qna' ? 'on' : '';
    a.setAttribute('aria-selected', S.tab === 'toc' ? 'true' : 'false');
    b.setAttribute('aria-selected', S.tab === 'qna' ? 'true' : 'false');
    var lab = '질문';
    if (S.q && S.q.items) lab += ' ' + topCount();
    var an = T ? +T.lec.ans_new || 0 : 0;
    if (an > 0) lab += '<span class="tag ans">새 답변 ' + an + '</span>';
    b.innerHTML = lab;
  }
  function topCount() {
    var n = 0, i, a = (S.q && S.q.items) || [];
    for (i = 0; i < a.length; i += 1) { if (a[i].parent == null) n += 1; }
    return n;
  }

  function drawToc(force) {
    if (!T) return;
    var ch = T.lec.chapters || [];
    var box = $('tbody');
    if (!box) return;
    if (!ch.length) {
      if (force || T.tocSig !== 'none') { T.tocSig = 'none'; box.innerHTML = '<div class="empty">목차가 아직 없어요.</div>'; }
      return;
    }
    var D = T.durL > 0 ? T.durL : (+T.lec.dur || 0);
    var seen = T.rec && D > 0 ? L.chapterSeen(bitsNow(), ch, D) : [];
    var cur = L.chapterAt(ch, lecTime());
    var marks = [], i;
    for (i = 0; i < ch.length; i += 1) {
      var v = seen[i] || 0;
      marks.push(v >= 0.9 ? 'full' : (v >= 0.1 ? 'half' : ''));
    }
    var tags = paperTags();
    var sig = cur + '|' + marks.join(',') + '|' + T.rec + '|' + tags.join(',');
    if (!force && sig === T.tocSig) return;
    T.tocSig = sig;
    var h = '<ul class="toc">';
    for (i = 0; i < ch.length; i += 1) {
      h += '<li><button type="button" data-act="seek" data-t="' + (+ch[i].t || 0) + '"' + (i === cur ? ' class="cur" aria-current="true"' : '') + '>' +
        (T.rec ? '<span class="dot ' + marks[i] + '"></span>' : '') +
        '<span class="tt">' + esc(ch[i].title) + (tags[i] ? '<span class="tag wb">' + esc(tags[i]) + '</span>' : '') + '</span>' +
        '<span class="tm">' + esc(L.fmtDur(ch[i].t)) + '</span></button></li>';
    }
    box.innerHTML = h + '</ul>';
  }

  function seekL(t) {
    if (!T || !T.P || T.err) return;
    t = Math.max(0, +t || 0);
    if (!T.ready && L.DEMO && !L.FAKE && (+T.lec.dur || 0) > 0) {
      T.pendSeekL = t;
      T.P.play();
      return;
    }
    T.P.seek(t / T.S);
    T.prevT = null;
    if (T.P.state() !== 1) T.P.play();
    var rs = $('resume');
    if (rs) rs.hidden = true;
    paint();
  }

  /* ------------------------------------------------------------ 질문 */
  function openQna() {
    var box = $('tbody');
    if (!box || !T) return;
    var rec = recMode() === 'agree';
    var h = '';
    if (rec) {
      h += '<div class="qf" id="qf"><div class="kinds" role="group" aria-label="질문 종류">' +
        '<button type="button" class="kc' + (S.q.kind === 'content' ? ' on' : '') + '" data-act="kind" data-k="content">내용</button>' +
        '<button type="button" class="kc' + (S.q.kind === 'tech' ? ' on' : '') + '" data-act="kind" data-k="tech">영상·진도 문제</button></div>' +
        '<textarea id="qBody" maxlength="2000" placeholder="어디가 / 무엇이 / 내 생각은" aria-label="질문"></textarea>' +
        '<div class="qrow"><button type="button" class="scn" id="qScn" data-act="scene"></button>' +
        '<label class="chk"><input type="checkbox" id="qPriv"' + (S.q.priv ? ' checked' : '') + '>선생님만 보기</label>' +
        '<span class="cnt" id="qCnt">0/1000</span></div>' +
        '<div class="send"><p class="err" id="qErr" role="alert"></p><button type="button" class="btn-fill" id="qPost" data-act="post">올리기</button></div></div>';
    } else {
      h += '<div class="qnote">' + M.qnorec + ' · <a href="#rec">기록 안내</a></div>';
    }
    h += '<div class="qlist" id="qList"></div>';
    box.innerHTML = h;
    paintScene();
    if (S.q.items) drawQList(); else loadQna();
  }

  function loadQna() {
    if (!T) return;
    var lid = T.lec.id, k = S.key;
    L.qna(k, lid).then(function (r) {
      if (k !== S.key || !T || T.lec.id !== lid) return;
      if (!r || !r.ok) {
        if (r && r.err === 'key') { reLogin(); return; }
        setHTML('qList', '<div class="empty">' + esc(M.net) + '</div>');
        return;
      }
      S.q.items = r.items || [];
      T.lec.ans_new = 0;
      drawTabs();
      if (S.tab === 'qna') drawQList();
    }, function () {
      if (k !== S.key) return;
      if (S.tab === 'qna') setHTML('qList', '<div class="empty">' + esc(M.net) + '</div>');
    });
  }

  function whoOf(it) {
    if (it.teacher) return '선생님';
    if (it.mine) return '나';
    return it.who || '';
  }
  function drawQList() {
    var box = $('qList');
    if (!box || !S.q) return;
    var a = S.q.items || [], tops = [], kids = {}, i, it;
    for (i = 0; i < a.length; i += 1) {
      it = a[i];
      if (it.parent == null) tops.push(it);
      else { if (!kids[it.parent]) kids[it.parent] = []; kids[it.parent].push(it); }
    }
    tops.reverse(); /* 새 질문이 위 */
    if (!tops.length) { box.innerHTML = '<div class="empty">아직 남긴 질문이 없어요.</div>'; return; }
    var rec = recMode() === 'agree';
    var h = '', j, k, ks, qs;
    for (i = 0; i < tops.length; i += 1) {
      it = tops[i];
      qs = it.mine ? L.qState(it) : null;
      h += '<article class="q" data-qid="' + esc(it.id) + '"><div class="qh"><span class="who">' + esc(whoOf(it)) + '</span>' +
        '<span class="pill ' + (it.kind === 'tech' ? 'k-t">영상·진도 문제' : 'k-c">내용') + '</span>' +
        (it.private ? '<span class="pill pv">선생님만 보기</span>' : '') +
        '<span class="when">' + esc(L.fmtWhen(it.created_at)) + '</span>' +
        (qs ? '<span class="pill st" style="background:' + qs.bg + ';color:' + qs.fg + '">' + esc(qs.label) + '</span>' : '') +
        '</div>';
      if (it.at_s != null) {
        h += '<button type="button" class="scb" data-act="seek" data-t="' + (+it.at_s) + '">' + esc(L.sceneLabel(+it.at_s, T ? T.lec.chapters : [])) + '</button>';
      }
      h += '<div class="bd">' + esc(it.body) + '</div>';
      ks = kids[it.id] || [];
      for (j = 0; j < ks.length; j += 1) {
        k = ks[j];
        h += '<div class="rp' + (k.teacher ? ' t' : '') + '"><div class="qh"><span class="who">' + esc(whoOf(k)) + '</span>' +
          '<span class="when">' + esc(L.fmtWhen(k.created_at)) + '</span></div><div class="bd">' + esc(k.body) + '</div>' +
          (k.mine && rec ? delHTML(k) : '') + '</div>';
      }
      if (it.mine && rec) {
        h += '<div class="acts"><button type="button" class="tbtn hit" data-act="reply" data-id="' + esc(it.id) + '">다시 묻기</button>' +
          (it.answered ? '<span class="no">' + M.qanswered + '</span>' : delBtn(it)) + '</div>';
        if (S.q.reply === it.id) {
          h += '<div class="rf"><textarea id="rBody" maxlength="2000" placeholder="어디가 / 무엇이 / 내 생각은" aria-label="다시 묻기"></textarea>' +
            '<div class="send"><p class="err" id="rErr" role="alert"></p>' +
            '<button type="button" class="tbtn hit" data-act="rcancel">그만두기</button>' +
            '<button type="button" class="btn-sm" data-act="rpost" data-id="' + esc(it.id) + '">올리기</button></div></div>';
        }
      }
      h += '</article>';
    }
    box.innerHTML = h;
    var rb = $('rBody');
    if (rb && S.q.replyText) rb.value = S.q.replyText;
  }
  function delBtn(it) {
    if (S.q.del === it.id) {
      return '<span class="ask">정말 지울까요?</span><button type="button" class="tbtn hit" data-act="delyes" data-id="' + esc(it.id) + '">지우기</button>' +
        '<button type="button" class="tbtn hit" data-act="delno">그만두기</button>';
    }
    return '<button type="button" class="tbtn hit" data-act="del" data-id="' + esc(it.id) + '">지우기</button>';
  }
  function delHTML(k) {
    return '<div class="acts">' + (k.answered ? '' : delBtn(k)) + '</div>';
  }

  function paintScene() {
    var b = $('qScn');
    if (!b || !T || !S.q) return;
    if (!S.q.useAt) { b.className = 'scn off'; b.innerHTML = '장면 넣기'; return; }
    var at = S.q.frozen && S.q.at != null ? S.q.at : Math.floor(lecTime());
    if (!S.q.frozen) S.q.at = at;
    b.className = 'scn';
    b.innerHTML = '지금 장면 ' + esc(L.sceneLabel(at, T.lec.chapters || []));
  }

  function qErr(e) {
    if (e === 'many') return M.qmany;
    if (e === 'input') return M.qinput;
    if (e === 'parent') return M.qparent;
    if (e === 'ended') return M.ended;
    if (e === 'no_consent') return M.qnorec;
    if (e === 'answered') return M.qanswered;
    return M.net;
  }

  function postQ() {
    if (!T || !S.q || S.q.busy) return;
    var ta = $('qBody'), btn = $('qPost');
    if (!ta) return;
    var body = L.btrim(String(ta.value || ''));
    var n = L.clen(body);
    if (n < 1 || n > 1000) { setHTML('qErr', esc(M.qinput)); return; }
    var at = S.q.useAt ? (S.q.at == null ? Math.floor(lecTime()) : S.q.at) : null;
    var pv = $('qPriv');
    S.q.busy = true; btn.disabled = true; setHTML('qErr', '');
    var lid = T.lec.id, k = S.key;
    L.ask(k, lid, body, at, pv ? pv.checked : false, null, S.q.kind).then(function (r) {
      if (k !== S.key || !S.q) return;
      S.q.busy = false; btn.disabled = false;
      if (r && r.ok) {
        ta.value = '';
        S.q.frozen = false;
        setHTML('qCnt', '0/1000');
        paintScene();
        S.q.items = null;
        loadQna();
        return;
      }
      if (r && r.err === 'key') { reLogin(); return; }
      setHTML('qErr', esc(qErr(r && r.err)));
    }, function () {
      if (k !== S.key || !S.q) return;
      S.q.busy = false; btn.disabled = false;
      setHTML('qErr', esc(M.net));
    });
  }

  function postReply(pid) {
    if (!T || !S.q || S.q.busy) return;
    var ta = $('rBody');
    if (!ta) return;
    var body = L.btrim(String(ta.value || '')), n = L.clen(body);
    if (n < 1 || n > 1000) { setHTML('rErr', esc(M.qinput)); return; }
    S.q.busy = true;
    var k = S.key;
    L.ask(k, T.lec.id, body, null, false, pid, null).then(function (r) {
      if (k !== S.key || !S.q) return;
      S.q.busy = false;
      if (r && r.ok) { S.q.reply = null; S.q.replyText = ''; S.q.items = null; loadQna(); return; }
      if (r && r.err === 'key') { reLogin(); return; }
      setHTML('rErr', esc(qErr(r && r.err)));
    }, function () {
      if (k !== S.key || !S.q) return;
      S.q.busy = false;
      setHTML('rErr', esc(M.net));
    });
  }

  function delQ(id) {
    if (!S.q || S.q.busy) return;
    S.q.busy = true;
    var k = S.key;
    L.qdel(k, id).then(function (r) {
      if (k !== S.key || !S.q) return;
      S.q.busy = false; S.q.del = null;
      if (r && r.ok) { S.q.items = null; loadQna(); return; }
      if (r && r.err === 'key') { reLogin(); return; }
      if (r && r.err === 'answered') {
        drawQList();
        var el = app.querySelector('[data-qid="' + id + '"] .acts');
        if (el) el.insertAdjacentHTML('beforeend', '<span class="no">' + M.qanswered + '</span>');
        return;
      }
      S.q.items = null; loadQna();
    }, function () {
      if (k !== S.key || !S.q) return;
      S.q.busy = false; S.q.del = null;
      drawQList();
    });
  }

  /* ------------------------------------------------------------ 나가기 */
  /* 누르면 바로 로그인 화면(서버 답을 기다리지 않음). 앞 학생 열쇠와 기록(보내는 중 · 못 보낸 것)을
     잡아 두고 뒤에서 보낸 뒤 나가기를 알림 · 기록 답이 다 오거나 4초가 지나면 · 실패해도 화면은 그대로 */
  function logout() {
    var k = S.key, a = L.lsGet(LS.pend, []), i, n, sent = false;
    teardown();
    var w = fly.slice();
    L.lsDel(LS.key); L.lsDel(LS.sess); L.lsDel(LS.pend); L.lsDel(LS.rate);
    S.key = ''; S.name = ''; S.home = null; S.lectures = []; S.consent = null; S.att = null; S.paper = null; S.rng = null;
    clearHash();
    showLogin('');
    if (Object.prototype.toString.call(a) === '[object Array]') {
      for (i = 0; i < a.length; i += 1) { if (a[i]) w.push(L.beat(a[i])); }
    }
    function bye() {
      if (sent) return;
      sent = true;
      L.logout(k).then(null, function () { /* 없음 */ });
    }
    function one() { n -= 1; if (n <= 0) bye(); }
    n = w.length;
    for (i = 0; i < w.length; i += 1) w[i].then(one, one);
    if (!n) bye();
    setTimeout(bye, 4000);
  }

  /* ------------------------------------------------------------ 연습용 */
  function demoGone() {
    var M2 = window.LecMock;
    if (!M2) return;
    var d = M2.db(), key = L.hex64(), at = nowIso();
    d.key.push({ key: key, sid: 's0901|오가을', rid: 's0901', pin: '', sname: '오가을', cls: ['c-g1a'], dev: '개인 링크', made_by: 'Benjamin', created_at: at, last_at: at });
    M2.save(d);
    S.key = key; S.att = null; S.paper = null; S.rng = null;
    L.lsSet(LS.key, key);
    loadHome();
  }

  /* ------------------------------------------------------------ 누르기 */
  document.addEventListener('click', function (e) {
    var el = findAct(e.target);
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'go') { S.nav = true; return; } /* 주소(#v=) 그대로 따라감 */
    if (el.tagName === 'A' && act !== 'go') e.preventDefault();
    if (act === 'dfill') {
      var n = $('lgName'), p = $('lgPin');
      if (n) n.value = attr(el, 'data-n');
      if (p) p.value = attr(el, 'data-p');
      setHTML('lgErr', '');
    } else if (act === 'dgone') { demoGone(); }
    else if (act === 'dreset') {
      if (window.LecMock) window.LecMock.reset();
      L.lsDel(LS.key); L.lsDel(LS.sess); L.lsDel(LS.pend);
      showLogin('');
    } else if (act === 'agree') { choose('agree', el); }
    else if (act === 'none') { choose('none', el); }
    else if (act === 'recback') { goList(); }
    else if (act === 'logout') { logout(); }
    else if (act === 'out') { L.lsDel(LS.key); S.key = ''; S.home = null; S.att = null; S.paper = null; S.rng = null; clearHash(); showLogin(''); }
    else if (act === 'retry') { loadHome(); }
    else if (act === 'list') { goList(); }
    else if (act === 'absmore') { jumpAbs(); }
    else if (act === 'restart') {
      if (T && T.P) { T.pendSeekL = null; T.skipTo = 0; seekL(0); }   /* 처음부터 = 모든 멈춤을 다시 봄(검수 B2 M-1) */
      var rs = $('resume'); if (rs) rs.hidden = true;
    } else if (act === 'rate') {
      var r = +attr(el, 'data-r');
      if (T && T.P && RATES.indexOf(r) >= 0) {
        T.P.rate(r); T.rateSet = true;
        L.lsSet(LS.rate, r);
        setTimeout(paintRate, 60);
        paintRate();
      }
    } else if (act === 'back10') {
      if (T && T.P) seekL(Math.max(0, lecTime() - 10));
    } else if (act === 'fake') {
      if (T && T.P) { if (T.P.state() === 1) T.P.pause(); else T.P.play(); }
    } else if (act === 'stopGo' || act === 'stopLater') {
      /* C7 · 계속 보기 = 바로 재생 · 나중에 = 판을 닫고 바로 이어 재생(그 지문은 이 화면에서 다시 안 멈춤 · 검수 A)
         영상 끝에서 선 판(검수 B2 L-2)은 닫기만(다시 틀지 않음) */
      var endOn = !!(T && T.stopEnd);
      stopHide();
      if (T && T.P && !T.err && !endOn) T.P.play();
    } else if (act === 'tab') {
      var tb = attr(el, 'data-tab');
      if (tb === S.tab) return;
      S.tab = tb;
      drawTabs();
      if (tb === 'toc') drawToc(true); else openQna();
    } else if (act === 'seek') {
      seekL(+attr(el, 'data-t'));
    } else if (act === 'kind') {
      if (!S.q) return;
      S.q.kind = attr(el, 'data-k') === 'tech' ? 'tech' : 'content';
      var ks = app.querySelectorAll('.kc'), i;
      for (i = 0; i < ks.length; i += 1) ks[i].className = 'kc' + (ks[i].getAttribute('data-k') === S.q.kind ? ' on' : '');
    } else if (act === 'scene') {
      if (!S.q) return;
      if (S.q.useAt) { S.q.useAt = false; }
      else { S.q.useAt = true; S.q.at = Math.floor(lecTime()); S.q.frozen = true; }
      paintScene();
    } else if (act === 'post') { postQ(); }
    else if (act === 'reply') {
      var cur = $('rBody');
      S.q.replyText = cur && S.q.reply ? cur.value : '';
      S.q.reply = S.q.reply === attr(el, 'data-id') ? null : attr(el, 'data-id');
      if (S.q.reply !== attr(el, 'data-id')) S.q.replyText = '';
      S.q.del = null;
      drawQList();
      var rb = $('rBody'); if (rb) { try { rb.focus(); } catch (e3) { /* 없음 */ } }
    } else if (act === 'rcancel') { S.q.reply = null; S.q.replyText = ''; drawQList(); }
    else if (act === 'rpost') { postReply(attr(el, 'data-id')); }
    else if (act === 'del') { S.q.del = attr(el, 'data-id'); keepReply(); drawQList(); }
    else if (act === 'delno') { S.q.del = null; keepReply(); drawQList(); }
    else if (act === 'delyes') { keepReply(); delQ(attr(el, 'data-id')); }
  });
  function keepReply() { var rb = $('rBody'); if (rb && S.q) S.q.replyText = rb.value; }

  /* 누르는 중인지(quietList 가 봄) */
  var press = { on: false, at: 0 };
  function pressOn() { press.on = true; press.at = Date.now(); }
  function pressOff() { press.on = false; press.at = Date.now(); }
  document.addEventListener('touchstart', pressOn, true);
  document.addEventListener('mousedown', pressOn, true);
  document.addEventListener('touchend', pressOff, true);
  document.addEventListener('touchcancel', pressOff, true);
  document.addEventListener('mouseup', pressOff, true);

  document.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'loginForm') { e.preventDefault(); doLogin(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t && t.id === 'qBody') setHTML('qCnt', L.clen(t.value) + '/1000');
    if (t && t.id === 'lgPin') { var v = t.value.replace(/[^0-9]/g, '').slice(0, 4); if (v !== t.value) t.value = v; }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.id === 'qPriv' && S.q) S.q.priv = !!t.checked;
  });
  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t && (t.id === 'qBody' || t.id === 'rBody') && T && T.P) {
      if (t.id === 'qBody' && S.q && S.q.useAt && !S.q.frozen) { S.q.at = Math.floor(lecTime()); S.q.frozen = true; paintScene(); }
      if (T.P.state() === 1) T.P.pause();
    }
  });
  window.addEventListener('hashchange', function () { S.nav = true; route(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && T) { sample(); sendBeat(true); }
  });
  window.addEventListener('pagehide', function () { if (T) { sample(); sendBeat(true); } });

  if (L.TEST) {
    window.__lecDbg = function () {
      return {
        view: S.view, rec: recMode(), tab: S.tab,
        T: T ? { id: T.lec.id, S: T.S, durL: T.durL, ready: T.ready, real: T.real, local: T.local, server: T.server, sess: T.sess, err: T.err, stopped: T.stopped,
          stopOn: T.stopOn, stopDone: Object.keys(T.stopDone), to: T.to, skipTo: T.skipTo, stopEnd: T.stopEnd } : null,
        paper: S.paper, rng: S.rng, absAt: S.absAt
      };
    };
  }

  /* ------------------------------------------------------------ 시작 */
  (function boot() {
    var m = String(location.hash || '').match(/^#k=([^&]+)/), hk = '';
    if (m) {
      try { hk = decodeURIComponent(m[1]); } catch (e) { hk = ''; } /* 깨진 개인 링크 = 없는 것으로 */
      clearHash();
    }
    if (hk) {
      S.key = hk;
      L.lsSet(LS.key, S.key);
      L.lsDel(LS.sess);
    } else {
      var k = L.lsGet(LS.key, '');
      S.key = typeof k === 'string' ? k : '';
    }
    pendFlush();
    if (!S.key) { showLogin(''); return; }
    app.innerHTML = '<div class="wrap"><div class="top"><img class="logo" src="his_fish_green.png" alt="히즈어학원"><span class="brand">히즈 온라인</span></div></div>';
    loadHome();
  })();
};
</script>
</body>
</html>
