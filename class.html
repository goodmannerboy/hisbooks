/* 설치 안내 결론안(11-16): 머리 아래 작은 줄 · 맥락마다 큰 단추 또는 번호 세 단계 · 단추 이름 칩(한 줄 · 낱말 가운데서 안 끊김) · 설치 끝 화면 · 영상 끝 한 줄 */
.pwc .pwsb{margin:-4px 0 12px;font-size:13px;color:var(--ink2);word-break:keep-all}
.pwc .pwld{margin:0;font-size:15px;line-height:1.55;text-align:justify;word-break:keep-all;line-break:strict}
.pwc .pwbd .btn-fill{margin:12px 0 4px}
.pwc .pwbd .btn-fill svg{display:block}
.pwc .pwn{margin:8px 0 0;font-size:13px;line-height:1.75;color:var(--ink2);text-align:justify;word-break:keep-all;line-break:strict}
.pwc .pwn .ky{height:24px;min-width:24px;font-size:13px}
.pwc .pwol{list-style:none;margin:4px 0 0;padding:0}
.pwc .pwol li{display:flex;align-items:flex-start;gap:10px;margin:0 0 14px;padding:0;border:0;font-size:15px;line-height:1.75;text-align:left;word-break:keep-all;line-break:strict}
.pwc .pwol li:last-child{margin-bottom:4px}
.pwc .pwol li:before{content:none}
.pwc .pwol .no{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin-top:2px;border-radius:50%;background:var(--fillB);color:var(--fillT);font-size:13px;font-weight:700;line-height:1}
.pwc .pwol .tx{flex:1 1 auto;min-width:0;text-align:justify}
.pwc .pwol small{display:block;margin-top:1px;font-size:13px;line-height:1.5;color:var(--ink2)}
.ky{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:26px;min-width:26px;margin:0 2px;padding:0 7px;border-radius:8px;background:#EFE6CF;color:var(--acc);font-size:14px;font-weight:400;line-height:1;vertical-align:middle;white-space:nowrap}
.ky svg{display:block}
html.stg .ky{background:#1A3B2C;color:#F4ECD7}
.kyw{white-space:nowrap}
.kyw>.ky{margin-right:0}
.pwc .pwpath{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;text-align:left}
.pwc .pwpath>span{white-space:nowrap}
.pwc .pwpath .ky{margin:0}
.pwc .pwdone{display:flex;flex-direction:column;align-items:center;padding:8px 0 0;text-align:center}
.pwc .pwdone img{display:block;width:64px;height:64px}
.pwc .pwdone h2{margin:14px 0 4px}
.pwc .pwdone p{margin:0;font-size:15px;color:var(--ink2);word-break:keep-all}
.pwc .pwdone .btn-fill{margin-top:20px}
.endc .pwh{display:flex;align-items:center;gap:4px;margin:12px 0 -8px;padding-top:4px;border-top:1px solid var(--line)}
.endc .pwh .pwhb{flex:1 1 auto;display:flex;align-items:center;gap:8px;min-width:0;min-height:44px;padding:0;border:0;background:none;color:var(--ink);font-size:14px;font-weight:700;text-align:left}
.endc .pwh .pwhx{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-right:-12px;padding:0;border:0;background:none;color:var(--ink2)}
/* 꼬리표 · 맨 위 카드 */
.tag{display:inline-flex;align-items:center;vertical-align:1px;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:600;line-height:1;white-space:nowrap;background:var(--nB);color:var(--nT)}
.tag.amb{background:var(--aB);color:var(--aT)}
.tag.sky,.tag.new,.tag.ans{background:var(--sB);color:var(--sT)}
.tag.grn{background:var(--gB);color:var(--gT)}
/* 2차(11-18) 큰 카드 = TV «이어 보기»: 크림 그림 한 장(교재 · 제목 · 판서 종이 · 물고기 · 남은 시간 · CSS 로 그림 · 바깥 요청 0) + 상태 점 글 · 제목 22 · 정보 줄 · 캡슐 단추
   아래 줄(«결석한 날 수업 N편 더» · 다른 강의 이어서 보기)은 카드 안 · PC(700 이상) = 그림 왼쪽 340 · 글 오른쪽 */
.tc{display:block;margin:16px 0 0;color:inherit;text-decoration:none}
.tc .absgo{display:block;color:inherit;text-decoration:none}
.art{position:relative;display:block;height:0;padding-top:56.25%;border-radius:14px;background:var(--art);color:var(--artT);overflow:hidden;box-shadow:inset 0 0 0 1px var(--artL)}
.art-tx{position:absolute;left:18px;top:15%;right:38%}
.art-bk{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.01em}
.art-rg{display:block;margin-top:4px;font-size:17px;line-height:22px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art-paper{position:absolute;right:4.6%;top:7%;width:29.7%;height:74%;border-radius:2px;background:#FFFFFF;box-shadow:0 .5px 1px rgba(70,52,12,.18),0 1px 3px rgba(70,52,12,.10)}
.art-paper svg{display:block}
.art-sig{position:absolute;left:18px;bottom:44px;width:28px;height:13.6px;color:var(--artT)}
.art-pg{position:absolute;left:18px;right:18px;bottom:14px;display:flex;align-items:center;gap:12px}
.art-bar{flex:1 1 auto;height:4px;border-radius:2px;background:rgba(11,61,46,.16);overflow:hidden}
.art-bar i{display:block;height:100%;border-radius:2px;background:var(--artT)}
.art-left{flex:0 0 auto;font-size:13px;line-height:18px;font-weight:600;white-space:nowrap}
/* 11-18 썸네일(원장님 «썸네일로 넣어»): 크림 그림 위에 영상 그림 한 장 · 진도 막대 · «N분 남음»은 그 위에 그대로 · 안쪽 선 1px .10 · 안 뜨면 그림만 빠져 크림 그림 그대로 */
.art>.art-i{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.art.has-i .art-pg{z-index:2}
/* S3(11-19) 그림 위 «N분 남음» = 크림 알약(검은 그림 위 9.46:1) · 막대 바탕도 크림 */
.art.has-i .art-left{padding:2px 8px;border-radius:999px;background:rgba(250,246,236,.92)}
.art.has-i .art-bar{background:rgba(250,246,236,.72)}
.art.has-i::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(70,52,12,.10);z-index:3;pointer-events:none}
.eb{display:flex;align-items:center;flex-wrap:wrap;gap:2px 12px;font-size:13px;line-height:18px;font-weight:600;color:var(--ink2)}
.ebi{display:inline-flex;align-items:center;gap:6px}
.edot{display:inline-block;flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:currentColor}
.eb.amb,.ebi.amb{color:var(--aT)}
/* S4(11-19) «새 강의» 큰 카드 라벨 13/700 var(--sT)(목록 줄 꼬리표와 같은 파랑) */
.eb.new{color:var(--sT);font-weight:700}
.ebi.new{color:var(--sT)}
.tc .lab{margin:12px 0 0}
.tc .tt{display:block;margin:2px 0 0;font-size:22px;font-weight:700;line-height:28px;letter-spacing:-.01em}
.tc .cr{display:block;margin:2px 0 0;font-size:15px;line-height:20px;color:var(--ink2);font-variant-numeric:tabular-nums}
.hx{display:block}
.hact{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin:12px 0 0}
.tc .btn-fill{display:inline-flex;width:auto;min-height:44px;height:44px;padding:0 22px;border-radius:22px;font-size:17px;font-weight:600;line-height:22px}
.tc .btn-fill b{font-weight:600}
.tc .tip{margin:0;font-size:13px;line-height:18px;color:var(--ink2)}
@media (min-width:700px){
  .tc .absgo,a.tc{display:flex;align-items:center;gap:24px}
  .tc .art{flex:0 0 340px;width:340px;padding-top:191px}
  .tc .hx{flex:1 1 auto;min-width:0}
  .tc .hx .lab{margin-top:0}
}
/* 큰 카드 아래 줄 · 홈 «새 답변» 줄: 44 · 위 선 · 17 · 끝 «›»(C2 검수 L3 · 글자가 아니라 꾸밈이라 읽어 주지 않음) · 결석 카드 안의 줄은 카드 장수에 안 셈(검수 A M6) */
.absln{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin:10px 0 0;padding:0;border:0;border-top:1px solid var(--line);background:none;border-radius:0;font-size:17px;line-height:22px;font-weight:400;color:var(--ink);text-align:left;text-decoration:none}
.absln + .absln{margin-top:0}
.abscont{gap:4px}
.absln .k{flex:0 0 auto;white-space:nowrap}
.absln .v{flex:1 1 auto;min-width:0;font-weight:400;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.absln::after{content:'\203A';flex:0 0 auto;margin-left:auto;padding-left:4px;font-size:20px;line-height:1;font-weight:400;color:var(--ink2)}
.nans{margin-top:16px}
.tc.hasln + .nans{margin-top:0}
.nans .k{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--sT)}
/* 학교 시험 카드(C2): 흰 카드 · 링 56(가운데 «D-9» · 다 본 편 만큼 딥그린) · «2학기 기말 · 11.25(수)» 17/600 · «범위 4편 중 2편 학습 완료» 15 · 끝 «›» */
.exam1{display:flex;align-items:center;gap:14px;margin:16px 0 0;padding:14px 12px 14px 16px;color:inherit;text-decoration:none}
/* 시험 링 «대안 A»(11-18 원장님 «링이랑 D-9 다른 파스텔톤» → «대안 A로 해»): 로즈 파스텔 한 가족(원판 · 트랙 · 진도 · 글자) + 가운데 «D-9» 명조 900.
   토큰은 이 링 안에서만 씀(강의 링 .ring 의 --track · --acc 는 그대로). 로즈 = 앱 «틀림» 산호(--cB · --cT)와 따로.
   글꼴 = Noto Serif KR 900(© 2017-2023 Adobe · SIL Open Font License 1.1 · https://openfontlicense.org)에서 «D-AY0123456789시험중 » 글자만 남긴 부분 글꼴
   (woff 5.5KB · data: 주소라 바깥 요청 0 · 깜빡임 0 · 이 글꼴에는 tnum 이 없고 lang=ko 숫자가 원래 같은 폭)
   «시험 중»(.sm) 11.5px/900 은 «13px 이하 굵기 600»(결론안 §4)의 예외: 원장님이 고른 대안 A 값이고, 이 부분 글꼴은 900 하나뿐 */

.rg56{position:relative;flex:0 0 auto;width:56px;height:56px;--ddB:#FCE6EA;--ddT:#F5CBD3;--ddP:var(--dd-ring);--ddI:#B32D47}
.rg56 svg{display:block}
.rg56 .rgB{fill:var(--ddB)}
.rg56 .rgT{stroke:var(--ddT)}
.rg56 .rgP{stroke:var(--ddP)}
.exam1 .d{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-family:"Noto Serif KR DD","Pretendard",serif;font-size:14.5px;font-weight:900;line-height:20px;text-align:center;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ddI)}
.exam1 .d.sm{font-size:11.5px;font-weight:900}
.exam1 .mn{flex:1 1 auto;min-width:0}
.exam1 .l1{display:block;font-size:17px;font-weight:600;line-height:22px;letter-spacing:-.01em}
.exam1 .l2{display:block;margin-top:2px;font-size:15px;line-height:20px;color:var(--ink2)}
.exam1::after{content:'\203A';flex:0 0 auto;font-size:20px;line-height:1;color:var(--ink2)}
/* D1(11-19) 일정만 카드(범위를 저장하지 않은 시험): 겉모양 같음(링 56 · 높이 86) · 첫 줄 하나만 세로 가운데 · 누를 곳 아님(div · 화살표 없음) */
.exam1.only::after{content:none}
/* P1(11-21) 시험 카드 안 «다음 · 제목» 줄: 흰 카드 한 장(.card 테 · 둥글기 그대로) 안에 위 = 시험 줄(.exam1 안쪽 여백 그대로) · 아래 = 결석 카드와 같은 줄(.absln 44 · 위 선 · 17 · 끝 «›») */
.exw{margin:16px 0 0;padding:0}
.exw .exam1{margin:0}
.exw .absln{width:auto;margin:0 12px 0 16px}
.rhead{margin:4px 0 12px}
.rhead h1{margin:0;font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
.rhead p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
/* 목록 줄(2차 · 결론안 §9 «구분 · 크림 연하게» 11-18 원장님 «결론안대로»): 교재마다 흰 카드(테 1px .10 · 둥글기 16) · 묶음 제목 20/600 딥그린(위 32 · 아래 8)
   줄 안 16 · 줄 사이 선 .16 = 숫자 칸(x=16)부터 카드 오른쪽 끝까지 · 숫자 칸 56 #E9F0EC · 캡슐 #E3EBDD(한 단 짙게) · 줄 초점 테는 안쪽(-2px) */
.grp{margin:0}
.grp h2{margin:32px 0 8px;padding:0;font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.01em;color:var(--acc)}
.rows{background:var(--card);border:1px solid var(--edge);border-radius:16px;overflow:hidden}
.row{position:relative;display:grid;grid-template-columns:128px minmax(0,1fr);align-items:start;gap:12px;padding:16px;text-decoration:none;color:inherit;transition:background-color .24s}
.row + .row:before{content:"";position:absolute;left:16px;right:0;top:0;border-top:1px solid rgba(70,52,12,.16)}
a.row:active{background:var(--press)}
a.row:focus-visible{outline-offset:-2px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:56px;border-radius:12px;background:var(--tile);color:var(--tileT);line-height:1.1;text-align:center}
.tile b{font-size:22px;line-height:24px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile b.l{font-size:15px;line-height:20px}
.tile small{font-size:12px;line-height:14px;font-weight:600}
/* 11-18 목록 줄 썸네일 128×72(원장님 «썸네일로 넣어» · S1b): 영상 그림 + 오른쪽 아래 길이 딱지만(진도 막대 없음) · 안 뜨면 그 칸을 단원 타일이 채움 · 안쪽 선 1px .10 */
.sth{position:relative;display:block;width:128px;height:72px;border-radius:10px;overflow:hidden;background:var(--art)}
.sth>.tile{width:100%;height:100%;border-radius:0}
.sth>.sth-i{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.sth::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(70,52,12,.10);z-index:3;pointer-events:none}
.sth-d{position:absolute;right:4px;bottom:4px;z-index:2;padding:1px 5px;border-radius:5px;background:rgba(26,26,24,.78);color:#FFFFFF;font-size:12px;line-height:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.row .mn{min-width:0;padding-top:1px}
.row .rs{display:flex;align-items:center;flex-wrap:wrap;gap:2px 12px;margin:0 0 2px;font-size:13px;line-height:18px;font-weight:600;color:var(--ink2)}
.row .rs .tag{padding:0;border-radius:0;background:none;font-size:13px;font-weight:600;line-height:18px;vertical-align:0}
.row .rs .tag.amb:before,.row .rs .tag.new:before,.row .rs .tag.ans:before{content:"";display:inline-block;flex:0 0 auto;width:7px;height:7px;margin-right:6px;border-radius:50%;background:currentColor}
.row .tt{font-size:17px;font-weight:600;line-height:22px;letter-spacing:-.01em}
.row .mt{margin-top:2px;font-size:15px;line-height:20px;color:var(--ink2);font-variant-numeric:tabular-nums}
.row .mt .mi{white-space:nowrap}
.row .st{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.row .st.ok{color:var(--done)}
.row .un{margin-top:4px;font-size:13px;font-weight:600;color:var(--aT)}
.cap{display:inline-flex;align-items:center;gap:8px;height:30px;margin:8px 0 0;padding:0 12px 0 11px;border-radius:15px;background:var(--accB);color:var(--acc);font-size:13px;line-height:18px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.cap svg{display:block}
.mb{display:block;width:28px;height:4px;border-radius:2px;background:rgba(12,70,49,.2);overflow:hidden}
.mb i{display:block;height:100%;border-radius:2px;background:var(--acc)}
.mb.rv i{background:var(--rv)}
.row .done{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;line-height:18px;font-weight:600;color:var(--done)}
.row .done svg{display:block;flex:0 0 auto}
.row .done span{color:var(--done)}
.row.flash{background:var(--aB)}
/* J03(11-19): 줄 전체 .55 대신 글은 짙게(7.66 · 5.31) · 썸네일만 흐리게 */
.row.off{cursor:default}
.row.off .tt{color:var(--ink2)}
.row.off .mt{color:var(--ink3)}
.row.off .sth{opacity:.55}
.row .tag.end{margin-top:6px}

   (1/φ² · 바닥 128 · 16:9 · 관리 «강의» 목록 줄과 같은 셈 · 같은 크기 · 390 = 137×77) · 제목 두 줄까지 · 700 넘으면 128×72 그대로 · 글 크기 · 굵기 · 색 그대로 */
@media (max-width:699px){
  .row{grid-template-columns:max(128px,calc((100vw - 32px) * .382)) minmax(0,1fr)}
  .sth{width:100%;height:auto;aspect-ratio:16/9}
  a.row .tt,div.row .tt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  /* §8-232(11-19): 썸네일이 커져 글 칸이 390에서 176 → 167이 되자 «● 새 강의 ● 결석한 날 학습 전»이 두 줄로 꺾임 → 폰에서만 상태 점 글 사이 12 → 7
     (390 여유 5.4 · 393 7.4 · 바꾸기 전 390 여유 4.1 · 375 이하는 바꾸기 전에도 두 줄 · 위아래 2 · 점 · 글 크기 그대로) */
  .row .rs{column-gap:7px}
}

/* 폰에서 누르는 자리 44px 가까이(보이는 크기는 그대로) */
.kc,.scn,.q .scb,.btn-sm,.dchip{position:relative}
.kc:after,.scn:after,.q .scb:after,.btn-sm:after,.dchip:after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}

.end1 p{margin:0 0 16px;font-size:20px;font-weight:700;letter-spacing:-.02em}
/* 폰 · 영상 고정(질문 칸을 누르면 풂) */
@media (max-width:1099px){
  .pgrid .pl{display:contents}
  /* 2차(11-18) 옆 여백 20: 퍼센트는 부모 안쪽 폭(W − 40) 기준 → 40 × 9/16 = 22.5 를 더해야 화면 폭 16:9 */
  .vid{position:-webkit-sticky;position:sticky;top:0;z-index:3;width:auto;margin:0 -20px;padding-top:calc(56.25% + 22.5px);border-radius:0}
  .pgrid.nostk .vid{position:relative}
}
/* F4(11-21): 폰 가로(창 높이 500 아래) = 영상 칸을 높이에 맞춤(16:9 · 가운데 · 양옆은 무대 색) · 높이 = 화면 − 머리(44) − 아래 inset
   → 맨 위에서도 · 위에 붙었을 때도 유튜브 막대 · 전체 화면 단추가 화면 안 · aspect-ratio 없는 옛 브라우저 · 세로 · PC 는 그대로 */
@supports (aspect-ratio:1/1){
  @media (orientation:landscape) and (min-width:481px) and (max-height:500px) and (max-width:1099px){ /* Z6(11-21): 폭 481 이상만(세로 폰 + 자판 창 360×224 등은 «가로»로 안 읽음) */
    html.stg .vid{width:min(100%,calc((100vh - 44px - env(safe-area-inset-bottom,0px)) * 16 / 9));height:auto;margin:0 auto;padding-top:0;aspect-ratio:16/9}
  }
  @supports (height:1dvh){
    @media (orientation:landscape) and (min-width:481px) and (max-height:500px) and (max-width:1099px){
      html.stg .vid{width:min(100%,calc((100dvh - 44px - env(safe-area-inset-bottom,0px)) * 16 / 9))}
    }
  }
  /* 11-22 폰 가로 19:9 이상(원장님 «폰 가로 영상 칸 키우기»): 머리줄(제목 · 필기 PDF)은 영상 아래로 · «‹ 목록»(44×44)은 영상 왼쪽 빈 여백(safe-area 안쪽)
     → 영상 높이 = 화면 − 아래 inset(아이폰 14 홈 화면 앱 578×325 → 656×369) · 폭은 양옆에 단추 칸 47(44 + 3)을 남김(노치 59 폰은 폭이 먼저 걸림)
     · 영상은 위에 붙지 않음(붙으면 아래 띠 · 목차 · 질문을 볼 틈이 없음) · 16:9 에 가까운 폰(667×375 등)은 위 F4 그대로
     · «19:9 이상»은 화면 생김으로 가름(html.w19 = 긴 변 ÷ 짧은 변 2.1 이상 · 아래 wide19): 보이는 창 비율(min-aspect-ratio)로 가르면 브라우저 주소 막대가 들락날락할 때 두 짜임을 오감 */
  @media (orientation:landscape) and (min-width:481px) and (max-height:500px) and (max-width:1099px){
    html.stg.w19{--lvw:min(calc((100vh - env(safe-area-inset-bottom,0px)) * 16 / 9),calc(100vw - 2 * max(env(safe-area-inset-left,0px),env(safe-area-inset-right,0px)) - 94px));--lpl:max(20px,env(safe-area-inset-left,0px));--lvx:calc(var(--lpl) + (100vw - var(--lpl) - max(20px,env(safe-area-inset-right,0px)) - var(--lvw)) / 2)}
    html.stg.w19 .wrap{display:flex;flex-direction:column}
    html.stg.w19 .pgrid{display:contents}
    html.stg.w19 .vid,html.stg.w19 .pgrid.nostk .vid{order:-1;position:relative;width:min(100%,var(--lvw))}
    html.stg.w19 .ptop,html.stg.w19 .pdfm{padding:0 calc((100% - var(--lvw)) / 2)}
    html.stg.w19 .ptop .backb{position:absolute;z-index:4;top:env(safe-area-inset-top,0px);left:calc(env(safe-area-inset-left,0px) + (var(--lvx) - env(safe-area-inset-left,0px) - 44px) / 2);flex-direction:column;justify-content:center;gap:0;width:44px;margin:0;padding:0;font-size:12px;line-height:16px;font-weight:600}
    html.stg.w19 .ptop .backb:focus-visible{outline-offset:-2px}
  }
  @supports (height:1dvh){
    @media (orientation:landscape) and (min-width:481px) and (max-height:500px) and (max-width:1099px){
      html.stg.w19{--lvw:min(calc((100dvh - env(safe-area-inset-bottom,0px)) * 16 / 9),calc(100vw - 2 * max(env(safe-area-inset-left,0px),env(safe-area-inset-right,0px)) - 94px))}
    }
  }
}
@media (max-width:359px){.top{gap:6px}.me{max-width:34vw}}
/* PC 보기: 머리줄은 목록과 같음 · 왼쪽 영상 · 오른쪽 열 352 */

  .stopw.w{display:block;margin:0 0 14px}
  .spd{flex:0 0 auto;width:300px}  /* 11-22 (바) PC 배속 줄 = 칸 60×44 다섯(«10초» 옆 그대로 · 폰은 그대로 · 손잡이 --n · --i 는 % 꼴이라 그대로 맞음) */
}
/* 2차(11-18) 머리: 목록 = 큰 이름 «HIS CLASS»(세리프 글자 그림 170 · 화면 읽기 «히즈클래스») + 오른쪽 이름 동그라미(누르면 이름 시트)
   내리면 위에 작은 막대(이름 104 · 크림 .92 · 아래 선) · PC 보기 = 왼쪽 위 작은 이름 · 이름 시트 = 아래에서 올라오는 판(크림 바탕 · 안 칸 흰색) */
.lth{min-height:64px;padding:12px 0 0}
.lt.wmt{display:flex;align-items:center;min-height:41px;margin:0;line-height:0;color:var(--acc)}
.lt.wmt .wm{display:block;width:170px;height:auto}
.av{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-right:-4px;padding:0;border:0;border-radius:50%;background:none}
.av span{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--accB);color:var(--acc);font-size:13px;line-height:18px;font-weight:600;white-space:nowrap}
.av.sm span{width:32px;height:32px;font-size:12px}
.cbar{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;align-items:center;justify-content:center;height:52px;background:rgba(250,246,236,.92);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);color:var(--acc);visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s}
.cbar.on{visibility:visible;opacity:1}
.cbar .wm{display:block;width:104px;height:auto}
.cbar .av{position:absolute;right:max(16px,env(safe-area-inset-right));top:4px}
.pch .wmt{display:flex;align-items:center;line-height:0;color:var(--acc)}
.pch .wmt .wm{display:block;width:104px;height:auto}
.pwa.pwme{padding:0}
.pwme .pwc.msh{max-width:560px;padding:8px 16px calc(24px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;background:var(--bg);box-shadow:0 -1px 12px rgba(0,0,0,.08)}
@media (min-width:700px){.pwa.pwme{align-items:center;padding:24px}.pwme .pwc.msh{padding-bottom:24px;border-radius:16px}}
.msh .grab{display:block;width:36px;height:5px;margin:0 auto;border-radius:3px;background:rgba(0,0,0,.18)}
.msh .xbtn{position:absolute;right:8px;top:8px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;background:none;color:var(--ink2)}
.msh .xbtn span{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--fill)}
.msh .me1{display:flex;flex-direction:column;align-items:center;padding:20px 0 4px}
.msh .mav{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:var(--accB);color:var(--acc);font-size:17px;line-height:22px;font-weight:600}
.msh h2{margin:10px 0 0;font-size:20px;line-height:26px;font-weight:700;letter-spacing:-.01em}
.msh .cells{margin-top:20px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--edge);overflow:hidden}
.msh .cells + .cells{margin-top:16px}
.msh .cell{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;margin:0;padding:0 14px 0 16px;border:0;background:none;color:var(--ink);font-size:17px;line-height:22px;font-weight:400;text-align:left;text-decoration:none}
.msh .cell + .cell:before{content:"";position:absolute;left:50px;right:0;top:0;border-top:1px solid var(--line)}
.msh .cell:focus-visible{outline-offset:-2px}
.msh .cell svg{flex:0 0 auto;display:block;color:var(--acc)}
.msh .cell .ct{flex:1 1 auto;min-width:0}

.msh .cell.red,.msh .cell.red svg{color:var(--cT)}
/* 2차(11-18) 기록 안내: 한 장(아이콘 칸 64 · 제목 28/700 가운데 · 줄마다 이름 17/600 + 설명 15 양쪽 정렬) · 동의 날짜는 맨 아래 한 줄 · 다시 읽기 = 아래 «닫기» 하나 */
.cons.ob{display:flex;flex-direction:column;align-items:center;padding:40px 8px 0}
.ob-ic{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:18px;background:var(--accB);color:var(--acc)}
.cons.ob h1{margin:18px 0 0;font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.015em;text-align:center}
.cons ol.cis{width:100%;margin:24px 0 0}
.cons ol.cis li,.cons ol.cis li:first-child{display:block;padding:12px 0;border:0;text-align:left}
.cons ol.cis li:before{content:none}
.cis .ci-t{display:block;font-size:17px;line-height:22px;font-weight:600}
.cis .ci-d{display:block;margin-top:2px;font-size:15px;line-height:21px;color:var(--ink2);text-align:justify}
.cons.ob .cur{width:100%;margin:8px 0 0;padding:12px 0 0;border-top:1px solid var(--line);font-size:13px;line-height:18px;font-weight:600;color:var(--ink2)}
.cons.ob .btns{width:100%;margin-top:24px}
.cons.ob .btn-fill{min-height:50px;border-radius:25px;font-size:17px;font-weight:600}
.cons.ob .err{width:100%}
.obf{max-width:560px;margin:32px auto 0}
.btn-gray{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border:0;border-radius:25px;background:var(--fill);color:var(--ink);font-size:17px;line-height:22px;font-weight:600}
/* 2차(11-18) 알림 묻기(첫 로그인 한 단계) · 목록 알림 카드 · 설치 판: 글 · 차례 · 단추는 그대로 · 모양만(설치→알림 흐름 결론안 12가지는 안 넣음)
   묻기 = 한 장(종 아이콘 칸 64 · 제목 28/700 가운데 · 설명 17 양쪽 정렬 · 큰 단추 50) · 카드 = 흰 칸(테 .10) · 설치 판 = 크림 바탕 · 단계 칸 흰색 */
.cons .alst{display:flex;flex-direction:column;align-items:center;padding:56px 8px 0;border:0;background:none}

.alst .alh svg{box-sizing:content-box;width:30px;height:30px;padding:17px;border-radius:18px;background:var(--accB)}
.alst .alh h1{margin:18px 0 0;font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.015em;text-align:center}
.alst .als{width:100%;margin:12px 0 0;font-size:17px;line-height:25px}
.alst .btns{width:100%;margin-top:28px}
.alst .btn-fill,.pwc .btn-fill{min-height:50px;border-radius:25px;font-size:17px;font-weight:600}
.alc .alh{color:var(--acc)}
.alc .alh h2{font-size:17px;font-weight:600;line-height:22px}
.alc .als{font-size:15px;line-height:21px}
.alb .btn-fill{border-radius:22px;font-weight:600}
.pwa .pwc.card{padding:20px 16px;border:0;border-radius:16px;background:var(--bg);box-shadow:0 -1px 12px rgba(0,0,0,.08)}
.pwc h2{font-size:22px;line-height:28px}
.pwc .pwsb{margin:0 0 14px;font-size:15px;line-height:21px}
.pwc .pwol{padding:14px 14px 2px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--edge)}
.pwc .pwol .no{font-weight:600}
/* 2차(11-18) 재생 무대: 폰 · PC 모두 화면 전체 딥그린(위 #123224 → 38% #0D241A → #09160F · 영상 칸만 검정 · PC 오른쪽 밝은 칸 없음)
   글 #F3F1EA / #B9C2BB / #9DA9A0 · 강조 #8FD0AE · 주황 #F0B26B · 카드 .07 · 유리 단추 .11 · 고른 칸 .15 · 선 .10 · 큰 단추 = 크림(#F3F1EA · 딥그린 글) */
html.stg body{background-color:#09160F;background-image:linear-gradient(180deg,#123224 0%,#0D241A 38%,#09160F 100%);background-repeat:no-repeat;background-size:100% 100vh}
html.stg .ptop .pt b{font-size:17px;font-weight:600;line-height:22px}
html.stg .ptop .pt span{font-size:13px;color:var(--ink2)}
html.stg .backb{font-size:17px;color:var(--ink)}
html.stg .ptop .pdfb{min-height:44px;height:44px;padding:0 16px;border:0;border-radius:22px;background:var(--glass);color:var(--ink);font-size:15px;font-weight:600}
html.stg .ptop .pdfb svg{color:var(--ink)}
html.stg .band .bt{top:10px;height:4px;border-radius:2px}
html.stg .band button{color:var(--ink3);font-weight:400}
html.stg .band button.on .bl{color:var(--ink);font-weight:600}
html.stg .nowl .ch{font-size:17px;font-weight:600}
html.stg .resume{font-size:15px;line-height:20px}
html.stg .resume button{min-height:44px;padding:0 4px;font-weight:600;color:var(--acc);text-decoration:none}
html.stg .ctl{gap:10px;margin:12px 0 0}
html.stg .b10{width:auto;gap:6px;padding:0 16px;border:0;border-radius:22px;background:var(--glass);font-size:15px;font-weight:600}
html.stg .spd{border-radius:12px;background:var(--card);box-shadow:none}
html.stg .spd button{padding:3px;border-radius:12px;font-size:15px;color:var(--ink2)}
html.stg .spd button.on{background-color:var(--sel);color:var(--ink);font-weight:600}
html.stg .tabs{margin:16px 0 0;background:var(--card);box-shadow:none}
html.stg .tabs button{padding:3px;font-size:15px;font-weight:600;color:var(--ink2)}
html.stg .tabs button.on{background-color:var(--sel);color:var(--ink);font-weight:600}
/* S1(11-19) 탭 · 배속: 손잡이 하나(흰 .30)가 240ms 에 미끄러짐 · 고른 글 700 #F3F1EA · 안 고른 글 600 #B9C2BB · 단추 바탕은 투명 */
html.stg .tabs,html.stg .spd{position:relative}
html.stg .tabs{--n:2;--i:0}
html.stg .spd{--n:5;--i:1}
html.stg .tabs::before,html.stg .spd::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:10px;background:rgba(255,255,255,.30);transform:translateX(calc(var(--i)*100%));transition:transform var(--t2) var(--e-out)}
html.stg .tabs.nomo::before,html.stg .spd.nomo::before{transition:none}
html.stg .spd.nosel::before{visibility:hidden}
html.stg .tabs button,html.stg .spd button{position:relative;font-weight:600;color:var(--ink2)}
html.stg .tabs button.on,html.stg .spd button.on{background-color:transparent;font-weight:700;color:var(--ink)}
/* S1 폰 무대 머리 두 줄: 교재 12/16 600 #B9C2BB 위 · 범위 15/20 700 #F3F1EA 아래(합 36 · 머리 44 그대로) · PC(1100 이상)는 그대로 */
@media (max-width:1099px){
  html.stg .ptop .pt{flex-direction:column;align-items:flex-start;gap:0}
  html.stg .ptop .pt span{display:block;order:-1;max-width:100%;font-size:12px;line-height:16px;font-weight:600;color:var(--ink2)}
  html.stg .ptop .pt b{max-width:100%;font-size:15px;line-height:20px;font-weight:700;color:var(--ink)}
}
html.stg .paper{padding:12px 0 4px;color:var(--ink2)}
html.stg .paper svg{color:var(--ink2)}
html.stg .toc li{position:relative}
html.stg .toc li + li:before{content:"";position:absolute;left:44px;right:0;top:0;border-top:1px solid var(--line)}
html.stg .toc li.fd + li:not(.fd):before,html.stg .toc li[hidden] + li:before{left:44px}

   목업과 다른 곳(진짜 화면이라서): 폰의 브라우저 줄 그림(.osb)은 안 그림 → 화살표 · 번호는 화면 가장자리에 붙임(아래 줄 = position:fixed · 크롬 위 줄 = 쪽 맨 위 absolute · 브라우저 줄 바로 옆 4px)
   «끝» 홈 화면 줄: 목업은 학생 화면 style.css 의 .me{padding:20px 0 4px} 가 우연히 걸려 아이콘이 이웃보다 20px 낮고 판이 24px 큼 → 문은 이웃과 나란히(값은 목업 flow.css .fhs 그대로)
   크롬 · 삼성 인터넷 화면 위 여백(목업 84 · 76 = 줄 그림 자리)은 20 · --pic 는 목업이 섞은 값을 그대로 적음(color-mix(#EAE1C8 55%, #FAF6EC) = #F1EAD8 · 옛 폰도 같게)
   글 폭 440 까지(넓은 폰 · 가로) · 아래 여백 = 화살표 자리 + 안전 영역
   2차 맞춤(B · 11-18): 색 = class.html :root 토큰을 그대로 받음(괄호 뒤 값 = 같은 값 · 문만 따로 띄울 때) · 글꼴 = class.html 의 Pretendard 를 물려받음 · 굵기 400 · 600 · 700 셋만 · 13px 이하 글자는 600(DESIGN.md 2차 줄) */
.dr-t{--dr-bg:var(--bg,#FAF6EC);--dr-group:var(--card,#FFFFFF);--dr-ink:var(--ink,#1A1A18);--dr-ink2:var(--ink2,#57534A);--dr-acc:var(--acc,#0C4631);--dr-acc-tint:var(--accB,#E3EBDD);--dr-on-acc:var(--fillT,#FFFFFF);--dr-fill:var(--fill,#EAE1C8);--dr-pic:#F1EAD8;--dr-line:var(--edge,rgba(70,52,12,.10))}

/* 틀 */
.dr-x{max-width:440px;margin:0 auto;padding:calc(20px - 8px * var(--dr-sq,0)) 20px calc(32px - 16px * var(--dr-sq,0) + env(safe-area-inset-bottom,0px))}
.dr-x.dr-pb-dn,.dr-x.dr-pb-dns{padding-bottom:calc(84px - 28px * var(--dr-sq,0) + env(safe-area-inset-bottom,0px))}   /* 작은 화면: 마지막 한 줄(왼쪽 짧은 글)만 화살표 옆 · 카드는 화살표 · 번호 위 */
.dr-x.dr-pb-dnc{padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}

/* 머리 · 세 칸 단계 막대(지난 칸 = 딥그린 가득 · 지금 칸 = 차오름 · 남은 칸 = 옅은 중립 회색) */
.dr-fh{display:flex;align-items:center;justify-content:center;height:24px;line-height:0;color:var(--dr-acc)}

@keyframes dr-fill{from{width:var(--f0,0%)}}
.dr-fs .dr-now span{font-weight:600;color:var(--dr-acc)}

/* 글 */
.dr-ft{margin-top:calc(32px - 14px * var(--dr-sq,0));font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.015em;color:var(--dr-ink);text-wrap:balance}
.dr-fp{margin-top:calc(10px - 4px * var(--dr-sq,0));font-size:17px;line-height:25px;font-weight:400;color:var(--dr-ink2);text-align:justify}

.dr-url{margin-top:calc(10px - 2px * var(--dr-sq,0));padding:10px 12px;border-radius:12px;background:var(--dr-group);box-shadow:inset 0 0 0 1px var(--dr-line);font-size:13px;line-height:18px;font-weight:600;color:var(--dr-ink2);text-align:center;word-break:break-all;-webkit-user-select:all;user-select:all}

.dr-xk .dr-app,.dr-xk .dr-btn{margin-top:calc(24px - 10px * var(--dr-sq,0))}

/* 단추가 안 되면(작은 판) */
.dr-pan{margin-top:calc(24px - 10px * var(--dr-sq,0));padding:calc(14px - 4px * var(--dr-sq,0)) calc(16px - 4px * var(--dr-sq,0)) calc(16px - 4px * var(--dr-sq,0));border-radius:16px;background:var(--dr-group);box-shadow:inset 0 0 0 1px var(--dr-line)}

.dr-pic svg{display:block;width:100%;height:auto;max-height:var(--dr-pan-h,none)}
.dr-pi-c{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;font-weight:600;color:var(--dr-ink)}

/* 그림 카드(사파리 · 크롬 · 삼성 인터넷 단추 차례) */
.dr-cs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(12px - 4px * var(--dr-sq,0));margin-top:20px;list-style:none}
.dr-c{display:flex;flex-direction:column;border-radius:16px;background:var(--dr-group);box-shadow:inset 0 0 0 1px var(--dr-line);overflow:hidden}

.dr-n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--dr-acc-tint);color:var(--dr-acc);font-size:13px;line-height:18px;font-weight:600;flex:none}
.dr-c-tx{flex:1;min-width:0}
.dr-c-t{display:block;font-size:15px;line-height:22px;font-weight:600;color:var(--dr-ink)}
.dr-c-s{display:block;margin-top:1px;font-size:13px;line-height:18px;font-weight:600;color:var(--dr-ink2)}

/* 실제 단추 자리를 가리키는 화살표 + 카드와 짝인 번호(살짝 움직임 · 줄이기 설정이면 멈춤) · 브라우저 줄 바로 옆 */
.dr-fa{position:fixed;z-index:3;display:block;width:36px;height:44px;color:var(--dr-acc);pointer-events:none}
.dr-fa.dr-dn{right:22px;bottom:calc(4px + env(safe-area-inset-bottom,0px));animation:dr-dn 1.6s ease-in-out infinite}   /* 사파리(iOS 26 이상) 아래 줄 위 */

.dr-fa.dr-dns{right:14px;bottom:4px;animation:dr-dn 1.6s ease-in-out infinite}                                         /* 삼성 인터넷 아래 줄 위 */
.dr-fa.dr-up{position:absolute;right:12px;top:4px;animation:dr-up 1.6s ease-in-out infinite}                           /* 크롬 주소 줄 아래 · 쪽 맨 위에 붙임(내리면 크롬 주소 줄과 같이 사라짐 · 단계 막대 위에 안 얹힘) */

.dr-fan-dnc{left:calc(50% - 47px);bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.dr-fan-dns{right:21px;bottom:52px}
.dr-fan-up{position:absolute;right:52px;top:12px}
@keyframes dr-dn{0%,100%{transform:translateY(-6px)}50%{transform:translateY(0)}}
@keyframes dr-up{0%,100%{transform:translateY(6px)}50%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.dr .dr-fa,.dr-fs .dr-now i::after{animation:none}}   /* .dr .dr-fa = .dr-fa.dr-dn 보다 세게(목업 flow.css 는 .fa 만이라 안 멈춤) */

/* 홈 화면 줄 그림(실제 앱 아이콘 · 이름 «히즈클래스») */

/* 작은 화면(높이 미디어 쿼리 · 11-18 총괄): 내리지 않고 한 화면에 끝 줄까지 · 화살표는 카드 · 글 위에 안 얹힘
   글 크기는 그대로 · 그림(앱 아이콘 · 단계 그림 칸)과 사이 간격만 줄임(--dr-sq:1 이면 위 calc 의 간격이 줄어듦)
   화면마다 넘치기 시작하는 높이 밑에서만 켬 → 보통 크기 화면은 그대로(390×844 · 375×667 · 384×650 · 393×700 …)
   단계 그림 칸 높이 = 남는 높이만큼(--dr-pic-h · 그림은 가운데 맞춰 작아짐 · 홈 화면 줄 그림 카드는 그대로) · 카톡 «단추가 안 되면» 그림 = --dr-pan-h
   크롬(1-wait)은 위 화살표 자리 때문에 위 여백(20 · 16)은 그대로 */

@media (max-width:370px) and (max-height:709px){.dr[data-k^="k-"]{--dr-pan-h:max(44px,calc(100dvh - 524px))}}
@media (max-height:579px),(max-width:370px) and (max-height:597px){.dr[data-k="copy-ios"]{--dr-sq:1;--dr-icon:52px}}
@media (max-height:579px),(max-width:370px) and (max-height:629px){.dr[data-k="copy-and"]{--dr-sq:1;--dr-icon:52px}}
@media (max-height:649px),(min-width:420px) and (max-height:679px){
  .dr[data-k="1-wait"]{--dr-sq:1;--dr-pic-h:max(40px,calc((100dvh - 376px) / 2))}

}
@media (max-height:637px),(max-width:370px) and (max-height:649px),(min-width:420px) and (max-height:669px){.dr[data-k="1-sam"]{--dr-sq:1;--dr-pic-h:max(40px,calc((100dvh - 352px) / 2))}}
/* dvh 없는 옛 브라우저(iOS 15.3 이하 · 크롬 107 이하): vh 로 */
@supports not (height:1dvh){
  @media (max-height:829px){.dr[data-k="1-ios26"]{--dr-pic-h:max(36px,calc((100vh - 476px) / 2))}}
  @media (max-height:729px){.dr[data-k="1-ios18"]{--dr-pic-h:max(36px,calc((100vh - 456px) / 2))}}
  @media (max-height:663px),(max-width:370px) and (max-height:709px){.dr[data-k^="k-"]{--dr-pan-h:max(44px,calc(100vh - 474px))}}
  @media (max-width:370px) and (max-height:709px){.dr[data-k^="k-"]{--dr-pan-h:max(44px,calc(100vh - 524px))}}
  @media (max-height:649px),(min-width:420px) and (max-height:679px){.dr[data-k="1-wait"]{--dr-pic-h:max(40px,calc((100vh - 376px) / 2))}}
  @media (max-height:637px),(max-width:370px) and (max-height:649px),(min-width:420px) and (max-height:669px){.dr[data-k="1-sam"]{--dr-pic-h:max(40px,calc((100vh - 352px) / 2))}}
}
/* 설치 흐름(11-18 결론안 · 목업 P\v2\flow\flow.css 값 · 2차 토큰 · 굵기 400 · 600 · 700 · 13px 이하 600)
   앱 안 2(이름) · 3(알림) 머리 = 문과 같은 단계 막대 · 알림 단계 = 잠금 화면 그림 + 아래 단추 · 알림 막은 학생 = 목록 맨 위 카드 · PC = «폰으로 받기» QR 카드 */

  function alStepDue() { return !!S.alFresh && recMode() !== 'pending' && alPerm() === 'default' && !L.lsGet(alStepK(), 0) && S.lectures.length > 0 && !L.lsGet(alNoK(), 0) && !(S.home && S.home.al_mine === false); }

  /* ------------------------------------------------------------ 목록 */
  function statusOf(l) {

  function isArr(x) { return Object.prototype.toString.call(x) === '[object Array]'; }
  /* 수업일 · C1 고침(11-16): 수업일마다 반이 정해진 강의면 내 반의 수업일(출결 days)로 · 첫 수업일이 그 안에 있으면 지금처럼 */
  function lessonDay(l, at) {

    if (at && isArr(at.days) && at.days.length && at.days.indexOf(ld) < 0 && typeof at.days[0] === 'string' && L.isoDay(at.days[0])) ld = L.isoDay(at.days[0]);

  /* 단원 타일(11-17 · 결론안 K 의 수업일 타일을 갈음 · 모든 학생 · 모든 강의 · 날짜 없음): 강의 제목 맨 앞의 번호와 단위
     ① 단원 «4과 01~06번» → 4 / 과 · «15·16강» → 15·16 / 강 · «Unit 15» → 15 / 강 · «Lesson 4» → 4 / 과(실행기 auto_pages.UNIT_PATTERNS 와 같은 낱말)
        숫자가 셋 이상(«12·13·14강»)이거나 둘이라도 다섯 글자를 넘으면 범위처럼 첫 숫자만 «12 / 강» · 화면 읽기 «12강부터»(가장 작은 글자 14)
     ② 아니면 맨 앞 문항 번호(모의고사 «18~32번») → 18 / 번
     ③ 아니면(맨 앞 번호 없음) 같은 교재 안 그런 강의끼리 수업일 → 공개일 → 올린 차례로 «N / 편»(pyeonMap) · 숫자 앞 0 은 뗌 */
  var UNIT_RE = /^(\d{1,3}(?:\s*·\s*\d{1,3})*)\s*(회|강|과|단원|차시)/,
    UNIT_EN = /^(unit|lesson)\s*(\d{1,3}(?:\s*·\s*\d{1,3})*)/i,
    UNIT_NO = /^(\d{1,3})((?:\s*[~∼\-–]\s*\d{1,3})?(?:\s*·\s*\d{1,3}(?:\s*[~∼\-–]\s*\d{1,3})?)*)\s*번/;
  function unitNum(s) {
    var p = String(s).split('·'), i;
    for (i = 0; i < p.length; i += 1) p[i] = String(parseInt(p[i], 10));
    return p.join('·');
  }
  /* 단원 숫자(들) + 단위 → 타일 · 셋 이상 · 다섯 글자 넘음 = 첫 숫자 «…부터» */
  function unitPart(raw, u) {
    var n = unitNum(raw), p = n.split('·');
    if (p.length >= 3 || n.length > 5) return { n: p[0], u: u, sr: p[0] + u + '부터' };
    return { n: n, u: u, sr: n + u };
  }
  /* → {n: 위 숫자, u: 아래 단위, sr: 화면 읽기} · 맨 앞 번호가 없으면 null */
  function unitOf(title) {
    var t = String(title || '').replace(/^\s+/, ''), m = t.match(UNIT_RE), n;
    if (m) return unitPart(m[1], m[2]);
    m = t.match(UNIT_EN);
    if (m) return unitPart(m[2], m[1].toLowerCase() === 'unit' ? '강' : '과');
    m = t.match(UNIT_NO);
    if (m) { n = unitNum(m[1]); return { n: n, u: '번', sr: n + (/\d/.test(m[2]) ? '번부터' : '번') }; }
    return null;
  }
  /* ③ «N / 편»: list = 서버 차례(오래된 것부터 · 같은 날은 올린 차례) · 교재마다 맨 앞 번호 없는 강의끼리 1부터 → {'i'+id: N} */
  var PYN = {};
  function pyeonMap(list) {
    var g = {}, out = {}, i, k, a, l;
    function ky(x) { var p = x.posted_on ? L.isoDay(x.posted_on) : ''; return (x.lesson_on ? L.isoDay(x.lesson_on) : p) + '|' + p; }
    for (i = 0; i < list.length; i += 1) {
      l = list[i];
      if (unitOf(l.title)) continue;
      k = 'b' + (l.book || '');
      if (!g.hasOwnProperty(k)) g[k] = [];
      g[k].push({ k: ky(l), i: i, id: l.id });
    }
    for (k in g) {
      if (!g.hasOwnProperty(k)) continue;
      a = g[k];
      a.sort(function (x, y) { return x.k < y.k ? -1 : (x.k > y.k ? 1 : x.i - y.i); });
      for (i = 0; i < a.length; i += 1) out['i' + a[i].id] = i + 1;
    }
    return out;
  }
  function tileHTML(l) {

    /* 위 숫자: 두 글자까지 18 · 그보다 길면(«15·16» · «100» · 다섯 글자까지) 14 */
    return '<span class="tile" role="img" aria-label="' + esc(u.sr) + '"><b' + (u.n.length > 2 ? ' class="l"' : '') + '>' +
      esc(u.n) + '</b><small>' + esc(u.u) + '</small></span>';

  /* 11-18 목록 줄 썸네일 128×72(원장님 «썸네일로 넣어»): 단원 타일 위에 영상 그림(mqdefault) + 오른쪽 아래 길이 딱지 · 안 뜨면 class-api.js 가 그림을 떼어 타일이 칸을 채움 */
  function thumbHTML(l) {

      (src ? '<img class="sth-i" src="' + esc(src) + '" data-thq="" alt="" loading="lazy" decoding="async">' : '') +
      (+l.dur > 0 ? '<span class="sth-d">' + esc(L.fmtDur(+l.dur)) + '</span>' : '') + '</span>'; /* S3(11-19): 길이는 딱지 한 번(화면 읽기에도) */
  }
  /* 둘째 줄(이스케이프한 HTML) «목차 5» · 날짜 없음(타일 = 단원) · 조각마다 한 덩어리로 묶어 줄바꿈으로 갈리지 않게
     검수 A L2: 내 반 수업일이 둘 이상이면 앞에 «수업 2일»(J44) · S3(11-19): 길이는 썸네일 딱지 · 캡슐에만(정보 줄에서 뺌) */
  function metaOf(l, at) {
    var a = [], h = [], i;
    var more = at && isArr(at.days) && at.days.length >= 2 ? at.days.length - 1 : 0;
    if (more) a.push('수업 ' + (more + 1) + '일');
    var n = (l.chapters && l.chapters.length) || 0;
    if (n) a.push('목차 ' + n);
    for (i = 0; i < a.length; i += 1) h.push('<span class="mi">' + esc(a[i]) + (i < a.length - 1 ? ' ·' : '') + '</span>');
    return h.join(' ');
  }
  /* 지문 칸(보기 화면 띠 · 맨 위 카드 막대가 같이 씀): 목차 시각 차례 · 길이가 2% 안 되는 칸(«오늘 볼 지문» 같은 머리)은 다음 칸에 붙임
     → [{t: 누르면 갈 시각(그 지문 처음), from, to, w, no: '04'|'', title, parts: [{i: 목차 차례, n: 길이}]}] */
  function segsOf(ch, D) {
    var r = L.chapterRanges(ch, D), out = [], carry = null, i, x, s;
    for (i = 0; i < r.length; i += 1) {
      x = r[i];
      if (!(x.to > x.from)) continue;
      if (x.to - x.from < D * 0.02 && i < r.length - 1) {
        if (!carry) carry = { from: x.from, parts: [] };
        carry.parts.push({ i: x.i, n: x.to - x.from });

  /* 결석한 날 수업 카드에 올릴 강의: 결석 · 아직 열림 · 다 보지 않음(선생님 확인 = 끝남) · 결석한 날이 오늘~13일 전 ·
     최근 결석한 날 → 많이 본 것 → id 차례 */
  function absList(arr, am, today) {
    var out = [], i, l, a, dd;
    for (i = 0; i < arr.length; i += 1) {
      l = arr[i]; a = am['i' + l.id];

      dd = dayDiff(today, a.day);
      if (dd < 0 || dd > 13) continue;
      out.push(l);
    }
    out.sort(function (x, y) {
      var dx = am['i' + x.id].day, dy = am['i' + y.id].day;
      if (dx !== dy) return dx < dy ? 1 : -1;
      var px = +x.pct || 0, py = +y.pct || 0;
      if (px !== py) return py - px;
      return x.id < y.id ? -1 : (x.id > y.id ? 1 : 0);
    });

  }
  /* 2차 홈 «새 답변» 줄(누르면 그 강의 «질문» 쪽 · 바로 1번): 목록 차례(새것부터)로 답이 새로 달린 첫 강의 · 없으면 '' */
  function ansRowHTML(arr) {

  /* 결석 카드 = 카드 하나(div) 안에 링크: 위 = 그 강의 · 아래 줄 = 다른 강의 «이어서 보기»(cont) · «결석한 날 수업 N편 더»(more) */
  function absCardHTML(l, a, rec, cont, more) {

      var cpos = +cont.pos || 0;

        '<span class="k">' + esc(M.contLab) + '</span><span class="v">· ' + esc(cont.title) +

  /* Q2(가 · 11-21): 큰 카드(l · 새 강의면 isNew) + 그 안 아래 줄 하나(o) = 결석 카드와 같은 꼴(div · 위 absgo · 아래 .absln.abscont · 새 모양 없음) ·
     줄도 큰 카드처럼 바로 재생(예전 큰 카드였던 것이 줄로 내려와도 누르면 하는 일은 같게) · «이어서 보기» 줄은 본 자리가 있으면 «· 12:40부터» */
  function heroLnHTML(l, rec, isNew, o, am) {

    return '<div class="' + (isNew ? 'newc' : 'cont') + ' tc hero hasln" data-top="' + (isNew ? 'new' : 'cont') + '"><a class="absgo" href="#v=' + encodeURIComponent(l.id) + '" data-act="go" data-play="1">' +
      cardBody(l, rec, isNew ? M.newLab : M.contLab, isNew ? 'new' : '', '', am['i' + l.id]) + '</a>' +
      '<a class="absln abscont" href="#v=' + encodeURIComponent(o.id) + '" data-act="go" data-play="1"><span class="k">' + esc(isNew ? M.contLab : M.newLab) + '</span><span class="v">· ' + esc(o.title) +
      (isNew && rec && op > 0 ? ' · ' + esc(L.fmtDur(op)) + '부터' : '') + '</span></a></div>';

  /* 이어서 보기: 다 보지 않은 강의 중 마지막으로 본 것(기록 동의일 때만) · skip = 뺄 강의({'i'+id: 1} · 결석한 날 수업)
     Q2(가 · 11-21): 마지막 본 날이 14일 안(오늘 포함 · 결석 카드 13일과 같은 창)인 것만 · 그보다 오래된 것은 목록 줄에만 */
  var CONT_DD = 13;
  function contBest(arr, skip) {
    var best = null, bt = -Infinity, today = L.isoDay(), i, l, t;
    skip = skip || {};
    for (i = 0; i < arr.length; i += 1) {
      l = arr[i];
      if (l.ended || l.confirmed || (+l.pct || 0) >= L.DONE || !l.last_at || skip['i' + l.id]) continue;
      if (dayDiff(today, L.isoDay(l.last_at)) > CONT_DD) continue;
      t = L.ts(l.last_at);
      if (t > bt) { bt = t; best = l; }
    }
    return best;
  }

  /* ------------------------------------------------------------ 학교 시험 범위(C2) */
  /* 범위 한 줄의 강의 중 이 목록에서 열 수 있는 것(공개 끝 뺌 · 서버 차례 = 수업일 이른 차례) */
  function rngLecs(it) {
    var out = [], ids = it && Object.prototype.toString.call(it.lectures) === '[object Array]' ? it.lectures : [], i, l;
    for (i = 0; i < ids.length; i += 1) {
      l = findLec(ids[i]);
      if (l && !l.ended && out.indexOf(l) < 0) out.push(l);
    }
    return out;
  }
  /* 범위 줄과 시험 하나(sc · L.examList 의 한 칸)가 같은 시험인가: 날짜가 겹침(범위 exam_on~end_on · 일정 date~end) */
  function rngTie(it, sc) {
    var a = L.isoOf(it.exam_on), b = L.isoOf(it.end_on) || a;
    if (!a || !sc) return false;
    if (b < a) b = a;
    return a <= sc.end_on && sc.exam_on <= b;
  }
  /* 카드에 띄울 시험 → {it, c:{title, sub, n, during, total, done}, ls, only} · 없으면 null
     D1(11-19): 보이는 때 = 히즈북스와 같음(켬이면 날짜 없이 · 끔이면 20일 전부터 · 시험 중 · 끝나면 없음) ·
     범위를 저장했고 그 시험과 날짜가 겹치면 범위 카드(링 진도 · 범위 n편) · 범위가 없으면 일정만 카드(only · 누를 곳 아님) ·
     일정에 안 묶인 범위 줄 = 예전 규칙(show_on 부터 · 시험 중이거나 20일 안) · 옛 서버(sched 없음) = 범위 카드만(지금과 같음)
     D2(11-19 · §8-234): 시험 = 히즈북스 D-day 목록(L.examList · 학교 시험 · 모의고사 · 수능 · 반 D-day · 3개까지) ·
     범위 줄은 목록 어느 것과든 날짜가 겹치면 묶음 · 카드 = 목록 첫째(시험 중 먼저 · 가까운 것) · 묶인 범위가 있으면 범위 카드 · 없으면 일정만 카드 ·
     둘째 · 셋째 시험은 화면에 더하지 않음 */
  function examTop(rec) {
    var r = S.rng, today = L.isoDay(), items = [], i, it, ls, n, j, best, c, sc, tie = false, dd, bd, lst = [], k, tl;
    if (!r || Object.prototype.toString.call(r.items) !== '[object Array]') return null;
    try {   /* D1: sched 꼴이 틀려도 홈은 그대로(범위 카드 규칙) */
      if (L.examList) lst = L.examList(r.sched, today);
      else if (L.examMine) { sc = L.examMine(r.sched, today); lst = sc ? [sc] : []; }
      if (Object.prototype.toString.call(lst) !== '[object Array]') lst = [];
    } catch (e0) { lst = []; }
    sc = lst.length ? lst[0] : null;
    for (i = 0; i < r.items.length; i += 1) {
      it = r.items[i];
      if (!it || typeof it !== 'object') continue;
      ls = rngLecs(it);
      if (!ls.length) continue;
      for (tl = false, k = 0; k < lst.length; k += 1) { if (rngTie(it, lst[k])) tl = true; }
      if (rngTie(it, sc)) tie = true;
      if (!tl) {
        if (it.show_on && L.isoOf(it.show_on) && today < L.isoOf(it.show_on)) continue;
        dd = L.ddayOf(it.exam_on, it.end_on, today);
        if (!dd || (!dd.during && dd.n > 20)) continue;
      }
      for (n = 0, j = 0; j < ls.length; j += 1) { if (isDone(ls[j], +ls[j].pct || 0)) n += 1; }
      items.push({ id: it.id, name: it.name, exam_on: it.exam_on, end_on: it.end_on, lectures: ls, done: n, src: it });
    }
    best = L.rngPickItem(items, today);
    if (sc && !tie) {   /* 일정만 후보: 시험 중 먼저 · 가까운 것 · 같으면 범위 줄 */
      bd = best ? L.ddayOf(best.exam_on, best.end_on, today) : null;
      if (!bd || (sc.during && !bd.during) || (sc.during === bd.during && sc.n < bd.n)) {
        it = { name: sc.name, exam_on: sc.exam_on, end_on: sc.end_on };
        c = L.rngCard({ name: sc.name, exam_on: sc.exam_on, end_on: sc.end_on, lectures: [], done: 0 }, today, rec);
        return c ? { it: it, c: c, ls: [], only: true } : null;
      }
    }
    if (!best) return null;
    c = L.rngCard(best, today, rec);
    if (!c) return null;
    return { it: best.src, c: c, ls: best.lectures };
  }
  /* 결론안 K 시험 카드: «D-9»(28) · «2학기 기말 · 11.25(수)» · «범위 4편 중 2편 학습 완료» · 칸 막대(다 본 칸 = 끝남 색)
     둘째 줄은 범위 자료(이름 · 시험일 · 끝나는 날)로 · «학교 시험»이나 빈 이름이면 이름 없이(C2 검수 L5) */
  function examLine(ex) {
    var it = ex.it || {}, c = ex.c, nm = String(it.name || '').replace(/^\s+|\s+$/g, ''), a = [], en = it.end_on ? L.isoDay(it.end_on) : '';
    if (nm && nm !== '학교 시험') a.push(nm);
    if (!c.during) { if (it.exam_on) a.push(L.fmtDay(L.isoDay(it.exam_on))); }
    else if (en && en > L.isoDay()) a.push(L.fmtDay(en) + '까지');
    return a.length ? a.join(' · ') : M.examLab;
  }
  function examSub(c, rec) { return rec ? '범위 ' + c.total + '편 중 ' + c.done + '편 학습 완료' : '범위 ' + c.total + '편'; }
  /* 2차(11-18) 시험 카드 링 56: 범위 편 가운데 다 본 만큼 딥그린(기록 동의일 때만) · 가운데 «D-9» / «시험 중» */
  function examRing(c, rec) {
    var r = 24.5, cf = 2 * Math.PI * r, f = rec && c.total > 0 ? Math.max(0, Math.min(1, c.done / c.total)) : 0;
    return '<span class="rg56" data-done="' + (rec ? c.done : 0) + '" data-total="' + c.total + '"><svg viewBox="0 0 56 56" width="56" height="56" aria-hidden="true" focusable="false">' +
      '<circle class="rgB" cx="28" cy="28" r="23"/><circle class="rgT" cx="28" cy="28" r="' + r + '" fill="none" stroke-width="4"/>' +
      (f > 0 ? '<circle class="rgP" cx="28" cy="28" r="' + r + '" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + cf.toFixed(2) +
        '" stroke-dashoffset="' + (cf * (1 - f)).toFixed(2) + '" transform="rotate(-90 28 28)"/>' : '') +
      /* 원판 rgB r 23 = 링 안쪽 22.5 보다 0.5 커서 트랙 밑에 숨음(이음새 없음) · 다섯 글자 이상(«D-DAY»)은 «시험 중»처럼 .sm 11.5px(링 안쪽 지름 45 · 11-18 대안 A) */
      '</svg><span class="d' + (c.during || String(c.val).length > 4 ? ' sm' : '') + '">' + esc(c.during ? '시험 중' : c.val) + '</span></span>';
  }
  /* nx(P1 · 11-21) = 카드 안 «다음 · 제목» 줄로 바로 재생할 강의(nextInRange) · 없으면 예전 카드 그대로 */
  function examCardHTML(ex, rec, nx) {
    var c = ex.c, a, np;
    /* D1 일정만 카드: 같은 링(진도 호 없음) + 첫 줄 하나 · 누를 곳 아님(범위 화면 없음) */
    if (ex.only) return '<div class="exam1 card only" data-top="exam">' + examRing(c, false) + '<span class="mn"><span class="l1">' + esc(examLine(ex)) + '</span></span></div>';
    a = '<a class="exam1' + (nx ? '' : ' card') + '" href="#rng" data-act="go"' + (nx ? '' : ' data-top="exam"') + ' aria-label="' + esc(M.examLab + ' ' + c.title + ' · ' + examSub(c, rec)) + '">' +
      examRing(c, rec) + '<span class="mn"><span class="l1">' + esc(examLine(ex)) + '</span>' +
      '<span class="l2">' + esc(examSub(c, rec)) + '</span></span></a>';
    if (!nx) return a;
    /* P1: 흰 카드 한 장 안 = 위 시험 줄(범위 화면으로) + 아래 결석 카드와 같은 줄(.absln · «다음 · 제목 · 12:40부터» · 바로 재생) */
    np = +nx.pos || 0;
    return '<div class="exw card" data-top="exam">' + a +
      '<a class="absln abscont" href="#v=' + encodeURIComponent(nx.id) + '" data-act="go" data-play="1"><span class="k">' + esc(M.nextLab) + '</span><span class="v">· ' + esc(nx.title) +
      (rec && np > 0 ? ' · ' + esc(L.fmtDur(np)) + '부터' : '') + '</span></a></div>';
  }
  /* 범위 강의 차례(범위 화면 · P1 «다음» 같음): 다 본 것 아래 · 덜 본 %부터 · 같으면 범위 차례(수업일 이른 것) */
  function rngSort(ls) {
    var ord = {}, i;
    for (i = 0; i < ls.length; i += 1) ord[ls[i].id] = i;
    ls.sort(function (x, y) {
      var px = +x.pct || 0, py = +y.pct || 0, dx = isDone(x, px) ? 1 : 0, dy = isDone(y, py) ? 1 : 0;
      return (dx - dy) || (px - py) || (ord[x.id] - ord[y.id]);
    });
    return ls;
  }
  /* P1(11-21 결론안): 시험 카드 «다음» = 범위 화면 첫 줄이 덜 본 강의면 그것(기록 동의일 때만 · 일정만 카드 없음) ·
     범위를 다 봤으면 없음 · 맨 위 카드 · 그 안 줄과 같은 강의면 없음(top = {'i'+id: 1}) */
  function nextInRange(ex, rec, top) {
    var l;
    if (!rec || !ex || ex.only || !ex.ls || !ex.ls.length) return null;
    l = rngSort(ex.ls.slice())[0];
    if (!l || l.ended || isDone(l, +l.pct || 0) || (top && top['i' + l.id])) return null;
    return l;
  }
  /* 11-27 결론안 8 · 9 학생 글(M 객체는 그대로 두고 여기서 더함 · boot 보다 앞이라 첫 그림 전에 돎) */
  M.hvDone = '다 봤어요';
  M.hvConf = '선생님 확인';
  M.hvAns = '새 답변';
  M.hvFrom = '부터';
  M.hvStop = '에서 멈췄어요';
  M.hvTurn = '부터 볼 차례예요';
  M.hvPsg = '지문';
  M.hvCnt = '개';
  M.hvSee = '보기';
  M.rngQ = '워크북 번호로 바로';
  M.rngQa = '워크북 번호로 바로 가기';
  M.rngNo = '목록에 그 번호가 없어요';
  M.rngAll = '범위 영상을 다 봤어요';
  M.rngAgain = '처음부터 다시 보기';
  /* 범위 영상 목록(#rng) · 11-27 결론안 8 «지문 지도 A»(원장님 «썸네일 그대로 + 썸네일 아래 끝 지문 띠 + 지문 단추»):

  /* 11-22 (5) 옮긴 뒤 되돌리기: 지문 띠 · 목차 줄로 옮기면 있는 #resume 줄(«이어서» 줄)을 «05번으로 옮겼어요 · ‹ 45:26으로»로(45:26 = 옮기기 직전 자리)
     줄이 떠 있는 동안 띠 · 목차로 또 옮기면 «처음 자리»를 그대로 둠(45:26 → 05번 → 07번이어도 «‹ 45:26으로» · 같은 칸을 다시 눌러도 줄이 남음) · 30초 뒤 숨김(그 줄일 때만 · data-mv 번호로 견줌 · 옮길 때마다 다시 30초)
     · 되돌리면 옮기기 전 줄로(«이어서» 줄이었으면 그것 · 아니면 숨김)
     안 띄움 = 직전 자리를 모름(유튜브 재생기 준비 전 · 아직 안 틀었고 «이어서» 줄도 없음) · 두 자리가 10초 안쪽 · 되돌리기 단추로 옮김(되돌리기의 되돌리기 없음) */
  var MV_SEQ = 0;
  function mvFrom() {
    var rs = $('resume');
    if (!T || !T.P || T.err || T.P.ok === false) return -1;   /* 유튜브 재생기가 준비(onReady)되기 전에는 옮기기가 버려짐(전부터) → 줄을 안 띄움 · 준비 뒤 «아직 안 틂»은 아래 «이어서» 줄 자리(길이를 아직 몰라도 옮기기는 됨) */
    if (T.played) return lecTime();
    if (rs && !rs.hidden && !rs.getAttribute('data-mv') && T.resumeL >= 1) return T.resumeL;   /* 아직 안 틂 = «이어서» 줄이 가리키는 자리 */
    return -1;
  }
  function roOf(s) {   /* 로 · 으로(끝 글자 받침 · 숫자는 읽는 소리 · 관리 앱과 같은 규칙) · 모르는 글자 = '' */
    s = String(s || '');
    var ch = s.charAt(s.length - 1), c = ch.charCodeAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) { c = (c - 0xAC00) % 28; return c === 0 || c === 8 ? '로' : '으로'; }
    if (c >= 48 && c <= 57) return '036'.indexOf(ch) >= 0 ? '으로' : '로';
    return '';
  }
  function mvName(t) {   /* 옮긴 자리 이름 = «05번» · «10~11번» · 번호 없는 지문은 «지금» 줄과 같은 짧은 이름(10자까지 · 조사를 알 때만) · 없으면 '' */
    var ch = T.lec.chapters || [], i = L.chapterAt(ch, t), nm;
    if (i < 0) return '';
    nm = nowName(ch[i]);
    return nm && nm.length <= 10 && roOf(nm) ? nm : '';
  }
  function mvShow(a, b, snap) {
    var rs = $('resume'), nm, at, tk;
    if (!rs || !T || T.err || !(a >= 0) || Math.abs(b - a) < 10) return;
    nm = mvName(b);
    at = L.fmtDur(a);
    MV_SEQ += 1;
    tk = String(MV_SEQ);
    T.mv = { back: a, snap: snap || '' };
    if (T.hv) rs.innerHTML = '<span class="sr">' + (nm ? esc(nm) + roOf(nm) + ' ' : '') + '옮겼어요</span><button type="button" data-act="mvback" class="hit g3re" aria-label="' + esc(at) + (roOf(at) || '로') + ' 되돌리기"><span>‹ ' + esc(at) + (roOf(at) || '로') + '</span></button>';   /* 11-27 무대: 상태 칸 자리 알약 하나 */
    else rs.innerHTML = '<span>' + (nm ? esc(nm) + roOf(nm) + ' ' : '') + '옮겼어요</span><span aria-hidden="true">·</span><button type="button" data-act="mvback" class="hit" aria-label="' + esc(at) + (roOf(at) || '로') + ' 되돌리기">‹ ' + esc(at) + (roOf(at) || '로') + '</button>';
    rs.setAttribute('data-mv', tk);
    rs.hidden = false;
    setTimeout(function () {
      var r = $('resume');
      if (!r || r.getAttribute('data-mv') !== tk) return;   /* 뒤 이동 · «이어서» 줄 · 다른 강의 화면이면 그대로 */
      r.hidden = true;
      r.removeAttribute('data-mv');
      if (T) T.mv = null;
    }, 30000);
  }
  function mvBack() {
    var mv = T && T.mv, rs;
    if (!mv) return;
    T.mv = null;
    seekL(mv.back);
    rs = $('resume');
    if (!rs) return;
    rs.removeAttribute('data-mv');
    if (mv.snap && !(T.hv && T.g3reOff)) { rs.innerHTML = mv.snap; rs.hidden = false; } else rs.hidden = true;   /* 11-27 무대: «처음부터» 알약은 30초 · 판 깨기 뒤엔 다시 안 띄움 */
  }

  /* ------------------------------------------------------------ 나가기 */
  /* 누르면 바로 로그인 화면(서버 답을 기다리지 않음). 앞 학생 열쇠와 기록(보내는 중 · 못 보낸 것)을

  function logout() {
    var k = S.key, a = pendRows(), i, n, sent = false;
    teardown();
    var w = fly.slice();
    if (PBUSY) w.push(PBUSY);   /* F5(11-21): 다시 보내는 중인 밀린 줄도 열쇠를 거두기 전에 기다림 */

    sqDrop();   /* F5: 못 보낸 외우기 · 따라 말하기 표시(localStorage)도 지움 */
    L.lsDel(HOME0); /* P2 ③ · P5(11-21 · S2): 이 기기의 지난 집 정보 · 지난 목록 */
    SEEN = null;
    S.key = ''; S.name = ''; S.home = null; S.lectures = []; S.consent = null; S.att = null; S.paper = null; S.pdf = null; S.rng = null; hvSync();
    S.al = null; S.alFresh = false; S.nIds = null; S.set = null; S.setDirty = false; S.setMore = false;
    spkFresh();
    clearHash();
    showLogin('');
    for (i = 0; i < a.length; i += 1) { if (a[i] && (!a[i].n || a[i].n !== PCUR)) w.push(L.beat(lateRow(a[i]))); }   /* 밀린 줄(late) · 지금 다시 보내는 중인 한 줄은 빼고 */
    function bye() {
      if (sent) return;
      sent = true;
      L.logout(k).then(null, function () { /* 없음 */ });
    }
    function one() { n -= 1; if (n <= 0) bye(); }
    n = w.length;
    for (i = 0; i < w.length; i += 1) w[i].then(one, one);
    if (!n) bye();
    setTimeout(bye, 4000);
  }

    var act = el.getAttribute('data-act');
    if (act === 'go') S.wantAt = attr(el, 'data-at') != null && isFinite(parseFloat(attr(el, 'data-at'))) ? parseFloat(attr(el, 'data-at')) : null; /* 약속 1: 지문 단추 = 그 지문 시각부터(무대가 읽음) · 다른 링크 = null */
    if (act === 'go') { mphGrab(el); S.nav = true; S.autoplay = attr(el, 'data-play') ? Date.now() : 0; S.wantTab = attr(el, 'data-tab') === 'qna' ? 'qna' : ''; return; } /* 주소(#v=) 그대로 따라감 · 맨 위 카드 = 열리면 바로 재생(결론안 K 3절) */
    if (act === 'pdf') { /* P1 필기 PDF: 주소(href · target)는 그릴 때 정함 · 여기서는 영상을 멈추고 한 줄만(받기 · 열기는 브라우저가) */

      if (pm) pm.textContent = L.pdfNote(pwaOs(), /KAKAOTALK/i.test(String(navigator.userAgent || '')));
      return;
    }
    if (el.tagName === 'A' && act !== 'go') e.preventDefault();
    if (act === 'dfill') {
      var n = $('lgName'), p = $('lgPin');
      if (n) n.value = attr(el, 'data-n');
      if (p) { p.value = attr(el, 'data-p'); p.setAttribute('data-n', String(p.value.length)); }
      setHTML('lgErr', '');
      pinPaint();
    } else if (act === 'dgone') { demoGone(); }

      if (window.LecMock) window.LecMock.reset();

    } else if (act === 'agree') { choose('agree', el); }

    else if (act === 'me') { pwaOpen(el, 'me'); }
