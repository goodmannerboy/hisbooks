/* 홈 화면 앱(PWA · 11-16): 설치 이벤트를 맨 앞에서 받아 둠(크롬 기본 띠는 막고 «설치하기» 단추로 띄움) · 화면 코드는 window.__hisPwa 를 봄 */
(function () {
  var P = window.__hisPwa = { e: null, done: false, cb: null };
  function tell(k) { if (P.cb) { try { P.cb(k); } catch (x) { /* 없음 */ } } }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); P.e = e; tell('prompt'); });
  window.addEventListener('appinstalled', function () { P.e = null; P.done = true; tell('installed'); });
})();

<style>
/* 2차 디자인(11-18 원장님 «두 앱 넣어»): 글꼴 Pretendard 를 앱에 실음(앱 폴더 assets · 400 · 600 · 700 · 바깥 요청 0) */
@font-face{font-family:"Pretendard";font-style:normal;font-weight:400;font-display:swap;src:url(assets/pretendard-400.woff) format("woff")}
@font-face{font-family:"Pretendard";font-style:normal;font-weight:600;font-display:swap;src:url(assets/pretendard-600.woff) format("woff")}
@font-face{font-family:"Pretendard";font-style:normal;font-weight:700;font-display:swap;src:url(assets/pretendard-700.woff) format("woff")}
/* 결론안 K(11-16) · 밝은 토큰 = 목록·들어오기 · 무대 토큰 = 보기 화면(html.stg) · 다크 모드 폰도 목록·들어오기는 크림(11-16 원장님)
   2차(11-18): 바탕 크림 #FAF6EC(결론안 §9 «크림 연하게») · 카드 흰색 + 테 .10 · 글 #1A1A18 · 딥그린은 --acc(강조 · 단추 · 진도) */
:root{color-scheme:light;color-scheme:only light;--bg:#FAF6EC;--card:#FFFFFF;--edge:rgba(70,52,12,.10);--line:rgba(70,52,12,.13);--dash:#CBBF9A;--ink:#1A1A18;--ink2:#57534A;--acc:#0C4631;--accB:#E3EBDD;--track:rgba(12,70,49,.15);--tile:#E9F0EC;--tileT:#0C4631;--done:#1B6A43;--focus:#0C4631;--rv:#8A8D80;--fillB:#0C4631;--fillT:#FFFFFF;--fill:#EAE1C8;--press:#F3EEE2;--inL:#E6DCBF;--sl:#CBBF9A;--gold:#7A5410;--cur:#F4EEDB;--seen:#0C4631;--gB:#DDF0E5;--gT:#1B6A43;--aB:#FBF0C9;--aT:#98480A;--sB:#DFEAF8;--sT:#1B5499;--nB:#EFEDE5;--nT:#57534A;--cB:#FBE9E3;--cT:#B3302A;--art:#F7F2E4;--artT:#0B3D2E;--artL:rgba(70,52,12,.14)}
html.stg{color-scheme:dark;--bg:#0D241A;--card:rgba(255,255,255,.07);--edge:rgba(255,255,255,.10);--acc:#8FD0AE;--accB:rgba(255,255,255,.11);--line:rgba(255,255,255,.10);--dash:#5A7A6A;--ink:#F3F1EA;--ink2:#B9C2BB;--ink3:#9DA9A0;--track:rgba(255,255,255,.2);--tile:rgba(255,255,255,.11);--tileT:#F3F1EA;--done:#8FD0AE;--focus:#8FD0AE;--rv:#9DA9A0;--fillB:#F3F1EA;--fillT:#0C4631;--press:rgba(255,255,255,.11);--inL:rgba(255,255,255,.14);--sl:rgba(255,255,255,.14);--gold:#8FD0AE;--cur:rgba(255,255,255,.07);--seen:#F3F1EA;--gB:rgba(143,208,174,.16);--gT:#8FD0AE;--aB:rgba(240,178,107,.16);--aT:#F0B26B;--sB:rgba(169,205,232,.16);--sT:#A9CDE8;--nB:rgba(255,255,255,.11);--nT:#B9C2BB;--cB:rgba(242,184,172,.16);--cT:#F2B8AC;--glass:rgba(255,255,255,.11);--sel:rgba(255,255,255,.15)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none !important}
svg{flex:0 0 auto}
h1,h2,.tt{text-wrap:balance}
.wrap{max-width:760px;margin:0 auto;padding:0 20px calc(36px + env(safe-area-inset-bottom));padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
.wrap.wide{max-width:1280px}
.top{display:flex;align-items:center;gap:8px;min-height:48px;padding:2px 0}
.fish{display:block;width:24px;height:11.65px;color:var(--acc)}
.brand{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.sp{flex:1 1 auto;min-width:0}
.me{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.lo{flex:0 0 auto;min-width:44px;height:44px;margin-right:-4px;border:0;background:none;padding:0 4px;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.hit{position:relative}
.hit:after{content:"";position:absolute;left:-8px;right:-8px;top:-8px;bottom:-8px}
.tbtn{background:none;border:0;padding:6px 2px;font-size:13px;font-weight:600;color:var(--acc);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:16px}
.btn-fill{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--fillB);color:var(--fillT);font-size:16px;font-weight:700;padding:12px 16px;text-decoration:none;transition:opacity .16s}
.btn-line{display:block;width:100%;min-height:48px;border:1px solid var(--sl);border-radius:12px;background:transparent;color:var(--ink);font-size:16px;font-weight:700;padding:12px 16px}
.btn-fill[disabled],.btn-line[disabled]{opacity:.55;cursor:default}
.btn-fill[aria-busy="true"]{opacity:.6;cursor:progress}
.btn-sm{display:inline-flex;align-items:center;min-height:36px;border:1px solid var(--sl);border-radius:12px;background:transparent;color:var(--ink);font-size:15px;font-weight:700;padding:0 16px}
.sub{font-size:13px;color:var(--ink2)}
.err{font-size:13px;font-weight:700;color:var(--cT);min-height:20px;margin:8px 0 0}
/* 들어오기 */
.login{max-width:400px;margin:0 auto;padding:64px 12px 0}
.login .head{display:flex;flex-direction:column;align-items:center;text-align:center}
.login .head .fish{width:56px;height:27.2px}
.login h1{margin:14px 0 0;font-size:28px;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.login .lgs{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.login h1.wmh{margin:18px 0 0;line-height:0}
.login h1.wmh .wm{display:block;width:170px;height:auto}
.login h1.wmh + .lgs{margin-top:12px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.fld{display:block;margin:20px 0 0}
.fld>span,.fld>label{display:block;font-size:13px;color:var(--ink2);margin:0 0 6px}
.fld input{display:block;width:100%;height:50px;border:1px solid var(--inL);border-radius:12px;background:var(--card);padding:0 14px;font-size:17px}
.fld input:focus{border-color:var(--focus);outline:none}
.pin4{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pin4 i{display:flex;align-items:center;justify-content:center;height:56px;border:1px solid var(--inL);border-radius:12px;background:var(--card);font-style:normal;font-size:24px;font-weight:700;line-height:1}
.pin4 i.cur{border:2px solid var(--focus)}
.pin4 input#lgPin{position:absolute;left:0;top:0;z-index:1;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:12px;background:transparent;color:transparent;caret-color:transparent;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.pin4 input#lgPin::selection{background:transparent}
.login .btn-fill{margin-top:24px}
.demo{margin-top:24px;padding:12px;border:1px dashed var(--dash);border-radius:12px}
.demo p{margin:0 0 8px;font-size:13px;color:var(--ink2)}
.demo .chips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink)}
.dchip small{font-size:12px;font-weight:400;color:var(--ink2)}
/* 동의 */
.cons{max-width:560px;margin:0 auto}
.cons h1{margin:4px 0 12px;font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
.cons ol{margin:0;padding:0;list-style:none;counter-reset:c}
.cons li{position:relative;padding:12px 0 12px 32px;border-top:1px solid var(--line);text-align:justify;font-size:15px;word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
.cons li:first-child{border-top:0;padding-top:4px}
.cons li:before{counter-increment:c;content:counter(c);position:absolute;left:0;top:12px;width:22px;height:22px;border-radius:50%;border:1px solid var(--dash);font-size:12px;font-weight:700;line-height:20px;text-align:center}
.cons li:first-child:before{top:4px}
.cons .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.cons .cur{margin:12px 0 0;font-size:13px;font-weight:700;color:var(--gT)}
/* 홈 화면에 앱으로 추가(PWA · 11-16): 조용한 글자 단추(들어오기 «들어가기» 아래 · 목록 맨 아래) + 동의 카드 모양의 시트 */
.pwab{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;margin:0 auto;padding:0 12px;border:0;border-radius:12px;background:none;color:var(--ink2);font-size:14px;font-weight:400;line-height:1.3}
.pwab svg{display:block}
.login .pwab{margin-top:-4px}
.pwab.l{margin-top:16px}
/* 새 영상 알림(N1 · 11-17 · 홈 화면 앱에서만): 목록 카드(«이어서 보기» 아래 · 단추 하나) · 첫 로그인 뒤 한 단계 · 켠 순간 한 줄 */
.alc{margin:16px 0 0}
.alh{display:flex;align-items:center;gap:8px;color:var(--gold)}
.alh h1,.alh h2{margin:0;font-size:16px;font-weight:700;line-height:1.3;color:var(--ink);letter-spacing:-.01em}
.als{margin:6px 0 0;font-size:14px;line-height:1.55;color:var(--ink2);text-align:justify;word-break:keep-all}
.alb{display:flex;align-items:center;gap:8px;margin-top:14px}
.alb .btn-fill{flex:1 1 auto;width:auto;min-height:44px;font-size:15px}
.alst .alh h1{font-size:20px;letter-spacing:-.02em}
.alst .als{margin-top:10px;font-size:15px}
.altoast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));z-index:70;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;background:var(--fillB);color:var(--fillT);font-size:14px;font-weight:700;line-height:1.4;text-align:center;word-break:keep-all;box-shadow:0 6px 20px rgba(12,70,49,.18)}
html.pwon,html.pwon body{overflow:hidden}
.pwa{position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:max(12px,env(safe-area-inset-bottom))}
.pwbg{position:absolute;left:0;top:0;right:0;bottom:0;background:var(--ink);opacity:.4}
.pwa .pwc{position:relative;width:100%;max-width:440px;max-height:100%;margin:0;overflow:auto;-webkit-overflow-scrolling:touch;outline:none}
.pwc h2{margin:4px 0 8px;font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
.pwc .pwbd{margin-top:4px}
@media (min-width:600px){.pwa{align-items:center}}
/* 설치 안내 결론안(11-16): 머리 아래 작은 줄 · 맥락마다 큰 단추 또는 번호 세 단계 · 단추 이름 칩(한 줄 · 낱말 가운데서 안 끊김) · 설치 끝 화면 · 영상 끝 한 줄 */
.pwc .pwsb{margin:-4px 0 12px;font-size:13px;color:var(--ink2);word-break:keep-all}
.pwc .pwld{margin:0;font-size:15px;line-height:1.55;text-align:justify;word-break:keep-all;line-break:strict}
.pwc .pwbd .btn-fill{margin:12px 0 4px}
.pwc .pwbd .btn-fill svg{display:block}
.pwc .pwn{margin:8px 0 0;font-size:13px;line-height:1.75;color:var(--ink2);text-align:justify;word-break:keep-all;line-break:strict}
.pwc .pwn .ky{height:24px;min-width:24px;font-size:13px}
.pwc .pwol{list-style:none;margin:4px 0 0;padding:0}
.pwc .pwol li{display:flex;align-items:flex-start;gap:10px;margin:0 0 14px;padding:0;border:0;font-size:15px;line-height:1.75;text-align:left;word-break:keep-all;line-break:strict}
.pwc .pwol li:last-child{margin-bottom:4px}
.pwc .pwol li:before{content:none}
.pwc .pwol .no{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin-top:2px;border-radius:50%;background:var(--fillB);color:var(--fillT);font-size:13px;font-weight:700;line-height:1}
.pwc .pwol .tx{flex:1 1 auto;min-width:0;text-align:justify}
.pwc .pwol small{display:block;margin-top:1px;font-size:13px;line-height:1.5;color:var(--ink2)}
.ky{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:26px;min-width:26px;margin:0 2px;padding:0 7px;border-radius:8px;background:#EFE6CF;color:#0C4631;font-size:14px;font-weight:400;line-height:1;vertical-align:middle;white-space:nowrap}
.ky svg{display:block}
html.stg .ky{background:#1A3B2C;color:#F4ECD7}
.kyw{white-space:nowrap}
.kyw>.ky{margin-right:0}
.pwc .pwpath{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;text-align:left}
.pwc .pwpath>span{white-space:nowrap}
.pwc .pwpath .ky{margin:0}
.pwc .pwdone{display:flex;flex-direction:column;align-items:center;padding:8px 0 0;text-align:center}
.pwc .pwdone img{display:block;width:64px;height:64px}
.pwc .pwdone h2{margin:14px 0 4px}
.pwc .pwdone p{margin:0;font-size:15px;color:var(--ink2);word-break:keep-all}
.pwc .pwdone .btn-fill{margin-top:20px}
.endc .pwh{display:flex;align-items:center;gap:4px;margin:12px 0 -8px;padding-top:4px;border-top:1px solid var(--line)}
.endc .pwh .pwhb{flex:1 1 auto;display:flex;align-items:center;gap:8px;min-width:0;min-height:44px;padding:0;border:0;background:none;color:var(--ink);font-size:14px;font-weight:700;text-align:left}
.endc .pwh .pwhx{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-right:-12px;padding:0;border:0;background:none;color:var(--ink2)}
/* 꼬리표 · 맨 위 카드 */
.tag{display:inline-flex;align-items:center;vertical-align:1px;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:600;line-height:1;white-space:nowrap;background:var(--nB);color:var(--nT)}
.tag.amb{background:var(--aB);color:var(--aT)}
.tag.sky,.tag.new,.tag.ans{background:var(--sB);color:var(--sT)}
.tag.grn{background:var(--gB);color:var(--gT)}
/* 2차(11-18) 큰 카드 = TV «이어 보기»: 크림 그림 한 장(교재 · 제목 · 판서 종이 · 물고기 · 남은 시간 · CSS 로 그림 · 바깥 요청 0) + 상태 점 글 · 제목 22 · 정보 줄 · 캡슐 단추
   아래 줄(«결석한 날 수업 N편 더» · 다른 강의 이어서 보기)은 카드 안 · PC(700 이상) = 그림 왼쪽 340 · 글 오른쪽 */
.tc{display:block;margin:16px 0 0;color:inherit;text-decoration:none}
.tc .absgo{display:block;color:inherit;text-decoration:none}
.art{position:relative;display:block;height:0;padding-top:56.25%;border-radius:14px;background:var(--art);color:var(--artT);overflow:hidden;box-shadow:inset 0 0 0 1px var(--artL)}
.art-tx{position:absolute;left:18px;top:15%;right:38%}
.art-bk{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.01em}
.art-rg{display:block;margin-top:4px;font-size:17px;line-height:22px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art-paper{position:absolute;right:4.6%;top:7%;width:29.7%;height:74%;border-radius:2px;background:#FFFFFF;box-shadow:0 .5px 1px rgba(70,52,12,.18),0 1px 3px rgba(70,52,12,.10)}
.art-paper svg{display:block}
.art-sig{position:absolute;left:18px;bottom:44px;width:28px;height:13.6px;color:var(--artT)}
.art-pg{position:absolute;left:18px;right:18px;bottom:14px;display:flex;align-items:center;gap:12px}
.art-bar{flex:1 1 auto;height:4px;border-radius:2px;background:rgba(11,61,46,.16);overflow:hidden}
.art-bar i{display:block;height:100%;border-radius:2px;background:var(--artT)}
.art-left{flex:0 0 auto;font-size:13px;line-height:18px;font-weight:600;white-space:nowrap}
.eb{display:flex;align-items:center;flex-wrap:wrap;gap:2px 12px;font-size:13px;line-height:18px;font-weight:600;color:var(--ink2)}
.ebi{display:inline-flex;align-items:center;gap:6px}
.edot{display:inline-block;flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:currentColor}
.eb.amb,.ebi.amb{color:var(--aT)}
.ebi.new{color:var(--sT)}
.tc .lab{margin:12px 0 0}
.tc .tt{display:block;margin:2px 0 0;font-size:22px;font-weight:700;line-height:28px;letter-spacing:-.01em}
.tc .cr{display:block;margin:2px 0 0;font-size:15px;line-height:20px;color:var(--ink2);font-variant-numeric:tabular-nums}
.hx{display:block}
.hact{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin:12px 0 0}
.tc .btn-fill{display:inline-flex;width:auto;min-height:44px;height:44px;padding:0 22px;border-radius:22px;font-size:17px;font-weight:600;line-height:22px}
.tc .btn-fill b{font-weight:600}
.tc .tip{margin:0;font-size:13px;line-height:18px;color:var(--ink2)}

/* 큰 카드 아래 줄 · 홈 «새 답변» 줄: 44 · 위 선 · 17 · 끝 «›»(C2 검수 L3 · 글자가 아니라 꾸밈이라 읽어 주지 않음) · 결석 카드 안의 줄은 카드 장수에 안 셈(검수 A M6) */

.rg56{position:relative;flex:0 0 auto;width:56px;height:56px;--ddB:#FCE6EA;--ddT:#F5CBD3;--ddP:#D9546D;--ddI:#B32D47}
.rg56 svg{display:block}
.rg56 .rgB{fill:var(--ddB)}
.rg56 .rgT{stroke:var(--ddT)}
.rg56 .rgP{stroke:var(--ddP)}
.exam1 .d{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-family:"Noto Serif KR DD","Pretendard",serif;font-size:14.5px;font-weight:900;line-height:20px;text-align:center;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ddI)}
.exam1 .d.sm{font-size:11.5px;font-weight:900}
.exam1 .mn{flex:1 1 auto;min-width:0}
.exam1 .l1{display:block;font-size:17px;font-weight:600;line-height:22px;letter-spacing:-.01em}
.exam1 .l2{display:block;margin-top:2px;font-size:15px;line-height:20px;color:var(--ink2)}
.exam1::after{content:'\203A';flex:0 0 auto;font-size:20px;line-height:1;color:var(--ink2)}
.rhead{margin:4px 0 12px}
.rhead h1{margin:0;font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
.rhead p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
/* 목록 줄(2차 · 결론안 §9 «구분 · 크림 연하게» 11-18 원장님 «결론안대로»): 교재마다 흰 카드(테 1px .10 · 둥글기 16) · 묶음 제목 20/600 딥그린(위 32 · 아래 8)
   줄 안 16 · 줄 사이 선 .16 = 숫자 칸(x=16)부터 카드 오른쪽 끝까지 · 숫자 칸 56 #E9F0EC · 캡슐 #E3EBDD(한 단 짙게) · 줄 초점 테는 안쪽(-2px) */
.grp{margin:0}
.grp h2{margin:32px 0 8px;padding:0;font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.01em;color:var(--acc)}
.rows{background:var(--card);border:1px solid var(--edge);border-radius:16px;overflow:hidden}
.row{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr);align-items:start;gap:14px;padding:16px;text-decoration:none;color:inherit;transition:background-color .24s}
.row + .row:before{content:"";position:absolute;left:16px;right:0;top:0;border-top:1px solid rgba(70,52,12,.16)}
a.row:active{background:var(--press)}
a.row:focus-visible{outline-offset:-2px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:56px;border-radius:12px;background:var(--tile);color:var(--tileT);line-height:1.1;text-align:center}
.tile b{font-size:22px;line-height:24px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile b.l{font-size:15px;line-height:20px}
.tile small{font-size:12px;line-height:14px;font-weight:600}
.row .mn{min-width:0;padding-top:1px}
.row .rs{display:flex;align-items:center;flex-wrap:wrap;gap:2px 12px;margin:0 0 2px;font-size:13px;line-height:18px;font-weight:600;color:var(--ink2)}
.row .rs .tag{padding:0;border-radius:0;background:none;font-size:13px;font-weight:600;line-height:18px;vertical-align:0}
.row .rs .tag.amb:before,.row .rs .tag.new:before,.row .rs .tag.ans:before{content:"";display:inline-block;flex:0 0 auto;width:7px;height:7px;margin-right:6px;border-radius:50%;background:currentColor}
.row .tt{font-size:17px;font-weight:600;line-height:22px;letter-spacing:-.01em}
.row .mt{margin-top:2px;font-size:15px;line-height:20px;color:var(--ink2);font-variant-numeric:tabular-nums}
.row .mt .mi{white-space:nowrap}
.row .st{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.row .st.ok{color:var(--done)}
.row .un{margin-top:4px;font-size:13px;font-weight:600;color:var(--aT)}
.cap{display:inline-flex;align-items:center;gap:8px;height:30px;margin:8px 0 0;padding:0 12px 0 11px;border-radius:15px;background:var(--accB);color:var(--acc);font-size:13px;line-height:18px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.cap svg{display:block}
.mb{display:block;width:28px;height:4px;border-radius:2px;background:rgba(12,70,49,.2);overflow:hidden}
.mb i{display:block;height:100%;border-radius:2px;background:var(--acc)}
.mb.rv i{background:var(--rv)}
.row .done{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;line-height:18px;font-weight:600;color:var(--done)}
.row .done svg{display:block;flex:0 0 auto}
.row .done span{color:var(--done)}
.row.flash{background:var(--aB)}
.row.off{opacity:.55;cursor:default}
.row .tag.end{margin-top:6px}
.ring{display:block;width:36px;height:36px}
.ring .rgT{stroke:var(--track)}
.ring .rgP{stroke:var(--acc)}
.ring.rv .rgP{stroke:var(--rv)}
.ring.ok .rgT{stroke:var(--done)}
.ring .rgC{stroke:var(--gT)}
.s1t .ring.ok .rgT{fill:var(--done)}
.s1t .ring.ok .rgC{stroke:#FFFFFF}
.empty{padding:28px 16px;text-align:center;color:var(--ink2);font-size:13px}
/* 보기 화면(무대) */
.pch{display:none}
.ptop{display:flex;align-items:center;gap:6px;min-height:44px}
.ptop .pt{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:8px}
.ptop .pt b{display:block;min-width:0;font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .pt span{display:none;flex:0 1 auto;min-width:0;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backb{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;min-width:44px;height:44px;margin-left:-4px;padding:0 4px;background:none;border:0;font-size:15px;color:var(--ink);white-space:nowrap}
.backb .ar{font-size:20px;line-height:1;margin-top:-2px}
/* P1 필기 PDF(11-16): 제목 줄 오른쪽 단추(누르는 곳 44 · 목록 단추와 같은 높이) · 누른 뒤 단추 아래 한 줄(PC 는 없음) */
.ptop .pdfb{flex:0 0 auto;margin-left:auto;gap:6px;min-height:44px;padding:0 12px;text-decoration:none;white-space:nowrap}
.ptop .pdfb svg{flex:0 0 auto;color:var(--gold)}
.pdfm{margin:0 0 8px;font-size:13px;line-height:1.45;color:var(--ink2);text-align:justify}
.pdfm:empty{display:none}
.vid{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden}
.vid iframe,.vid .yt,.vid .fake{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.fake{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#F4ECD7;background:#000}
.fake .fl{font-size:12px;opacity:.75}
.fake .ft{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.fake button{min-width:96px;min-height:44px;border:1px solid #5A7A6A;border-radius:999px;background:transparent;color:#F4ECD7;font-weight:700;padding:6px 18px}
.verr{padding:20px 16px;text-align:center}
.verr p{margin:0 0 14px;font-size:16px;font-weight:700}
.endc{margin:12px 0 0;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.endc .eh{display:flex;align-items:flex-start;gap:10px}
.endc .eh svg{margin-top:1px}
.endc .et{font-size:15px;font-weight:700;line-height:1.4}
.endc .es{margin-top:2px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.endc .btn-fill{margin-top:14px}
.band{display:flex;gap:3px;margin:8px 0 0;-webkit-user-select:none;user-select:none}
.band button{position:relative;flex:1 1 0;min-width:0;height:44px;margin:0;padding:0;border:0;background:none;color:var(--ink2);font-size:12px;line-height:1;font-variant-numeric:tabular-nums}
.band .bt{position:absolute;left:0;right:0;top:8px;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.band .bt b{display:block;height:100%;background:var(--seen)}
.band em{position:absolute;top:2px;width:2px;height:4px;margin-left:-1px;background:var(--ink2)}
.band .bl{position:absolute;left:50%;top:22px;transform:translateX(-50%);white-space:nowrap}
.band button.on .bl{color:var(--ink);font-weight:700}
.nowl{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;margin:4px 0 0}
.nowl .ch{font-size:15px;font-weight:700;letter-spacing:-.01em}
.nowl .tm{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.nowl .ms{margin-left:auto;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.resume{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:8px 0 0;font-size:13px;color:var(--ink2)}
.resume button{background:none;border:0;padding:4px 2px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.ctl{display:flex;align-items:center;gap:8px;margin:10px 0 0}
.b10{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:2px;width:56px;height:44px;padding:0;border:1px solid var(--sl);border-radius:12px;background:transparent;font-size:13px;color:var(--ink)}
.spd{flex:1 1 auto;display:flex;min-width:0;height:44px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--sl)}
.spd button{flex:1 1 0;min-width:0;height:44px;margin:0;padding:4px 2px;border:0;border-radius:12px;background:transparent;background-clip:content-box;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;transition:background-color .16s}
.spd button.on{background-color:var(--fillB);color:var(--fillT);font-weight:700}
/* C3 종이 줄 · C7 멈추고 풀기(영상 밖 · 폰 = 단추 아래 · PC = 오른쪽 칸 맨 위) */
.paper{display:flex;align-items:flex-start;gap:6px;margin:0;padding:8px 10px 4px;font-size:13px;line-height:1.45;color:var(--ink2)}
.paper svg{margin-top:2px;color:var(--gold)}
.stopw{margin:12px 0 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.stopw .sq{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:15px;font-weight:700;line-height:1.4}
.stopw .sq svg{margin-top:1px;color:var(--gold)}
.stopw .sb{display:flex;gap:8px;margin:12px 0 0}
.stopw .sb button{flex:1 1 0;min-width:0;min-height:44px;border-radius:12px;font-size:15px;font-weight:700;padding:8px 12px}
.stopw .go{border:0;background:var(--fillB);color:var(--fillT)}
.stopw .lt{border:1px solid var(--sl);background:transparent;color:var(--ink)}
.stopw.w{display:none}
.tabs{display:flex;margin:16px 0 0;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--sl)}
.tabs button{flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;margin:0;padding:4px;border:0;border-radius:12px;background:transparent;background-clip:content-box;font-size:14px;color:var(--ink2);transition:background-color .16s}
.tabs button.on{background-color:var(--fillB);color:var(--fillT);font-weight:700}
.tbody{padding:8px 0 0}
.toc{list-style:none;margin:0;padding:0}
.toc button{display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:44px;border:0;border-radius:12px;background:none;padding:10px;text-align:left;color:var(--ink)}
.toc.nodot button{grid-template-columns:minmax(0,1fr) auto}
.toc button.cur{background:var(--cur)}
.toc .tt{min-width:0;font-size:15px;line-height:1.3}
.toc button.cur .tt{font-weight:700}
.toc .now{margin-left:8px;font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}
.toc .tm{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.toc .tag.wb{display:table;margin:2px 0 0;padding:0;border-radius:0;background:none;font-size:12px;font-weight:400;line-height:1.3;color:var(--ink2)}  /* 검수 A L7: 목차 꼬리표는 늘 제목 아래 줄 */
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--track);background:transparent}
.dot.half{border-color:var(--seen);background:linear-gradient(90deg,var(--seen) 50%,transparent 50%)}
.dot.full{border-color:var(--seen);background:var(--seen)}
.toc button.cur .dot{border-color:var(--gold)}
/* 질문 */
.qf{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.kinds{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.kc,.scn{display:inline-flex;align-items:center;gap:6px;min-height:36px;border:1px solid var(--sl);border-radius:999px;background:transparent;padding:0 12px;font-size:13px;color:var(--ink)}
.kc.on{border-color:var(--fillB);background:var(--fillB);color:var(--fillT);font-weight:700}
.scn{font-variant-numeric:tabular-nums}
.scn.off{border-style:dashed;color:var(--ink2)}
.qta{position:relative;margin:10px 0 0}
.qf textarea,.rf textarea{display:block;width:100%;min-height:80px;resize:vertical;border:2px solid var(--gold);border-radius:10px;background:var(--bg);padding:8px 10px 26px;font-size:15px;line-height:1.5;color:var(--ink)}
.rf textarea{padding-bottom:8px}
.qf textarea:focus,.rf textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(217,181,74,.25)}
.cnt{position:absolute;right:10px;bottom:6px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;pointer-events:none}
.qrow{display:flex;align-items:center;gap:8px;margin:10px 0 0}
.chk{position:relative;flex:1 1 auto;display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:13px;color:var(--ink2);cursor:pointer}
.chk input{position:absolute;left:0;top:50%;width:34px;height:20px;margin:-10px 0 0;opacity:0;cursor:pointer}
.chk i{position:relative;flex:0 0 auto;width:34px;height:20px;border-radius:999px;background:var(--track);transition:background-color .16s}
.chk i:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#F4ECD7;transition:transform .16s}
.chk input:checked + i{background:var(--fillB)}
.chk input:checked + i:after{background:#0C4631;transform:translateX(14px)}
.chk input:focus-visible + i{outline:2px solid var(--focus);outline-offset:2px}
.qrow .go{flex:0 0 auto;min-height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--fillB);color:var(--fillT);font-size:15px;font-weight:700}
.qrow .go[disabled]{opacity:.55;cursor:default}
.qf .err{margin:8px 0 0;min-height:0}
.qf .err:empty{display:none}
.qnote{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink2);font-size:13px}
.qnote a{font-weight:700;color:var(--ink)}
.qlist{margin:12px 0 0}
.q{padding:12px;border:1px solid var(--line);border-radius:14px;margin:0 0 12px}
.qh{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;font-size:12px;color:var(--ink2)}
.qh .who{font-size:13px;font-weight:700;color:var(--ink)}
.qh .when{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.qh .st{margin-left:auto}
.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.1;white-space:nowrap;background:var(--nB);color:var(--nT)}
.pill.k-t{background:var(--sB);color:var(--sT)}
.pill.pv{background:var(--cB);color:var(--cT)}
.pill.q-wait{background:var(--aB);color:var(--aT)}
.pill.q-new{background:var(--gB);color:var(--gT)}
.pill.q-read{background:var(--nB);color:var(--nT)}
.q .bd{margin:6px 0 0;white-space:pre-wrap;text-align:justify;font-size:15px;word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
.q .scb{display:inline-flex;align-items:center;min-height:32px;margin:8px 0 0;border:1px solid var(--sl);border-radius:999px;background:transparent;color:var(--ink);padding:0 12px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.rp{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--nB)}
.rp.t{padding:2px 0 2px 12px;border-left:3px solid var(--gT);border-radius:0;background:transparent}
.rp .qh .who{font-size:12px;font-weight:400;color:var(--ink2)}
.rp .bd{margin:4px 0 0;font-size:14px}
.acts{display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px;margin:8px 0 0}
.acts .tbtn{font-size:13px}
.acts .no{font-size:12px;color:var(--ink2)}
.acts .ask{font-size:13px;font-weight:700;color:var(--cT)}
.rf{margin:10px 0 0}
.rf .send{display:flex;align-items:center;gap:12px;margin:8px 0 0}
.rf .send .err{flex:1 1 auto;margin:0;min-height:0}
/* 폰에서 누르는 자리 44px 가까이(보이는 크기는 그대로) */
.kc,.scn,.q .scb,.btn-sm,.dchip{position:relative}
.kc:after,.scn:after,.q .scb:after,.btn-sm:after,.dchip:after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.q .scb:after{top:-6px;bottom:-6px}
.end1{max-width:480px;margin:12vh auto 0;text-align:center}
.end1 .fish{width:56px;height:27.2px;margin:0 auto 16px}
.end1 p{margin:0 0 16px;font-size:20px;font-weight:700;letter-spacing:-.02em}
/* 폰 · 영상 고정(질문 칸을 누르면 풂) */
@media (max-width:1099px){
  .pgrid .pl{display:contents}
  /* 2차(11-18) 옆 여백 20: 퍼센트는 부모 안쪽 폭(W − 40) 기준 → 40 × 9/16 = 22.5 를 더해야 화면 폭 16:9 */
  .vid{position:-webkit-sticky;position:sticky;top:0;z-index:3;width:auto;margin:0 -20px;padding-top:calc(56.25% + 22.5px);border-radius:0}
  .pgrid.nostk .vid{position:relative}
}

@media (min-width:1100px){
  .pch{display:flex;margin:0 0 4px;border-bottom:1px solid var(--line)}
  .ptop{min-height:48px}
  .ptop .pt span{display:block}
  .pgrid{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:24px;align-items:start}
  .pgrid .pr{position:-webkit-sticky;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:1px 4px 1px 1px}
  .pgrid .tabs{margin-top:0}

  .stopw.w{display:block;margin:0 0 14px}
}
/* 2차(11-18) 머리: 목록 = 큰 이름 «HIS CLASS»(세리프 글자 그림 170 · 화면 읽기 «히즈클래스») + 오른쪽 이름 동그라미(누르면 이름 시트)
   내리면 위에 작은 막대(이름 104 · 크림 .92 · 아래 선) · PC 보기 = 왼쪽 위 작은 이름 · 이름 시트 = 아래에서 올라오는 판(크림 바탕 · 안 칸 흰색) */
.lth{min-height:64px;padding:12px 0 0}
.lt.wmt{display:flex;align-items:center;min-height:41px;margin:0;line-height:0;color:var(--acc)}
.lt.wmt .wm{display:block;width:170px;height:auto}
.av{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-right:-4px;padding:0;border:0;border-radius:50%;background:none}
.av span{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--accB);color:var(--acc);font-size:13px;line-height:18px;font-weight:600;white-space:nowrap}
.av.sm span{width:32px;height:32px;font-size:12px}
.cbar{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;align-items:center;justify-content:center;height:52px;background:rgba(250,246,236,.92);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);color:var(--acc);visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s}
.cbar.on{visibility:visible;opacity:1}
.cbar .wm{display:block;width:104px;height:auto}
.cbar .av{position:absolute;right:max(16px,env(safe-area-inset-right));top:4px}
.pch .wmt{display:flex;align-items:center;line-height:0;color:var(--acc)}
.pch .wmt .wm{display:block;width:104px;height:auto}
.pwa.pwme{padding:0}
.pwme .pwc.msh{max-width:560px;padding:8px 16px calc(24px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;background:var(--bg);box-shadow:0 -1px 12px rgba(0,0,0,.08)}

.msh .grab{display:block;width:36px;height:5px;margin:0 auto;border-radius:3px;background:rgba(0,0,0,.18)}
.msh .xbtn{position:absolute;right:8px;top:8px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;background:none;color:var(--ink2)}
.msh .xbtn span{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--fill)}
.msh .me1{display:flex;flex-direction:column;align-items:center;padding:20px 0 4px}
.msh .mav{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:var(--accB);color:var(--acc);font-size:17px;line-height:22px;font-weight:600}
.msh h2{margin:10px 0 0;font-size:20px;line-height:26px;font-weight:700;letter-spacing:-.01em}
.msh .cells{margin-top:20px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--edge);overflow:hidden}
.msh .cells + .cells{margin-top:16px}

.msh .cell.red,.msh .cell.red svg{color:var(--cT)}
/* 2차(11-18) 기록 안내: 한 장(아이콘 칸 64 · 제목 28/700 가운데 · 줄마다 이름 17/600 + 설명 15 양쪽 정렬) · 동의 날짜는 맨 아래 한 줄 · 다시 읽기 = 아래 «닫기» 하나 */
.cons.ob{display:flex;flex-direction:column;align-items:center;padding:40px 8px 0}
.ob-ic{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:18px;background:var(--accB);color:var(--acc)}
.cons.ob h1{margin:18px 0 0;font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.015em;text-align:center}

.cons ol.cis li:before{content:none}
.cis .ci-t{display:block;font-size:17px;line-height:22px;font-weight:600}

  /* 등원 번호 네 칸 그리기: 친 자리 = 점 · 다음 칠 칸 = 금 테두리(칸에 커서가 있을 때) */
  function pinPaint() {
    var p = $('lgPin'), box = $('pin4');
    if (!p || !box) return;
    var n = String(p.value || '').length, f = document.activeElement === p, cs = box.getElementsByTagName('i'), i;
    for (i = 0; i < cs.length; i += 1) {
      cs[i].textContent = i < n ? '•' : '';
      cs[i].className = f && (i === n || (n >= 4 && i === 3)) ? 'cur' : '';
    }
  }

  function doLogin() {
    var nEl = $('lgName'), pEl = $('lgPin'), b = $('lgBtn');
    if (!nEl || !pEl || b.disabled) return;
    var name = L.btrim(String(nEl.value || '').replace(/^\s+|\s+$/g, ''));
    var pin = String(pEl.value || '').replace(/[^0-9]/g, '');
    if (!name || pin.length !== 4) { setHTML('lgErr', esc(M.input)); return; }
    b.disabled = true;
    setHTML('lgErr', '');
    L.login(name, pin, DEV).then(function (r) {
      b.disabled = false;
      if (r && r.ok) {
        S.key = r.key; S.name = r.name || name; S.att = null; S.paper = null; S.pdf = null; S.rng = null; S.set = null;
        spkFresh();
        S.alFresh = pwaStandalone(); /* N1: 홈 화면 앱 첫 로그인 = 목록 앞에 알림 한 단계(조건이 맞을 때만) */
        L.lsSet(LS.key, r.key);
        loadHome();
        return;
      }
      var e = r && r.err, m = M.net;
      if (e === 'input') m = M.input;
      else if (e === 'nomatch') m = M.nomatch;
      else if (e === 'many') m = M.many;
      else if (e === 'locked') m = L.lockMsg(r);
      setHTML('lgErr', esc(m));
    }, function () {
      b.disabled = false;
      setHTML('lgErr', esc(M.net));
    });
  }

  function reLogin() {
    L.lsDel(LS.key); L.lsDel(LS.sess);
    S.key = ''; S.home = null; S.lectures = []; S.consent = null; S.att = null; S.paper = null; S.pdf = null; S.rng = null;
    S.al = null; S.alFresh = false; S.set = null; S.setDirty = false; S.setMore = false;
    spkFresh();
    clearHash();
    showLogin(M.again);
  }

  /* ------------------------------------------------------------ 집 정보 */
  /* quiet = 목록만 조용히 다시 그림 · then(N1 알림으로 엶) = 다시 그리는 대신 부를 일(받기에 실패해도 부름) */
  function loadHome(quiet, then) {
    if (!S.key) { showLogin(''); return; }
    var k = S.key;
    var side = quiet ? null : sideStart(k);
    L.home(k).then(function (r) {
      if (k !== S.key) return; /* 그새 나감(다른 학생) = 버림 */
      if (!r || !r.ok) {
        if (r && r.err === 'gone') { showGone(); return; }
        reLogin();
        return;
      }
      S.home = r;
      S.homeAt = Date.now();
      S.name = (r.me && r.me.name) || S.name;
      S.lectures = r.lectures || [];
      S.consent = r.consent || null;
      if (r.consent_ver) S.cver = r.consent_ver;
      if (quiet) { if (then) then(); else quietList(); return; }
      setLoad(side, k); /* S1 단어 · 구문 · 문법: 집 정보 답 뒤 한 번(같은 0.6초 안에 오면 목록과 함께 그림) */
      sideWait(side, k, route);
    }, function () {
      if (k === S.key && then) { then(); return; }
      if (quiet || k !== S.key) return;
      showNet();
    });
  }
  /* 검수 A M4: 출결(결석한 날 수업 · 교실에서 들음) · 학교 시험 범위(C2) · 지문 줄을 집 정보와 같이 부름 → 맨 위 카드와 목록을 한 번에 그림.

     못 받으면(옛 서버 · 끊김) 카드 없이 예전 화면 그대로 */
  var SIDE_MS = 600;
  function sideStart(k) {
    var sd = { n: 2, cb: null };
    function one() {
      sd.n -= 1;
      if (sd.n <= 0 && sd.cb) { var f = sd.cb; sd.cb = null; f(); }
    }
    sd.one = one; /* S1 setLoad 가 같이 기다림 */
    S.att = null; S.rng = null; S.absAt = 0;
    L.att(k).then(function (a) { if (k === S.key) S.att = a; one(); }, one);
    L.rngMe(k).then(function (r) { if (k === S.key) S.rng = r; one(); }, one);
    loadPaper(k);
    loadPdf(k);
    /* N1 새 영상 알림: 홈 화면 앱 + 알림 되는 폰에서만 부름(사파리 탭 · 카카오톡 · PC 탭은 안 부름 = 예전 그대로) ·
       늦게 오면(목록을 이미 그림) 카드가 생길 때만 목록을 조용히 다시 그림 · 첫 로그인 단계는 늦으면 건너뜀(카드로) */
    S.al = null;
    if (alCan()) {
      sd.n += 1;
      L.pushOn(k).then(function (r) {
        var late = S.view === 'list';
        if (k === S.key) S.al = r;
        one();
        if (k !== S.key) return;
        alQuiet();
        if (late && S.view === 'list' && alState() !== alShown) quietList();
      }, one);
    }
    return sd;
  }
  function sideWait(sd, k, f) {
    if (!sd || sd.n <= 0) { f(); return; }
    var t = setTimeout(function () {
      if (!sd.cb) return;
      sd.cb = null;
      if (k === S.key) f();
    }, SIDE_MS);
    sd.cb = function () { clearTimeout(t); if (k === S.key) f(); };
  }
  /* 지문 줄(C3 종이 자리 · C7 멈추고 풀기) · 집 정보와 같이 한 번 · 못 받으면(옛 서버 · 끊김) 둘 다 조용히 없음 */
  function loadPaper(k) {
    L.paper(k).then(function (r) {
      if (k !== S.key) return;
      S.paper = r ? L.paperMap(r) : null;
      if (S.view === 'player' && T) paperPaint();

  function lecPaper(id) { return (S.paper && S.paper[String(id)]) || null; }
  /* P1 필기 PDF 목록 · 집 정보와 같이 한 번 · 못 받으면(옛 서버 · 끊김 · 막힘) 단추 없음 */
  function loadPdf(k) {
    L.pdf(k).then(function (r) {

  function lecPdf(id) { var a = S.pdf && S.pdf[String(id)]; return a && a.length ? a[0] : null; }
  /* 단추 HTML(PDF 가 없는 강의 = '') · 카카오톡 안 · 안드로이드 = 같은 창에서 받기 / 아이폰 · 홈 화면 앱 · PC = 새 창에서 열기 */
  function pdfBtnHTML(l) {
    var f = l ? lecPdf(l.id) : null, way, url;
    if (!f) return '';
    way = L.pdfWay(navigator.userAgent);
    url = L.pdfUrl(f.p, L.pdfName(l, lessonDay(l, attMap()['i' + l.id])), way);
    if (!url) return '';
    return '<a class="btn-sm pdfb" id="pdfB" data-act="pdf" href="' + esc(url) + '"' + (way === 'open' ? ' target="_blank" rel="noopener"' : '') +
      ' aria-label="필기 PDF 받기">' + icon('pdf', 16) + '<span>필기 PDF</span></a>';
  }
  /* 목록이 영상을 연 뒤에 오면 그 자리에 단추를 넣고 · 없어졌으면 뺌 */
  function pdfPaint() {
    if (!T || !T.lec) return;
    var top = app.querySelector('.ptop'), b = $('pdfB'), m = $('pdfM'), h = pdfBtnHTML(T.lec);
    if (!top) return;
    if (!h) {
      if (b && b.parentNode) b.parentNode.removeChild(b);
      if (m && m.parentNode) m.parentNode.removeChild(m);
      return;
    }
    if (!b) top.insertAdjacentHTML('beforeend', h);
    if (!m) top.insertAdjacentHTML('afterend', '<p class="pdfm" id="pdfM" role="status"></p>');
  }
  function attMap() {
    var m = {}, a = S.att, i;
    if (!a || !a.items) return m;
    for (i = 0; i < a.items.length; i += 1) { if (a.items[i] && a.items[i].id) m['i' + a.items[i].id] = a.items[i]; }
    return m;
  }
  /* 영상에서 돌아온 뒤 새 진도로 목록을 다시 그림. 누르는 중이거나 막 뗐으면 조금 미룸:
     누른 단추를 다시 그리면 그 누름이 사라짐(아이폰 사파리·마우스) → «나가기»를 눌러도 안 나가던 것 */
  function quietList() {
    if (S.view !== 'list' && S.view !== 'rng') return;
    var ago = Date.now() - press.at;
    if (press.on ? ago < 3000 : ago < 400) { setTimeout(quietList, 100); return; }
    if (S.view === 'rng') showRange(); else showList();
  }

  /* ------------------------------------------------------------ 길 찾기 */
  function route() {
    var hs = String(location.hash || '').replace(/^#/, '');
    if (!S.key) { showLogin(S.loginErr); return; }
    if (!S.home) { loadHome(); return; }
    if (recMode() === 'pending') { teardown(); showConsent(false); return; }
    if (S.alFresh) { /* N1: 홈 화면 앱 첫 로그인 · 옛 «기록 없이» 학생의 다시 동의(둘 다 동의 바로 뒤) · 알림을 띄울 수 있고 아직 안 물었을 때만 · 기기당 한 번 */
      S.alFresh = false;
      if (alOk() && alPerm() === 'default' && !L.lsGet(LS.alstep, 0)) { L.lsSet(LS.alstep, 1); teardown(); showAlStep(); return; }
    }
    if (hs === 'rec') { teardown(); showConsent(true); return; }
    var m = hs.match(/^v=([^&]+)/);
    if (m) {
      var id = '', l;
      try { id = decodeURIComponent(m[1]); } catch (e) { id = ''; } /* 깨진 주소 = 목록으로 */
      l = findLec(id);
      if (!l) { clearHash(); teardown(); showList(); return; }
      if (l.ended) { teardown(); showEnded(); return; }
      if (T && T.lec.id === id && S.view === 'player') return;
      teardown();
      showPlayer(l);
      return;
    }
    var wasPlayer = S.view === 'player';
    teardown();
    if (hs === 'rng') showRange(); else showList();   /* C2 학교 시험 범위 영상 */
    if (wasPlayer) loadHome(true);
  }
  function goList() {
    if (S.nav && !PV) { history.back(); return; }   /* 미리 보기 = 바깥 탭 기록을 건드리지 않음 */
    clearHash();
    route();
  }

  /* ------------------------------------------------------------ 동의 */
  /* again = 맨 아래 «기록 안내»로 다시 읽기만(단추 없음 · 기록 끄기 길 없음 · 원장님 11-17) · 처음 = «동의하고 들어가기» 하나 */
  function showConsent(again) {
    S.view = again ? 'rec' : 'consent';
    var m = recMode(), cur = '';
    if (again && m === 'agree') cur = '지금: 기록함 · ' + esc(L.fmtMD(S.consent.at)) + ' 동의';
    /* 2차(11-18): 한 장 꼴 · 줄 글은 그대로(이름 뒤 «: »는 화면 읽기 몫으로 남김) · 날짜 줄은 맨 아래 · 다시 읽기 = 아래 «닫기» 하나 */
    var ci = function (t, d) { return '<li><span class="ci-t">' + t + '<span class="sr">: </span></span><span class="ci-d">' + d + '</span></li>'; };
    var h = '<div class="wrap"><div class="cons ob"><span class="ob-ic" aria-hidden="true">' + icon('doc', 30) + '</span>' +
      '<h1>히즈클래스 기록 안내</h1><ol class="cis">' +
      ci('기록하는 것', '영상을 어디까지 봤는지(재생 위치·본 칸), 남긴 질문과 받은 답') +
      ci('보는 사람', '원장 선생님과 담당 선생님') +
      ci('보관', '강의가 내려가면 그 강의 기록도 함께 지우고, 학원을 그만두면 30일 안에 지웁니다') +
      ci('지우기', '지워 달라고 하면 30일 안에 지웁니다') +
      '</ol>' + (cur ? '<p class="cur">' + cur + '</p>' : '') +
      (again ? '' : '<div class="btns"><button class="btn-fill" type="button" data-act="agree">동의하고 들어가기</button></div>' +
      '<p id="cErr" class="err" role="alert"></p>') +
      '</div>' + (again ? '<div class="obf"><button class="btn-gray" type="button" data-act="recback">닫기</button></div>' : '') + '</div>';
    app.innerHTML = h;
    pwaAuto();
  }

  function choose(choice, btn) {
    /* #rec 주소로 와서 동의했으면 같은 안내를 또 띄우지 않고 목록으로(영상 주소 #v= 는 그대로 그 영상으로) */
    var again = S.view === 'rec' || String(location.hash || '') === '#rec';
    var bs = app.querySelectorAll('.cons button');
    var i;
    for (i = 0; i < bs.length; i += 1) bs[i].disabled = true;
    var k = S.key;
    L.consent(k, choice, S.cver).then(function (r) {
      if (k !== S.key) return;
      if (r && r.ok) {
        S.consent = { choice: r.choice, ver: r.ver, at: r.at };
        if (again) clearHash();
        else if (pwaStandalone()) S.alFresh = true; /* N1: 동의 판에서 동의한 바로 뒤 = 알림 단계 자리(옛 «기록 없이» 학생 포함 · 기기당 한 번은 route 가 셈) */
        if (!again) setLoad(null, k); /* S1: 동의 전에는 안 불렀음 → 동의 바로 뒤 한 번(늦으면 묶음이 생길 때만 다시 그림) */
        route();
        return;
      }
      if (r && r.err === 'key') { reLogin(); return; }
      if (r && r.err === 'ver') { S.home = null; loadHome(); return; }
      for (i = 0; i < bs.length; i += 1) bs[i].disabled = false;
      setHTML('cErr', esc(M.net));
    }, function () {
      if (k !== S.key) return;
      for (i = 0; i < bs.length; i += 1) bs[i].disabled = false;
      setHTML('cErr', esc(M.net));
    });
  }

  /* ------------------------------------------------------------ 목록 */
  function statusOf(l) {
    var pct = +l.pct || 0;
    if (l.confirmed) return { cls: 'ok', txt: '학습완료 · 선생님 확인' };
    if (pct >= L.DONE) return { cls: 'ok', txt: '학습완료' + (l.done_at || l.last_at ? ' ' + L.fmtDay(l.done_at || l.last_at) : '') };
    if (pct > 0 || l.first_at) return { cls: 'ing', txt: '학습중 ' + pct + '%' };
    return { cls: 'pre', txt: '학습 전' };
  }
  function isArr(x) { return Object.prototype.toString.call(x) === '[object Array]'; }
  /* 수업일 · C1 고침(11-16): 수업일마다 반이 정해진 강의면 내 반의 수업일(출결 days)로 · 첫 수업일이 그 안에 있으면 지금처럼 */
  function lessonDay(l, at) {
    var ld = l.lesson_on ? L.isoDay(l.lesson_on) : '';
    if (at && isArr(at.days) && at.days.length && at.days.indexOf(ld) < 0 && typeof at.days[0] === 'string' && L.isoDay(at.days[0])) ld = L.isoDay(at.days[0]);
    return ld;
  }
  /* 단원 타일(11-17 · 결론안 K 의 수업일 타일을 갈음 · 모든 학생 · 모든 강의 · 날짜 없음): 강의 제목 맨 앞의 번호와 단위
     ① 단원 «4과 01~06번» → 4 / 과 · «15·16강» → 15·16 / 강 · «Unit 15» → 15 / 강 · «Lesson 4» → 4 / 과(실행기 auto_pages.UNIT_PATTERNS 와 같은 낱말)
        숫자가 셋 이상(«12·13·14강»)이거나 둘이라도 다섯 글자를 넘으면 범위처럼 첫 숫자만 «12 / 강» · 화면 읽기 «12강부터»(가장 작은 글자 14)
     ② 아니면 맨 앞 문항 번호(모의고사 «18~32번») → 18 / 번
     ③ 아니면(맨 앞 번호 없음) 같은 교재 안 그런 강의끼리 수업일 → 공개일 → 올린 차례로 «N / 편»(pyeonMap) · 숫자 앞 0 은 뗌 */
  var UNIT_RE = /^(\d{1,3}(?:\s*·\s*\d{1,3})*)\s*(회|강|과|단원|차시)/,
    UNIT_EN = /^(unit|lesson)\s*(\d{1,3}(?:\s*·\s*\d{1,3})*)/i,
    UNIT_NO = /^(\d{1,3})((?:\s*[~∼\-–]\s*\d{1,3})?(?:\s*·\s*\d{1,3}(?:\s*[~∼\-–]\s*\d{1,3})?)*)\s*번/;
  function unitNum(s) {
    var p = String(s).split('·'), i;
    for (i = 0; i < p.length; i += 1) p[i] = String(parseInt(p[i], 10));
    return p.join('·');
  }
  /* 단원 숫자(들) + 단위 → 타일 · 셋 이상 · 다섯 글자 넘음 = 첫 숫자 «…부터» */
  function unitPart(raw, u) {
    var n = unitNum(raw), p = n.split('·');
    if (p.length >= 3 || n.length > 5) return { n: p[0], u: u, sr: p[0] + u + '부터' };
    return { n: n, u: u, sr: n + u };
  }
  /* → {n: 위 숫자, u: 아래 단위, sr: 화면 읽기} · 맨 앞 번호가 없으면 null */
  function unitOf(title) {
    var t = String(title || '').replace(/^\s+/, ''), m = t.match(UNIT_RE), n;
    if (m) return unitPart(m[1], m[2]);
    m = t.match(UNIT_EN);
    if (m) return unitPart(m[2], m[1].toLowerCase() === 'unit' ? '강' : '과');
    m = t.match(UNIT_NO);
    if (m) { n = unitNum(m[1]); return { n: n, u: '번', sr: n + (/\d/.test(m[2]) ? '번부터' : '번') }; }
    return null;
  }
  /* ③ «N / 편»: list = 서버 차례(오래된 것부터 · 같은 날은 올린 차례) · 교재마다 맨 앞 번호 없는 강의끼리 1부터 → {'i'+id: N} */
  var PYN = {};
  function pyeonMap(list) {
    var g = {}, out = {}, i, k, a, l;
    function ky(x) { var p = x.posted_on ? L.isoDay(x.posted_on) : ''; return (x.lesson_on ? L.isoDay(x.lesson_on) : p) + '|' + p; }
    for (i = 0; i < list.length; i += 1) {
      l = list[i];
      if (unitOf(l.title)) continue;
      k = 'b' + (l.book || '');
      if (!g.hasOwnProperty(k)) g[k] = [];
      g[k].push({ k: ky(l), i: i, id: l.id });
    }
    for (k in g) {
      if (!g.hasOwnProperty(k)) continue;
      a = g[k];
      a.sort(function (x, y) { return x.k < y.k ? -1 : (x.k > y.k ? 1 : x.i - y.i); });
      for (i = 0; i < a.length; i += 1) out['i' + a[i].id] = i + 1;
    }
    return out;
  }
  function tileHTML(l) {
    var u = unitOf(l.title), no;
    if (!u) { no = PYN['i' + l.id] ? String(PYN['i' + l.id]) : ''; u = { n: no, u: '편', sr: no + '편' }; }
    /* 위 숫자: 두 글자까지 18 · 그보다 길면(«15·16» · «100» · 다섯 글자까지) 14 */
    return '<span class="tile" role="img" aria-label="' + esc(u.sr) + '"><b' + (u.n.length > 2 ? ' class="l"' : '') + '>' +
      esc(u.n) + '</b><small>' + esc(u.u) + '</small></span>';
  }
  /* 둘째 줄(이스케이프한 HTML) «52:11 · 목차 5» · 날짜 없음(타일 = 단원) · 조각마다 한 덩어리로 묶어 줄바꿈으로 갈리지 않게
     검수 A L2: 내 반 수업일이 둘 이상이면 앞에 «수업일 외 1일» */
  function metaOf(l, at) {
    var a = [], h = [], i;
    var more = at && isArr(at.days) && at.days.length >= 2 ? at.days.length - 1 : 0;
    if (more) a.push('수업일 외 ' + more + '일');
    if (+l.dur > 0) a.push(L.fmtDur(l.dur));
    var n = (l.chapters && l.chapters.length) || 0;
    if (n) a.push('목차 ' + n);
    for (i = 0; i < a.length; i += 1) h.push('<span class="mi">' + esc(a[i]) + (i < a.length - 1 ? ' ·' : '') + '</span>');
    return h.join(' ');
  }
  /* 지문 칸(보기 화면 띠 · 맨 위 카드 막대가 같이 씀): 목차 시각 차례 · 길이가 2% 안 되는 칸(«오늘 볼 지문» 같은 머리)은 다음 칸에 붙임
     → [{t: 누르면 갈 시각(그 지문 처음), from, to, w, no: '04'|'', title, parts: [{i: 목차 차례, n: 길이}]}] */
  function segsOf(ch, D) {
    var r = L.chapterRanges(ch, D), out = [], carry = null, i, x, s;
    for (i = 0; i < r.length; i += 1) {
      x = r[i];
      if (!(x.to > x.from)) continue;
      if (x.to - x.from < D * 0.02 && i < r.length - 1) {
        if (!carry) carry = { from: x.from, parts: [] };
        carry.parts.push({ i: x.i, n: x.to - x.from });
        continue;
      }
      s = { t: x.from, from: carry ? carry.from : x.from, to: x.to, no: L.chapterNo(x.title), title: x.title,
        parts: (carry ? carry.parts : []).concat([{ i: x.i, n: x.to - x.from }]) };
      s.w = s.to - s.from;
      out.push(s);
      carry = null;
    }
    if (carry && out.length) { s = out[out.length - 1]; s.parts = s.parts.concat(carry.parts); }
    return out;
  }
  /* 칸의 본 비율(0~1) · seen = chapterSeen 답 */
  function segSeen(s, seen) {
    var a = 0, b = 0, i;
    for (i = 0; i < s.parts.length; i += 1) { a += (seen[s.parts[i].i] || 0) * s.parts[i].n; b += s.parts[i].n; }
    return b > 0 ? a / b : 0;
  }
  /* 2차(11-18) 남은 시간 «39분 남음» · «1시간 5분»(분 단위 · 1분 아래는 1분) · 안 본 강의 = 길이 */
  function durKo(sec) {
    var s = Math.max(60, Math.round(+sec || 0)), h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
    if (m === 60) { h += 1; m = 0; }
    return h ? h + '시간' + (m ? ' ' + m + '분' : '') : m + '분';
  }
  function leftOf(l, rec) {

  /* 학생에게 보이는 강의(서버 차례 그대로 · 새 배열) · 미리 보기: 아직 안 보이는 강의(__pv) 빼고 */

  /* 교재 묶음(목록 · 시험 범위 화면 같음): 받은 차례에서 교재가 처음 나온 차례로 묶고 묶음 안은 받은 차례 그대로 */

    PYN = pyeonMap(listBase()); /* 단원 타일 «N / 편» 차례(서버 차례 = 오래된 것부터) */

  /* 2차(11-18) 머리: 목록 = 큰 이름 «HIS CLASS»(글자 그림 · 화면 읽기 «히즈클래스») + 이름 동그라미(누르면 이름 시트 · «나가기» · «기록 안내»는 시트 안)

  /* ------------------------------------------------------------ 학교 시험 범위(C2) */
  /* 범위 한 줄의 강의 중 이 목록에서 열 수 있는 것(공개 끝 뺌 · 서버 차례 = 수업일 이른 차례) */

    for (i = 0; i < ids.length; i += 1) {

  /* 카드에 띄울 시험 → {it, c:{title, sub, n, during, total, done}, ls} · 없으면 null

  function examTop(rec) {

  /* 결론안 K 시험 카드: «D-9»(28) · «2학기 기말 · 11.25(수)» · «범위 4편 중 2편 학습완료» · 칸 막대(다 본 칸 = 끝남 색)

  function examLine(ex) {

  }
  function examSub(c, rec) { return rec ? '범위 ' + c.total + '편 중 ' + c.done + '편 학습완료' : '범위 ' + c.total + '편'; }
  /* 2차(11-18) 시험 카드 링 56: 범위 편 가운데 다 본 만큼 딥그린(기록 동의일 때만) · 가운데 «D-9» / «시험 중» */
  function examRing(c, rec) {

      if (v.length === 4 && was === 3) doLogin(); /* 결론안 K: 넷째 자리를 치면 바로 들어감(한 번에 붙여 넣은 번호는 «들어가기»로) */
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.id === 'qPriv' && S.q) S.q.priv = !!t.checked;
  });
  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t && t.id === 'lgPin') pinPaint();
    if (t && (t.id === 'qBody' || t.id === 'rBody')) stick(false);
    if (t && (t.id === 'qBody' || t.id === 'rBody') && T && T.P) {
      if (t.id === 'qBody' && S.q && S.q.useAt && !S.q.frozen) { S.q.at = Math.floor(lecTime()); S.q.frozen = true; paintScene(); }
      if (T.P.state() === 1) T.P.pause();
    }
  });
  /* 결론안 K 7절: 질문 칸을 누르면 영상 고정을 풀어 글 칸이 자판 위에 남게 · 다 쓰고 나가면 다시 고정 */
  function stick(on) {
    var g = $('pgrid');
    if (g) g.className = on ? 'pgrid' : 'pgrid nostk';
  }
  document.addEventListener('focusout', function (e) {
    var t = e.target;
    if (t && t.id === 'lgPin') setTimeout(pinPaint, 0);
    if (t && (t.id === 'qBody' || t.id === 'rBody')) {
      setTimeout(function () {
        var a = document.activeElement;
        if (!a || (a.id !== 'qBody' && a.id !== 'rBody')) stick(true);
      }, 300);
    }
  });
  /* 결론안 K 8절: 전체 화면 · 화면 돌림 · 창 크기 */
  function onView() { if (T) { fsCheck(); bandPaint(); } }
  document.addEventListener('fullscreenchange', onView);
  document.addEventListener('webkitfullscreenchange', onView);
  window.addEventListener('resize', onView);
  window.addEventListener('orientationchange', function () { setTimeout(onView, 250); });
  window.addEventListener('hashchange', function () { pwaClose(false); S.nav = true; route(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && T) { sample(); sendBeat(true); }
    if (document.visibilityState === 'hidden' && W) setHide(); /* S1: 다른 앱으로 가면 말소리 · 녹음을 멈춤(녹음한 것은 남음) */
    if (document.visibilityState === 'visible') alBack(); /* N1: 홈 화면 앱으로 돌아옴 */
  });
  /* N1: 앱이 열려 있을 때 알림을 누름 → 일꾼이 {type: 'lec-open', ids} 를 보냄 */
  try {
    if (!window.__lecPvIn && navigator.serviceWorker && typeof navigator.serviceWorker.addEventListener === 'function') {
      navigator.serviceWorker.addEventListener('message', function (e) {
        var d = e && e.data;
        if (d && d.type === 'lec-open') alOpen(alIds(d.ids));
      });
    }
  } catch (eSw) { /* 없음 */ }
  window.addEventListener('pagehide', function () { if (T) { sample(); sendBeat(true); } });

  if (L.TEST) {
    window.__lecDbg = function () {
      return {
        view: S.view, rec: recMode(), tab: S.tab,
        T: T ? { id: T.lec.id, S: T.S, durL: T.durL, ready: T.ready, real: T.real, local: T.local, server: T.server, sess: T.sess, err: T.err, stopped: T.stopped,
          stopOn: T.stopOn, stopDone: Object.keys(T.stopDone), to: T.to, skipTo: T.skipTo, stopEnd: T.stopEnd } : null,
        paper: S.paper, rng: S.rng, absAt: S.absAt, sq: SQ ? Object.keys(SQ.s).length : 0, sqBusy: SQBUSY, spkOff: SPKOFF, spkSoft: SPKSOFT, spkGo: SPKGO, rate: sayRate(), spkOk: spkOk(),
        set: S.set, setDirty: S.setDirty, W: W ? { mode: W.mode, kind: W.kind, id: W.id, ph: W.t ? W.t.ph : '', rec: !!(W.g && W.g.R && W.g.R.on),
          tid: W.t ? W.t.id : '', ti: W.t ? tIdx(W.t) : -1, step: W.t ? W.t.step : 0, fb: !!(W.t && W.t.fb), busy: !!(W.t && W.t.busy), fr: tFresh(W.t),
          pos: W.t ? W.t.pos : -1, ord: W.t ? W.t.ord : null, kb: !!(W.t && W.t.kb), gate: !!(W.t && W.t.gate), rt0: !!(W.g && W.g.R && W.g.R.on && W.g.R.on.t0),
          g: W.g ? { i: W.g.i, ph: W.g.ph, busy: W.g.busy, wait: !!W.g.wait, done: W.g.done, man: !!W.g.man, j: W.g.j || 0, nov: !!W.g.nov, hl: W.g.hl,
            marks: W.g.marks, sp: W.g.sp ? { k: W.g.sp.k, st: W.g.sp.st, tries: W.g.sp.tries, fails: W.g.sp.fails, self: !!W.g.sp.self,
              pass: !!(W.g.sp.res && W.g.sp.res.pass), miss: W.g.sp.res ? W.g.sp.res.miss : -1 } : null } : null,
          q: W.q ? W.q.length : 0, tot: W.tot || 0 } : null
      };
    };
  }

  /* ------------------------------------------------------------ 시작 */
  (function boot() {
    var m = String(location.hash || '').match(/^#k=([^&]+)/), hk = '';
    if (m) {
      try { hk = decodeURIComponent(m[1]); } catch (e) { hk = ''; } /* 깨진 개인 링크 = 없는 것으로 */
      clearHash();
    }
    /* N1: 강의 여럿을 알린 알림을 눌러 앱이 새로 열림 = #n=id,id → 목록에서 그 줄을 잠깐 칠함 */
    var nm = String(location.hash || '').match(/^#n=([0-9a-f,-]+)$/);
    if (nm) {
      if (!window.__lecPvIn) S.nIds = alIds(nm[1].split(','));
      clearHash();
    }
    if (hk) {
      S.key = hk;
      L.lsSet(LS.key, S.key);
      L.lsDel(LS.sess);
    } else {
      var k = L.lsGet(LS.key, '');
      S.key = typeof k === 'string' ? k : '';
    }
    pendFlush();
    if (!S.key) { showLogin(''); return; }
    app.innerHTML = '<div class="wrap">' + wmTopHTML() + '</div>';
    loadHome();
  })();
