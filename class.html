<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0A1F17" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4ECD7">
<meta name="format-detection" content="telephone=no">
<title>히즈 온라인</title>
<link rel="icon" type="image/png" sizes="32x32" href="his-icon-32.png?v=4">
<link rel="icon" href="favicon.ico?v=4">
<link rel="apple-touch-icon" href="his-icon-180.png?v=4">
<style>
/* 결론안 K(11-16) · 밝은 토큰 = 목록·들어오기 · 무대 토큰 = 보기 화면(html.stg) · 다크 모드 폰은 모든 학생 화면 */
:root{color-scheme:light;--bg:#F4ECD7;--card:#FFFDF7;--line:#E6DCBF;--dash:#CBBF9A;--ink:#0C4631;--ink2:#5F6256;--track:#E8DFC4;--tile:#EDF3EF;--tileT:#0C4631;--done:#2F7A55;--focus:#9E7C14;--rv:#8A8D80;--fillB:#0C4631;--fillT:#F4ECD7;--press:#F4EEDB;--inL:#E6DCBF;--sl:#CBBF9A;--gold:#7A5410;--cur:#F4EEDB;--seen:#0C4631;--gB:#DDF0E5;--gT:#1E5A3E;--aB:#FBF0C9;--aT:#7A5410;--sB:#DFEAF8;--sT:#1F4C7E;--nB:#EFEDE5;--nT:#5F6256;--cB:#FBE9E3;--cT:#9A3F33}
html.stg{color-scheme:dark;--bg:#0A1F17;--card:#12301F;--line:#21402F;--dash:#5A7A6A;--ink:#F4ECD7;--ink2:#A7B5AA;--track:#5A7A6A;--tile:#1A3B2C;--tileT:#F4ECD7;--done:#8CC4A6;--focus:#D9B54A;--rv:#A7B5AA;--fillB:#F4ECD7;--fillT:#0C4631;--press:#1A3B2C;--inL:#5A7A6A;--sl:#5A7A6A;--gold:#D9B54A;--cur:#1A3B2C;--seen:#F4ECD7;--gB:#264835;--gT:#8CC4A6;--aB:#324526;--aT:#E8C66A;--sB:#28473F;--sT:#A9CDE8;--nB:#1A3B2C;--nT:#A7B5AA;--cB:#3E2A24;--cT:#F2B8AC}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--bg:#0A1F17;--card:#12301F;--line:#21402F;--dash:#5A7A6A;--ink:#F4ECD7;--ink2:#A7B5AA;--track:#5A7A6A;--tile:#1A3B2C;--tileT:#F4ECD7;--done:#8CC4A6;--focus:#D9B54A;--rv:#A7B5AA;--fillB:#F4ECD7;--fillT:#0C4631;--press:#1A3B2C;--inL:#5A7A6A;--sl:#5A7A6A;--gold:#D9B54A;--cur:#1A3B2C;--seen:#F4ECD7;--gB:#264835;--gT:#8CC4A6;--aB:#324526;--aT:#E8C66A;--sB:#28473F;--sT:#A9CDE8;--nB:#1A3B2C;--nT:#A7B5AA;--cB:#3E2A24;--cT:#F2B8AC}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none !important}
svg{flex:0 0 auto}
h1,h2,.tt{text-wrap:balance}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(36px + env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.wrap.wide{max-width:1280px}
.top{display:flex;align-items:center;gap:8px;min-height:48px;padding:2px 0}
.fish{display:block;width:24px;height:11.65px;color:var(--ink)}
.brand{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.sp{flex:1 1 auto;min-width:0}
.me{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.lo{flex:0 0 auto;min-width:44px;height:44px;margin-right:-4px;border:0;background:none;padding:0 4px;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.hit{position:relative}
.hit:after{content:"";position:absolute;left:-8px;right:-8px;top:-8px;bottom:-8px}
.tbtn{background:none;border:0;padding:6px 2px;font-size:13px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn-fill{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--fillB);color:var(--fillT);font-size:16px;font-weight:700;padding:12px 16px;text-decoration:none;transition:opacity .16s}
.btn-line{display:block;width:100%;min-height:48px;border:1px solid var(--sl);border-radius:12px;background:transparent;color:var(--ink);font-size:16px;font-weight:700;padding:12px 16px}
.btn-fill[disabled],.btn-line[disabled]{opacity:.55;cursor:default}
.btn-sm{display:inline-flex;align-items:center;min-height:36px;border:1px solid var(--sl);border-radius:12px;background:transparent;color:var(--ink);font-size:15px;font-weight:700;padding:0 16px}
.sub{font-size:13px;color:var(--ink2)}
.err{font-size:13px;font-weight:700;color:var(--cT);min-height:20px;margin:8px 0 0}
.norec{margin:0 0 12px;padding:8px 12px;border-radius:8px;background:var(--nB);color:var(--nT);font-size:13px}
.foot{margin:28px 0 0;text-align:center;font-size:13px;color:var(--ink2)}
.foot a{font-weight:700;color:var(--ink)}
.foot a.hit:after{top:-14px;bottom:-14px}
.foot .now{display:block;margin-top:2px}
/* 들어오기 */
.login{max-width:400px;margin:0 auto;padding:64px 12px 0}
.login .head{display:flex;flex-direction:column;align-items:center;text-align:center}
.login .head .fish{width:56px;height:27.2px}
.login h1{margin:14px 0 0;font-size:28px;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.login .lgs{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.fld{display:block;margin:20px 0 0}
.fld>span,.fld>label{display:block;font-size:13px;color:var(--ink2);margin:0 0 6px}
.fld input{display:block;width:100%;height:50px;border:1px solid var(--inL);border-radius:12px;background:var(--card);padding:0 14px;font-size:17px}
.fld input:focus{border-color:var(--focus);outline:none}
.pin4{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pin4 i{display:flex;align-items:center;justify-content:center;height:56px;border:1px solid var(--inL);border-radius:12px;background:var(--card);font-style:normal;font-size:24px;font-weight:700;line-height:1}
.pin4 i.cur{border:2px solid var(--focus)}
.pin4 input#lgPin{position:absolute;left:0;top:0;z-index:1;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:12px;background:transparent;color:transparent;caret-color:transparent;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.pin4 input#lgPin::selection{background:transparent}
.login .btn-fill{margin-top:24px}
.demo{margin-top:24px;padding:12px;border:1px dashed var(--dash);border-radius:12px}
.demo p{margin:0 0 8px;font-size:13px;color:var(--ink2)}
.demo .chips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink)}
.dchip small{font-size:12px;font-weight:400;color:var(--ink2)}
/* 동의 */
.cons{max-width:560px;margin:0 auto}
.cons h1{margin:4px 0 12px;font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
.cons ol{margin:0;padding:0;list-style:none;counter-reset:c}
.cons li{position:relative;padding:12px 0 12px 32px;border-top:1px solid var(--line);text-align:justify;font-size:15px;word-break:normal;line-break:strict}
.cons li:first-child{border-top:0;padding-top:4px}
.cons li:before{counter-increment:c;content:counter(c);position:absolute;left:0;top:12px;width:22px;height:22px;border-radius:50%;border:1px solid var(--dash);font-size:12px;font-weight:700;line-height:20px;text-align:center}
.cons li:first-child:before{top:4px}
.cons .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.cons .cur{margin:12px 0 0;font-size:13px;font-weight:700;color:var(--gT)}
/* 꼬리표 · 맨 위 카드 */
.tag{display:inline-flex;align-items:center;vertical-align:1px;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700;line-height:1;white-space:nowrap;background:var(--nB);color:var(--nT)}
.tag.amb{background:var(--aB);color:var(--aT)}
.tag.sky,.tag.new,.tag.ans{background:var(--sB);color:var(--sT)}
.tag.grn{background:var(--gB);color:var(--gT)}
.tc{display:block;margin:0 0 12px;color:inherit;text-decoration:none}
.tc .absgo{display:block;color:inherit;text-decoration:none}
.tc .tt{margin:10px 0 0;font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
.tc .bk{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.bars{display:flex;gap:3px;margin:14px 0 0}
.bars i{display:block;min-width:3px;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bars b{display:block;height:100%;background:var(--ink)}
.tc .cr{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;margin:8px 0 0;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tc .cr strong{font-weight:700;color:var(--ink)}
.tc .btn-fill{margin-top:14px}
.tc .tip{margin:8px 0 0;font-size:12px;color:var(--ink2);text-align:center}
/* 결석 카드 안의 줄(이어서 보기 · «N편 더») = 카드 장수에 안 셈(검수 A M6) */
.absln{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin:12px 0 0;padding:8px 0 0;border:0;border-top:1px solid var(--line);background:none;border-radius:0;font-size:13px;font-weight:700;color:var(--ink);text-align:left;text-decoration:none}
.absln + .absln{margin-top:0}
.abscont{gap:4px}
.absln .k{flex:0 0 auto;white-space:nowrap}
.absln .v{flex:1 1 auto;min-width:0;font-weight:400;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 누를 수 있는 줄 표시 «›»(C2 검수 L3 · 글자가 아니라 꾸밈이라 읽어 주지 않음) */
.absln::after{content:'\203A';flex:0 0 auto;margin-left:auto;padding-left:4px;font-size:20px;line-height:1;font-weight:700;color:var(--ink2)}
/* 학교 시험 카드(C2) · 범위 영상 */
.exam1{display:flex;align-items:center;gap:14px;margin:0 0 12px;color:inherit;text-decoration:none}
.exam1 .d{flex:0 0 auto;min-width:58px;font-size:28px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.exam1 .mn{flex:1 1 auto;min-width:0}
.exam1 .l1{display:block;font-size:13px;color:var(--ink2)}
.exam1 .l2{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.pills{display:flex;gap:4px;margin:8px 0 0}
.pills i{flex:1 1 0;height:6px;border-radius:3px;background:var(--track)}
.pills i.on{background:var(--done)}
.rhead{margin:4px 0 12px}
.rhead h1{margin:0;font-size:20px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
.rhead p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
/* 목록 줄 */
.grp{margin:0 0 16px}
.grp h2{margin:0 4px 8px;font-size:13px;font-weight:700;color:var(--ink2)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 36px;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:inherit;transition:background-color .24s}
.row + .row:before{content:"";position:absolute;left:70px;right:0;top:0;border-top:1px solid var(--line)}
a.row:active{background:var(--press)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:11px;background:var(--tile);color:var(--tileT);line-height:1.1;text-align:center}
.tile b{font-size:14px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile small{margin-top:2px;font-size:12px}
.row .mn{min-width:0}
.row .tt{font-size:15px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.row .tt .tag{margin-left:6px}
.row .mt{margin-top:2px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.row .mt .mi{white-space:nowrap}
.row .rs{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin-top:6px;font-size:12px;color:var(--ink2)}
.row .st{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.row .un{margin-top:4px;font-size:12px;font-weight:700;color:var(--aT)}
.row.flash{background:var(--aB)}
.row.off{opacity:.55;cursor:default}
.row .tag.end{margin-top:6px}
.ring{display:block;width:36px;height:36px}
.ring .rgT{stroke:var(--track)}
.ring .rgP{stroke:var(--ink)}
.ring.rv .rgP{stroke:var(--rv)}
.ring.ok .rgT{stroke:var(--done)}
.ring .rgC{stroke:var(--gT)}
.empty{padding:28px 16px;text-align:center;color:var(--ink2);font-size:13px}
/* 보기 화면(무대) */
.pch{display:none}
.ptop{display:flex;align-items:center;gap:6px;min-height:44px}
.ptop .pt{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:8px}
.ptop .pt b{display:block;min-width:0;font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .pt span{display:none;flex:0 1 auto;min-width:0;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backb{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;min-width:44px;height:44px;margin-left:-4px;padding:0 4px;background:none;border:0;font-size:15px;color:var(--ink);white-space:nowrap}
.backb .ar{font-size:20px;line-height:1;margin-top:-2px}
.vid{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden}
.vid iframe,.vid .yt,.vid .fake{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.fake{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#F4ECD7;background:#000}
.fake .fl{font-size:12px;opacity:.75}
.fake .ft{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.fake button{min-width:96px;min-height:44px;border:1px solid #5A7A6A;border-radius:999px;background:transparent;color:#F4ECD7;font-weight:700;padding:6px 18px}
.verr{padding:20px 16px;text-align:center}
.verr p{margin:0 0 14px;font-size:16px;font-weight:700}
.endc{margin:12px 0 0;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.endc .eh{display:flex;align-items:flex-start;gap:10px}
.endc .eh svg{margin-top:1px}
.endc .et{font-size:15px;font-weight:700;line-height:1.4}
.endc .es{margin-top:2px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.endc .btn-fill{margin-top:14px}
.band{display:flex;gap:3px;margin:8px 0 0;-webkit-user-select:none;user-select:none}
.band button{position:relative;flex:1 1 0;min-width:0;height:44px;margin:0;padding:0;border:0;background:none;color:var(--ink2);font-size:12px;line-height:1;font-variant-numeric:tabular-nums}
.band .bt{position:absolute;left:0;right:0;top:8px;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.band .bt b{display:block;height:100%;background:var(--seen)}
.band em{position:absolute;top:2px;width:2px;height:4px;margin-left:-1px;background:var(--ink2)}
.band .bl{position:absolute;left:50%;top:22px;transform:translateX(-50%);white-space:nowrap}
.band button.on .bl{color:var(--ink);font-weight:700}
.nowl{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;margin:4px 0 0}
.nowl .ch{font-size:15px;font-weight:700;letter-spacing:-.01em}
.nowl .tm{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.nowl .ms{margin-left:auto;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.resume{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:8px 0 0;font-size:13px;color:var(--ink2)}
.resume button{background:none;border:0;padding:4px 2px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.ctl{display:flex;align-items:center;gap:8px;margin:10px 0 0}
.b10{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:2px;width:56px;height:44px;padding:0;border:1px solid var(--sl);border-radius:12px;background:transparent;font-size:13px;color:var(--ink)}
.spd{flex:1 1 auto;display:flex;min-width:0;height:44px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--sl)}
.spd button{flex:1 1 0;min-width:0;height:44px;margin:0;padding:4px 2px;border:0;border-radius:12px;background:transparent;background-clip:content-box;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;transition:background-color .16s}
.spd button.on{background-color:var(--fillB);color:var(--fillT);font-weight:700}
/* C3 종이 줄 · C7 멈추고 풀기(영상 밖 · 폰 = 단추 아래 · PC = 오른쪽 칸 맨 위) */
.paper{display:flex;align-items:flex-start;gap:6px;margin:0;padding:8px 10px 4px;font-size:13px;line-height:1.45;color:var(--ink2)}
.paper svg{margin-top:2px;color:var(--gold)}
.stopw{margin:12px 0 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.stopw .sq{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:15px;font-weight:700;line-height:1.4}
.stopw .sq svg{margin-top:1px;color:var(--gold)}
.stopw .sb{display:flex;gap:8px;margin:12px 0 0}
.stopw .sb button{flex:1 1 0;min-width:0;min-height:44px;border-radius:12px;font-size:15px;font-weight:700;padding:8px 12px}
.stopw .go{border:0;background:var(--fillB);color:var(--fillT)}
.stopw .lt{border:1px solid var(--sl);background:transparent;color:var(--ink)}
.stopw.w{display:none}
.tabs{display:flex;margin:16px 0 0;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--sl)}
.tabs button{flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;margin:0;padding:4px;border:0;border-radius:12px;background:transparent;background-clip:content-box;font-size:14px;color:var(--ink2);transition:background-color .16s}
.tabs button.on{background-color:var(--fillB);color:var(--fillT);font-weight:700}
.tbody{padding:8px 0 0}
.toc{list-style:none;margin:0;padding:0}
.toc button{display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:44px;border:0;border-radius:12px;background:none;padding:10px;text-align:left;color:var(--ink)}
.toc.nodot button{grid-template-columns:minmax(0,1fr) auto}
.toc button.cur{background:var(--cur)}
.toc .tt{min-width:0;font-size:15px;line-height:1.3}
.toc button.cur .tt{font-weight:700}
.toc .now{margin-left:8px;font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}
.toc .tm{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.toc .tag.wb{display:table;margin:2px 0 0;padding:0;border-radius:0;background:none;font-size:12px;font-weight:400;line-height:1.3;color:var(--ink2)}  /* 검수 A L7: 목차 꼬리표는 늘 제목 아래 줄 */
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--track);background:transparent}

.chk input:checked + i:after{background:#0C4631;transform:translateX(14px)}

.q{padding:12px;border:1px solid var(--line);border-radius:14px;margin:0 0 12px}

  /* 지문 칸(보기 화면 띠 · 맨 위 카드 막대가 같이 씀): 목차 시각 차례 · 길이가 2% 안 되는 칸(«오늘 볼 지문» 같은 머리)은 다음 칸에 붙임

  function segsOf(ch, D) {
    var r = L.chapterRanges(ch, D), out = [], carry = null, i, x, s;
    for (i = 0; i < r.length; i += 1) {
      x = r[i];
      if (!(x.to > x.from)) continue;
      if (x.to - x.from < D * 0.02 && i < r.length - 1) {
        if (!carry) carry = { from: x.from, parts: [] };

        parts: (carry ? carry.parts : []).concat([{ i: x.i, n: x.to - x.from }]) };
      s.w = s.to - s.from;
      out.push(s);

  /* 결석한 날 수업 카드에 올릴 강의: 결석 · 아직 열림 · 다 보지 않음(선생님 확인 = 끝남) · 결석한 날이 오늘~13일 전 ·
     최근 결석한 날 → 많이 본 것 → id 차례 */
  function absList(arr, am, today) {
    var out = [], i, l, a, dd;
    for (i = 0; i < arr.length; i += 1) {
      l = arr[i]; a = am['i' + l.id];
      if (!a || a.att !== 'abs' || !a.day || l.ended || l.confirmed || (+l.pct || 0) >= L.DONE) continue;
      dd = dayDiff(today, a.day);
      if (dd < 0 || dd > 13) continue;
      out.push(l);
    }
    out.sort(function (x, y) {
      var dx = am['i' + x.id].day, dy = am['i' + y.id].day;
      if (dx !== dy) return dx < dy ? 1 : -1;
      var px = +x.pct || 0, py = +y.pct || 0;
      if (px !== py) return py - px;
      return x.id < y.id ? -1 : (x.id > y.id ? 1 : 0);

  /* 결석 카드 = 카드 하나(div) 안에 링크: 위 = 그 강의 · 아래 줄 = 다른 강의 «이어서 보기»(cont) · «결석한 날 수업 N편 더»(more) */

    if (cont) {
      /* «이어서 보기 · 18~32번 · 12:40부터»(C2 검수 L3 · 어디부터인지는 본 자리가 있을 때만) */
      var cpos = +cont.pos || 0;

  /* 이어서 보기: 다 보지 않은 강의 중 마지막으로 본 것(기록 동의일 때만) · skip = 뺄 강의({'i'+id: 1} · 결석한 날 수업) */
  function contBest(arr, skip) {
    var best = null, bt = -Infinity, i, l, t;
    skip = skip || {};
    for (i = 0; i < arr.length; i += 1) {
      l = arr[i];
      if (l.ended || l.confirmed || (+l.pct || 0) >= L.DONE || !l.last_at || skip['i' + l.id]) continue;

  /* ------------------------------------------------------------ 학교 시험 범위(C2) */
  /* 범위 한 줄의 강의 중 이 목록에서 열 수 있는 것(공개 끝 뺌 · 서버 차례 = 수업일 이른 차례) */
  function rngLecs(it) {
    var out = [], ids = it && Object.prototype.toString.call(it.lectures) === '[object Array]' ? it.lectures : [], i, l;
    for (i = 0; i < ids.length; i += 1) {
      l = findLec(ids[i]);
      if (l && !l.ended && out.indexOf(l) < 0) out.push(l);
    }
    return out;
  }
  /* 카드에 띄울 시험 → {it, c:{title, sub, n, during, total, done}, ls} · 없으면 null
     범위가 저장된 시험만(서버가 D-20부터 시험 끝날까지만 줌 · 여기서도 D-20 넘으면 안 띄움) · 일정 없는 학교 = 빈 카드도 없음 */
  function examTop(rec) {
    var r = S.rng, today = L.isoDay(), items = [], i, it, ls, n, j, best, c;
    if (!r || Object.prototype.toString.call(r.items) !== '[object Array]') return null;
    for (i = 0; i < r.items.length; i += 1) {
      it = r.items[i];
      if (!it || typeof it !== 'object') continue;
      ls = rngLecs(it);
      if (!ls.length) continue;
      for (n = 0, j = 0; j < ls.length; j += 1) { if (isDone(ls[j], +ls[j].pct || 0)) n += 1; }
      items.push({ id: it.id, name: it.name, exam_on: it.exam_on, end_on: it.end_on, lectures: ls, done: n, src: it });
    }
    best = L.rngPickItem(items, today);
    if (!best) return null;
    c = L.rngCard(best, today, rec);

    return { it: best.src, c: c, ls: best.lectures };

  /* 결론안 K 시험 카드: «D-9»(28) · «2학기 기말 · 11.25(수)» · «범위 4편 중 2편 학습완료» · 칸 막대(다 본 칸 = 끝남 색)

  function examLine(ex) {

  function examSub(c, rec) { return rec ? '범위 ' + c.total + '편 중 ' + c.done + '편 학습완료' : '범위 ' + c.total + '편'; }
  function examCardHTML(ex, rec) {

  /* 범위 영상 목록(#rng): 덜 본 것 먼저(다 본 것은 아래 · 같으면 수업일 이른 차례) */
  function showRange() {

  /* 강의 줄의 셋째 줄(결론안 K) · 색 꼬리표는 챙길 것(결석한 날) 하나만 · 나머지는 회색 글자

  function attLine(l, a, rec, st) {

  function rowHTML(l, rec, today, a) {

    if (rec && !l.ended && !(a && a.att === 'in' && !(pct > 0) && !done)) inner += ring(pct, done, !!(a && a.att === 'in'));

  /* «결석한 날 수업 N편 더» = 다음 결석한 날 수업 줄로 내려가 잠깐 칠함 · 누를 때마다 그다음 강의로(끝나면 둘째부터 다시 · 검수 A L19) */
  function jumpAbs() {

    for (i = 0; i < rs.length; i += 1) { if (rs[i].getAttribute('data-id') === id) { r = rs[i]; break; } }
    if (!r) return;
    try { r.scrollIntoView({ block: 'center' }); } catch (e) { r.scrollIntoView(); }

  /* ------------------------------------------------------------ 재생기 */
  /* 유튜브: {time(), dur(), state(), seek(t), play(), pause(), rate(r)} */
  function YTP(box, vid, start, cb) {
    var s = this;
    s.p = null; s.ok = false; s.dead = false;
    L.loadYT().then(function (YT) {
      if (s.dead) return;
      var pv = { playsinline: 1, rel: 0, modestbranding: 1 };
      if (start > 0) pv.start = Math.floor(start);
      if (/^https?:$/.test(location.protocol)) pv.origin = location.protocol + '//' + location.host;
      /* 원장님 11-16: 학생 화면에 그 서비스 이름이 읽히지 않게 재생기 틀의 이름(title)을 «강의 영상»으로(만든 뒤 · 준비 · 오류 때) */
      function nm() { try { var f = s.p && s.p.getIframe && s.p.getIframe(); if (f && f.setAttribute) f.setAttribute('title', '강의 영상'); } catch (e0) { /* 없음 */ } }
      try {
        s.p = new YT.Player(box, {
          host: 'https://www.youtube-nocookie.com',
          videoId: vid, width: '100%', height: '100%', playerVars: pv,
          events: {
            onReady: function () { if (s.dead) return; s.ok = true; nm(); cb.ready(); },
            onStateChange: function (e) { if (!s.dead) cb.state(e.data); },
            onPlaybackRateChange: function (e) { if (!s.dead) cb.rate(e.data); },
            onError: function (e) { if (!s.dead) { nm(); cb.error(e.data); } }
          }
        });
        nm();
      } catch (e1) { cb.error(5); }
    }, function () { if (!s.dead) cb.error(-1); });
  }
  YTP.prototype.call = function (fn, a, b) {
    if (!this.ok || !this.p || typeof this.p[fn] !== 'function') return undefined;
    try { return this.p[fn](a, b); } catch (e) { return undefined; }
  };
  YTP.prototype.time = function () { return +this.call('getCurrentTime') || 0; };
  YTP.prototype.dur = function () { return +this.call('getDuration') || 0; };
  YTP.prototype.state = function () { var v = this.call('getPlayerState'); return v == null ? -1 : +v; };
  YTP.prototype.seek = function (t) { this.call('seekTo', Math.max(0, t), true); };
  YTP.prototype.play = function () { this.call('playVideo'); };
  YTP.prototype.pause = function () { this.call('pauseVideo'); };
  YTP.prototype.rate = function (r) {
    if (arguments.length) { this.call('setPlaybackRate', r); return r; }
    var v = +this.call('getPlaybackRate');
    return v > 0 ? v : 1;
  };
  YTP.prototype.destroy = function () {
    this.dead = true;
    try { if (this.p && this.p.destroy) this.p.destroy(); } catch (e) { /* 없음 */ }
  };

  /* 가짜 재생기(&fake=1): 시계는 Lec.now() · 아이폰처럼 처음 틀기 전 길이 0 */
  function Fake(box, D, cb) {
    var s = this;
    s.D = D; s.t = 0; s.on = false; s.r = 1; s.w = 0; s.st = -1; s.started = false; s.cb = cb; s.dead = false;
    box.className = 'fake';

      '<button type="button" data-act="fake" id="fkB">재생</button>';

    s.iv = setInterval(function () { s.adv(); s.draw(); }, 250);
    setTimeout(function () { if (!s.dead) cb.ready(); }, 0);
  }
  Fake.prototype.fire = function (k, v) {
    var cb = this.cb, s = this;

  };
  Fake.prototype.adv = function () {
    if (!this.on) return;
    var w = L.now();
    this.t += Math.max(0, w - this.w) / 1000 * this.r;
    this.w = w;
    if (this.t >= this.D) { this.t = this.D; this.on = false; this.st = 0; this.fire('state', 0); }
  };
  Fake.prototype.draw = function () {
    var a = $('fkT'), b = $('fkB');
    if (a) a.innerHTML = L.fmtDur(this.t) + ' / ' + L.fmtDur(this.D);
    if (b) b.innerHTML = this.on ? '멈춤' : '재생';
  };
  Fake.prototype.time = function () { this.adv(); return this.t; };
  Fake.prototype.dur = function () { return this.started ? this.D : 0; };
  Fake.prototype.state = function () { this.adv(); return this.st; };
  Fake.prototype.play = function () {
    this.adv();

    if (tr === T && T) {

  function pendAdd(o) {

     다른 보기의 대기 기록은 나중에 보내도 이어 볼 위치가 뒤로 가지 않게 방금 닿은 위치로 맞춤 */

    var a = L.lsGet(LS.pend, []), out = [], i, x, ch = false;

        if (x.pos !== o.pos) { x.pos = o.pos; ch = true; }

      });
    });
    return p.then(function () {

    if (e === 'ended') return M.ended;
    if (e === 'no_consent') return M.qnorec;
    if (e === 'answered') return M.qanswered;
    return M.net;
  }

  function postQ() {
    if (!T || !S.q || S.q.busy) return;
    var ta = $('qBody'), btn = $('qPost');
    if (!ta) return;
    var body = L.btrim(String(ta.value || ''));
    var n = L.clen(body);
    if (n < 1 || n > 1000) { setHTML('qErr', esc(M.qinput)); return; }
    var at = S.q.useAt ? (S.q.at == null ? Math.floor(lecTime()) : S.q.at) : null;
    var pv = $('qPriv');
    S.q.busy = true; btn.disabled = true; setHTML('qErr', '');
    var lid = T.lec.id, k = S.key;
    L.ask(k, lid, body, at, pv ? pv.checked : false, null, S.q.kind).then(function (r) {
      if (k !== S.key || !S.q) return;
      S.q.busy = false; btn.disabled = false;
      if (r && r.ok) {
        ta.value = '';
        S.q.frozen = false;
        setHTML('qCnt', '0/1000');
        paintScene();
        S.q.items = null;
        loadQna();
        return;
      }
      if (r && r.err === 'key') { reLogin(); return; }
      setHTML('qErr', esc(qErr(r && r.err)));
    }, function () {
      if (k !== S.key || !S.q) return;
      S.q.busy = false; btn.disabled = false;
      setHTML('qErr', esc(M.net));
    });
  }

  function postReply(pid) {
    if (!T || !S.q || S.q.busy) return;
    var ta = $('rBody');
    if (!ta) return;
    var body = L.btrim(String(ta.value || '')), n = L.clen(body);
    if (n < 1 || n > 1000) { setHTML('rErr', esc(M.qinput)); return; }
    S.q.busy = true;
    var k = S.key;
    L.ask(k, T.lec.id, body, null, false, pid, null).then(function (r) {
      if (k !== S.key || !S.q) return;
      S.q.busy = false;
      if (r && r.ok) { S.q.reply = null; S.q.replyText = ''; S.q.items = null; loadQna(); return; }
      if (r && r.err === 'key') { reLogin(); return; }
      setHTML('rErr', esc(qErr(r && r.err)));
    }, function () {
      if (k !== S.key || !S.q) return;
      S.q.busy = false;
      setHTML('rErr', esc(M.net));
    });
  }

  function delQ(id) {
    if (!S.q || S.q.busy) return;
    S.q.busy = true;
    var k = S.key;
    L.qdel(k, id).then(function (r) {
      if (k !== S.key || !S.q) return;
      S.q.busy = false; S.q.del = null;
      if (r && r.ok) { S.q.items = null; loadQna(); return; }
      if (r && r.err === 'key') { reLogin(); return; }
      if (r && r.err === 'answered') {
        drawQList();
        var el = app.querySelector('[data-qid="' + id + '"] .acts');
        if (el) el.insertAdjacentHTML('beforeend', '<span class="no">' + M.qanswered + '</span>');
        return;
      }
      S.q.items = null; loadQna();
    }, function () {
      if (k !== S.key || !S.q) return;
      S.q.busy = false; S.q.del = null;
      drawQList();
    });
  }

  /* ------------------------------------------------------------ 나가기 */
  /* 누르면 바로 로그인 화면(서버 답을 기다리지 않음). 앞 학생 열쇠와 기록(보내는 중 · 못 보낸 것)을
     잡아 두고 뒤에서 보낸 뒤 나가기를 알림 · 기록 답이 다 오거나 4초가 지나면 · 실패해도 화면은 그대로 */
  function logout() {
    var k = S.key, a = L.lsGet(LS.pend, []), i, n, sent = false;
    teardown();
    var w = fly.slice();
    L.lsDel(LS.key); L.lsDel(LS.sess); L.lsDel(LS.pend); L.lsDel(LS.rate);
    S.key = ''; S.name = ''; S.home = null; S.lectures = []; S.consent = null; S.att = null; S.paper = null; S.rng = null;
    clearHash();
    showLogin('');
    if (Object.prototype.toString.call(a) === '[object Array]') {
      for (i = 0; i < a.length; i += 1) { if (a[i]) w.push(L.beat(a[i])); }
    }
    function bye() {
      if (sent) return;
      sent = true;
      L.logout(k).then(null, function () { /* 없음 */ });
    }
    function one() { n -= 1; if (n <= 0) bye(); }
    n = w.length;
    for (i = 0; i < w.length; i += 1) w[i].then(one, one);
    if (!n) bye();
    setTimeout(bye, 4000);
  }

  /* ------------------------------------------------------------ 연습용 */
  function demoGone() {
    var M2 = window.LecMock;
    if (!M2) return;
    var d = M2.db(), key = L.hex64(), at = nowIso();
    d.key.push({ key: key, sid: 's0901|오가을', rid: 's0901', pin: '', sname: '오가을', cls: ['c-g1a'], dev: '개인 링크', made_by: 'Benjamin', created_at: at, last_at: at });
    M2.save(d);
    S.key = key; S.att = null; S.paper = null; S.rng = null;
    L.lsSet(LS.key, key);
    loadHome();
  }

  /* ------------------------------------------------------------ 누르기 */
  document.addEventListener('click', function (e) {
    var el = findAct(e.target);
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'go') { S.nav = true; S.autoplay = attr(el, 'data-play') ? Date.now() : 0; return; } /* 주소(#v=) 그대로 따라감 · 맨 위 카드 = 열리면 바로 재생(결론안 K 3절) */
    if (el.tagName === 'A' && act !== 'go') e.preventDefault();
    if (act === 'dfill') {
      var n = $('lgName'), p = $('lgPin');
      if (n) n.value = attr(el, 'data-n');
      if (p) { p.value = attr(el, 'data-p'); p.setAttribute('data-n', String(p.value.length)); }
      setHTML('lgErr', '');
      pinPaint();
    } else if (act === 'dgone') { demoGone(); }
    else if (act === 'dreset') {
      if (window.LecMock) window.LecMock.reset();
      L.lsDel(LS.key); L.lsDel(LS.sess); L.lsDel(LS.pend);
      showLogin('');
    } else if (act === 'agree') { choose('agree', el); }
    else if (act === 'none') { choose('none', el); }
    else if (act === 'recback') { goList(); }
    else if (act === 'logout') { logout(); }
    else if (act === 'out') { L.lsDel(LS.key); S.key = ''; S.home = null; S.att = null; S.paper = null; S.rng = null; clearHash(); showLogin(''); }
    else if (act === 'retry') { loadHome(); }
    else if (act === 'list') { goList(); }
    else if (act === 'absmore') { jumpAbs(); }
    else if (act === 'restart') {
      if (T && T.P) { T.pendSeekL = null; T.skipTo = 0; seekL(0); }   /* 처음부터 = 모든 멈춤을 다시 봄(검수 B2 M-1) */
      var rs = $('resume'); if (rs) rs.hidden = true;
    } else if (act === 'rate') {
      var r = +attr(el, 'data-r');
      if (T && T.P && RATES.indexOf(r) >= 0) {
        T.P.rate(r); T.rateSet = true;
        L.lsSet(LS.rate, r);
        setTimeout(paintRate, 60);
        paintRate();
      }
    } else if (act === 'back10') {
      if (T && T.P) seekL(Math.max(0, lecTime() - 10));
    } else if (act === 'fake') {
      if (T && T.P) { if (T.P.state() === 1) T.P.pause(); else T.P.play(); }
    } else if (act === 'stopGo' || act === 'stopLater') {
      /* C7 · 계속 보기 = 바로 재생 · 나중에 = 판을 닫고 바로 이어 재생(그 지문은 이 화면에서 다시 안 멈춤 · 검수 A)
         영상 끝에서 선 판(검수 B2 L-2)은 닫기만(다시 틀지 않음) */
      var endOn = !!(T && T.stopEnd);
      stopHide();
      if (T && T.P && !T.err && !endOn) T.P.play();
    } else if (act === 'tab') {
      var tb = attr(el, 'data-tab');
      if (tb === S.tab) return;
      S.tab = tb;
      drawTabs();
      if (tb === 'toc') drawToc(true); else openQna();
    } else if (act === 'seek') {
      seekL(+attr(el, 'data-t'));
    } else if (act === 'kind') {
      if (!S.q) return;
      S.q.kind = attr(el, 'data-k') === 'tech' ? 'tech' : 'content';
      var ks = app.querySelectorAll('.kc'), i;
      for (i = 0; i < ks.length; i += 1) ks[i].className = 'kc' + (ks[i].getAttribute('data-k') === S.q.kind ? ' on' : '');
    } else if (act === 'scene') {
      if (!S.q) return;
      if (S.q.useAt) { S.q.useAt = false; }
      else { S.q.useAt = true; S.q.at = Math.floor(lecTime()); S.q.frozen = true; }
      paintScene();
    } else if (act === 'post') { postQ(); }
    else if (act === 'reply') {
      var cur = $('rBody');
      S.q.replyText = cur && S.q.reply ? cur.value : '';
      S.q.reply = S.q.reply === attr(el, 'data-id') ? null : attr(el, 'data-id');
      if (S.q.reply !== attr(el, 'data-id')) S.q.replyText = '';
      S.q.del = null;
      drawQList();
      var rb = $('rBody'); if (rb) { try { rb.focus(); } catch (e3) { /* 없음 */ } }
    } else if (act === 'rcancel') { S.q.reply = null; S.q.replyText = ''; drawQList(); }
    else if (act === 'rpost') { postReply(attr(el, 'data-id')); }
    else if (act === 'del') { S.q.del = attr(el, 'data-id'); keepReply(); drawQList(); }
    else if (act === 'delno') { S.q.del = null; keepReply(); drawQList(); }
    else if (act === 'delyes') { keepReply(); delQ(attr(el, 'data-id')); }
  });
  function keepReply() { var rb = $('rBody'); if (rb && S.q) S.q.replyText = rb.value; }

  /* 누르는 중인지(quietList 가 봄) */
  var press = { on: false, at: 0 };
  function pressOn() { press.on = true; press.at = Date.now(); }
  function pressOff() { press.on = false; press.at = Date.now(); }
  document.addEventListener('touchstart', pressOn, true);
  document.addEventListener('mousedown', pressOn, true);
  document.addEventListener('touchend', pressOff, true);
  document.addEventListener('touchcancel', pressOff, true);
  document.addEventListener('mouseup', pressOff, true);

  document.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'loginForm') { e.preventDefault(); doLogin(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t && t.id === 'qBody') setHTML('qCnt', L.clen(t.value) + '/1000');
    if (t && t.id === 'lgPin') {
      var v = t.value.replace(/[^0-9]/g, '').slice(0, 4), was = +(t.getAttribute('data-n') || 0);
      if (v !== t.value) t.value = v;
      t.setAttribute('data-n', String(v.length));
      pinPaint();
      if (v.length === 4 && was === 3) doLogin(); /* 결론안 K: 넷째 자리를 치면 바로 들어감(한 번에 붙여 넣은 번호는 «들어가기»로) */
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.id === 'qPriv' && S.q) S.q.priv = !!t.checked;
  });
  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t && t.id === 'lgPin') pinPaint();
    if (t && (t.id === 'qBody' || t.id === 'rBody')) stick(false);
    if (t && (t.id === 'qBody' || t.id === 'rBody') && T && T.P) {
      if (t.id === 'qBody' && S.q && S.q.useAt && !S.q.frozen) { S.q.at = Math.floor(lecTime()); S.q.frozen = true; paintScene(); }
      if (T.P.state() === 1) T.P.pause();
    }
  });
  /* 결론안 K 7절: 질문 칸을 누르면 영상 고정을 풀어 글 칸이 자판 위에 남게 · 다 쓰고 나가면 다시 고정 */
  function stick(on) {
    var g = $('pgrid');
    if (g) g.className = on ? 'pgrid' : 'pgrid nostk';
  }
  document.addEventListener('focusout', function (e) {
    var t = e.target;
    if (t && t.id === 'lgPin') setTimeout(pinPaint, 0);
    if (t && (t.id === 'qBody' || t.id === 'rBody')) {
      setTimeout(function () {
        var a = document.activeElement;
        if (!a || (a.id !== 'qBody' && a.id !== 'rBody')) stick(true);
      }, 300);
    }
  });
  /* 결론안 K 8절: 전체 화면 · 화면 돌림 · 창 크기 */
  function onView() { if (T) { fsCheck(); bandPaint(); } }
  document.addEventListener('fullscreenchange', onView);
  document.addEventListener('webkitfullscreenchange', onView);
  window.addEventListener('resize', onView);
  window.addEventListener('orientationchange', function () { setTimeout(onView, 250); });
  window.addEventListener('hashchange', function () { S.nav = true; route(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && T) { sample(); sendBeat(true); }
  });
  window.addEventListener('pagehide', function () { if (T) { sample(); sendBeat(true); } });

  if (L.TEST) {
    window.__lecDbg = function () {
      return {
        view: S.view, rec: recMode(), tab: S.tab,
        T: T ? { id: T.lec.id, S: T.S, durL: T.durL, ready: T.ready, real: T.real, local: T.local, server: T.server, sess: T.sess, err: T.err, stopped: T.stopped,
          stopOn: T.stopOn, stopDone: Object.keys(T.stopDone), to: T.to, skipTo: T.skipTo, stopEnd: T.stopEnd } : null,
        paper: S.paper, rng: S.rng, absAt: S.absAt
      };
    };
  }

  /* ------------------------------------------------------------ 시작 */
  (function boot() {
    var m = String(location.hash || '').match(/^#k=([^&]+)/), hk = '';
    if (m) {
      try { hk = decodeURIComponent(m[1]); } catch (e) { hk = ''; } /* 깨진 개인 링크 = 없는 것으로 */
      clearHash();
    }
    if (hk) {
      S.key = hk;
      L.lsSet(LS.key, S.key);
      L.lsDel(LS.sess);
    } else {
      var k = L.lsGet(LS.key, '');
      S.key = typeof k === 'string' ? k : '';
    }
    pendFlush();
    if (!S.key) { showLogin(''); return; }
    app.innerHTML = '<div class="wrap"><div class="top">' + fishSVG() + '<span class="brand">히즈 온라인</span></div></div>';
    loadHome();
  })();
};
</script>
</body>
</html>
