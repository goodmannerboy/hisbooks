9.0, 201.27559055118115], [445.5, 201.27559055118115], [462.0, 201.27559055118115]], "15": [[396.0, 178.27559055118115], [412.5, 178.27559055118115], [429.0, 178.27559055118115], [445.5, 178.27559055118115], [462.0, 178.27559055118115]], "16": [[396.0, 155.27559055118115], [412.5, 155.27559055118115], [429.0, 155.27559055118115], [445.5, 155.27559055118115], [462.0, 155.27559055118115]], "17": [[396.0, 132.27559055118115], [412.5, 132.27559055118115], [429.0, 132.27559055118115], [445.5, 132.27559055118115], [462.0, 132.27559055118115]], "18": [[396.0, 109.27559055118115], [412.5, 109.27559055118115], [429.0, 109.27559055118115], [445.5, 109.27559055118115], [462.0, 109.27559055118115]], "19": [[396.0, 86.27559055118115], [412.5, 86.27559055118115], [429.0, 86.27559055118115], [445.5, 86.27559055118115], [462.0, 86.27559055118115]], "20": [[396.0, 63.27559055118115], [412.5, 63.27559055118115], [429.0, 63.27559055118115], [445.5, 63.27559055118115], [462.0, 63.27559055118115]], "21": [[548.0, 500.27559055118115], [564.5, 500.27559055118115], [581.0, 500.27559055118115], [597.5, 500.27559055118115], [614.0, 500.27559055118115]], "22": [[548.0, 477.27559055118115], [564.5, 477.27559055118115], [581.0, 477.27559055118115], [597.5, 477.27559055118115], [614.0, 477.27559055118115]], "23": [[548.0, 454.27559055118115], [564.5, 454.27559055118115], [581.0, 454.27559055118115], [597.5, 454.27559055118115], [614.0, 454.27559055118115]], "24": [[548.0, 431.27559055118115], [564.5, 431.27559055118115], [581.0, 431.27559055118115], [597.5, 431.27559055118115], [614.0, 431.27559055118115]], "25": [[548.0, 408.27559055118115], [564.5, 408.27559055118115], [581.0, 408.27559055118115], [597.5, 408.27559055118115], [614.0, 408.27559055118115]], "26": [[548.0, 385.27559055118115], [564.5, 385.27559055118115], [581.0, 385.27559055118115], [597.5, 385.27559055118115], [614.0, 385.27559055118115]], "27": [[548.0, 362.27559055118115], [564.5, 362.27559055118115], [581.0, 362.27559055118115], [597.5, 362.27559055118115], [614.0, 362.27559055118115]], "28": [[548.0, 339.27559055118115], [564.5, 339.27559055118115], [581.0, 339.27559055118115], [597.5, 339.27559055118115], [614.0, 339.27559055118115]], "29": [[548.0, 316.27559055118115], [564.5, 316.27559055118115], [581.0, 316.27559055118115], [597.5, 316.27559055118115], [614.0, 316.27559055118115]], "30": [[548.0, 293.27559055118115], [564.5, 293.27559055118115], [581.0, 293.27559055118115], [597.5, 293.27559055118115], [614.0, 293.27559055118115]], "31": [[548.0, 270.27559055118115], [564.5, 270.27559055118115], [581.0, 270.27559055118115], [597.5, 270.27559055118115], [614.0, 270.27559055118115]], "32": [[548.0, 247.27559055118115], [564.5, 247.27559055118115], [581.0, 247.27559055118115], [597.5, 247.27559055118115], [614.0, 247.27559055118115]], "33": [[548.0, 224.27559055118115], [564.5, 224.27559055118115], [581.0, 224.27559055118115], [597.5, 224.27559055118115], [614.0, 224.27559055118115]], "34": [[548.0, 201.27559055118115], [564.5, 201.27559055118115], [581.0, 201.27559055118115], [597.5, 201.27559055118115], [614.0, 201.27559055118115]], "35": [[548.0, 178.27559055118115], [564.5, 178.27559055118115], [581.0, 178.27559055118115], [597.5, 178.27559055118115], [614.0, 178.27559055118115]], "36": [[548.0, 155.27559055118115], [564.5, 155.27559055118115], [581.0, 155.27559055118115], [597.5, 155.27559055118115], [614.0, 155.27559055118115]], "37": [[548.0, 132.27559055118115], [564.5, 132.27559055118115], [581.0, 132.27559055118115], [597.5, 132.27559055118115], [614.0, 132.27559055118115]], "38": [[548.0, 109.27559055118115], [564.5, 109.27559055118115], [581.0, 109.27559055118115], [597.5, 109.27559055118115], [614.0, 109.27559055118115]], "39": [[548.0, 86.27559055118115], [564.5, 86.27559055118115], [581.0, 86.27559055118115], [597.5, 86.27559055118115], [614.0, 86.27559055118115]], "40": [[548.0, 63.27559055118115], [564.5, 63.27559055118115], [581.0, 63.27559055118115], [597.5, 63.27559055118115], [614.0, 63.27559055118115]], "41": [[700.0, 500.27559055118115], [716.5, 500.27559055118115], [733.0, 500.27559055118115], [749.5, 500.27559055118115], [766.0, 500.27559055118115]], "42": [[700.0, 477.27559055118115], [716.5, 477.27559055118115], [733.0, 477.27559055118115], [749.5, 477.27559055118115], [766.0, 477.27559055118115]], "43": [[700.0, 454.27559055118115], [716.5, 454.27559055118115], [733.0, 454.27559055118115], [749.5, 454.27559055118115], [766.0, 454.27559055118115]], "44": [[700.0, 431.27559055118115], [716.5, 431.27559055118115], [733.0, 431.27559055118115], [749.5, 431.27559055118115], [766.0, 431.27559055118115]], "45": [[700.0, 408.27559055118115], [716.5, 408.27559055118115], [733.0, 408.27559055118115], [749.5, 408.27559055118115], [766.0, 408.27559055118115]]}};
const F = COORDS.fiducials; // [BL,BR,TL,TR] in PDF pts
const fidL = Math.min(F[0][0],F[2][0]), fidR = Math.max(F[1][0],F[3][0]);
const fidB = Math.min(F[0][1],F[1][1]), fidT = Math.max(F[2][1],F[3][1]);

let curImg=null, rot=0;

function toGray(id){
  const {data,width:w,height:h}=id; const g=new Float32Array(w*h);
  for(let i=0,j=0;i<data.length;i+=4,j++){ g[j]=0.299*data[i]+0.587*data[i+1]+0.114*data[i+2]; }
  return {g,w,h};
}
function winMean(g,w,h,cx,cy,r){
  let s=0,n=0; const x0=Math.max(0,cx-r),x1=Math.min(w-1,cx+r),y0=Math.max(0,cy-r),y1=Math.min(h-1,cy+r);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){s+=g[y*w+x];n++;} return n?s/n:255;
}
function findFiducial(g,w,h, qx, qy){
  // search a corner region (qx,qy in {0,1}); slide window, return darkest-solid center
  const rw=Math.round(w*0.17), rh=Math.round(h*0.19);
  const bx = qx? w-rw : 0, by = qy? h-rh : 0;
  const win=Math.max(6,Math.round(Math.min(w,h)*0.011));
  let best=1e9, bx0=0, by0=0;
  for(let y=by+win;y<by+rh-win;y+=Math.max(2,win>>1)){
    for(let x=bx+win;x<bx+rw-win;x+=Math.max(2,win>>1)){
      const m=winMean(g,w,h,x,y,win);
      if(m<best){best=m;bx0=x;by0=y;}
    }
  }
  return {x:bx0,y:by0,dark:best};
}
function detectFids(g,w,h){
  return {
    TL: findFiducial(g,w,h,0,0), TR: findFiducial(g,w,h,1,0),
    BL: findFiducial(g,w,h,0,1), BR: findFiducial(g,w,h,1,1)
  };
}
function cardToImg(xpt,ypt,fd){
  const u=(xpt-fidL)/(fidR-fidL);
  const v=(fidT-ypt)/(fidT-fidB); // 0 top .. 1 bottom
  const top={x:fd.TL.x*(1-u)+fd.TR.x*u, y:fd.TL.y*(1-u)+fd.TR.y*u};
  const bot={x:fd.BL.x*(1-u)+fd.BR.x*u, y:fd.BL.y*(1-u)+fd.BR.y*u};
  return {x:top.x*(1-v)+bot.x*v, y:top.y*(1-v)+bot.y*v};
}
function readCard(gray){
  const {g,w,h}=gray; const fd=detectFids(g,w,h);
  const rad=Math.max(4,Math.round(Math.min(w,h)*0.009));
  const samp=(pt)=>{const p=cardToImg(pt[0],pt[1],fd);return winMean(g,w,h,Math.round(p.x),Math.round(p.y),rad);};
  // answers
  const ans={}, amb=[];
  for(let q=1;q<=45;q++){
    const cs=COORDS.answers[q]; const vals=cs.map(samp);
    const mn=Math.min(...vals), mo=vals.indexOf(mn), mean=vals.reduce((a,b)=>a+b,0)/5;
    const s=[...vals].sort((a,b)=>a-b);
    if(mean-mn>18 && mn<210){ ans[q]=mo+1; if(s[1]-s[0]<12) amb.push(q); }
  }
  // birthdate
  const birth=[];
  for(let c=0;c<6;c++){
    const vals=COORDS.birth[c].map(samp);
    const mn=Math.min(...vals),md=vals.indexOf(mn),mean=vals.reduce((a,b)=>a+b,0)/10;
    birth.push((mean-mn>18&&mn<210)?md:null);
  }
  return {fd,ans,amb,birth};
}
function rotImage(img,deg){
  const c=document.createElement('canvas'); const ct=c.getContext('2d');
  if(deg%180===0){c.width=img.width;c.height=img.height;} else {c.width=img.height;c.height=img.width;}
  ct.translate(c.width/2,c.height/2); ct.rotate(deg*Math.PI/180); ct.drawImage(img,-img.width/2,-img.height/2);
  return c;
}
function readAt(deg){
  const cv=rotImage(curImg,deg);
  const MAXW=1600; let sc=Math.min(1,MAXW/cv.width);
  const w=Math.round(cv.width*sc), h=Math.round(cv.height*sc);
  const c=document.createElement('canvas'); c.width=w;c.height=h;
  c.getContext('2d').drawImage(cv,0,0,w,h);
  const gray=toGray(c.getContext('2d').getImageData(0,0,w,h));
  return {r:readCard(gray), c:c, deg:deg};
}
function scoreOf(r){
  const n=(r.answers||r.ans||[]).filter(x=>x!=null).length||Object.keys(r.ans||{}).length;
  const b=(r.birth||[]).filter(x=>x!=null).length;
  return n*10+b;
}
function readAuto(){
  let best=readAt(rot);
  if(scoreOf(best.r)<100){
    [90,180,270].map(d=>(rot+d)%360).forEach(d=>{
      const t=readAt(d);
      if(scoreOf(t.r)>scoreOf(best.r)) best=t;
    });
    if(best.deg!==rot){ rot=best.deg; }
  }
  return best;
}
function process(){
  if(!curImg) return;
  const b=readAuto();
  render(b.r,b.c);
}
function render(r,c){
  const bstr=r.birth.map(x=>x==null?'·':x).join('');
  document.getElementById('birth').textContent=bstr;
  const dcv=document.getElementById('view'); dcv.width=c.width;dcv.height=c.height;
  const dt=dcv.getContext('2d'); dt.drawImage(c,0,0);
  // mark fiducials
  dt.strokeStyle='#e24b4a'; dt.lineWidth=3;
  for(const k of ['TL','TR','BL','BR']){const f=r.fd[k];dt.strokeRect(f.x-14,f.y-14,28,28);}
  // answers table
  let html='';
  for(let q=1;q<=45;q++){
    const a=r.ans[q]; const bad=r.amb.includes(q);
    html+=`<span style="display:inline-block;width:56px;margin:2px;padding:3px 4px;border-radius:6px;font-size:12px;`
      +`background:${a?(bad?'#fde9e7':'#eaf3ee'):'#f3f1ea'};color:${a?(bad?'#B0453A':'#1d6b4a'):'#9a9482'};">`
      +`${q}. <b>${a?('①②③④⑤'[a-1]):'–'}</b>${bad?'?':''}</span>`;
  }
  document.getElementById('ans').innerHTML=html;
  document.getElementById('summary').textContent=
    `정답 인식 ${Object.keys(r.ans).length}/45 · 애매 ${r.amb.length} · 생년월일 ${bstr}`;
}
const KEYS={"E":{"key":[4,3,2,1,3,2,3,5,4,2,1,4,1,3,4,2,3,5,2,1,2,3,4,2,3,5,2,5,1,3,4,1,2,3,4,5,2,3,5,1,3,4,2,1,5],"p3":[10,12,20,28,31,35,39,40,43,44],"anchor":[12,20,28,31,35,43],"cuts":[["LD ~ DA",0,34,null,null,null],["JB",35,44,null,null,null],["JI",45,54,10,13,1],["JA",55,64,13,18,3],["GB",65,74,16,23,5],["GI 이상",75,100,18,26,7]]},"M":{"key":[2,5,5,2,4,3,5,1,1,4,2,3,4,5,2,5,4,1,1,2,3,2,3,5,5,1,5,3,4,4,2,3,1,5,4,5,2,3,3,2,2,5,2,1,4],"p3":[11,12,15,26,29,37,41,42,43,44],"anchor":[10,12,15,19,26,27,29,30,35,37,40,41],"cuts":[["HB",0,25,null,null,null],["HI",26,33,null,null,null],["E-A",34,41,8,10,null],["M-L",42,50,11,14,1],["M-M",51,59,14,18,3],["M-H",60,68,16,22,5],["M-AD",69,77,18,25,7],["H-L 이상",78,100,20,28,8]]},"H":{"key":[4,4,3,2,5,2,3,4,5,2,1,5,2,5,1,4,3,1,2,3,2,5,4,5,1,2,3,1,4,3,4,1,2,2,4,4,1,4,3,3,5,5,2,1,3],"p3":[10,12,19,26,31,40,41,42,43,44],"anchor":[7,13,25,29,33,34],"cuts":[["M-M 이하",0,30,null,null,null],["M-H",31,40,null,10,null],["M-AD",41,50,11,14,1],["H-L",51,60,14,19,3],["H-M",61,70,16,23,5],["H-H",71,82,19,27,7],["H-AD",83,100,21,30,9]]}};
// ── 채점 스테이션: 판독 → 채점 → 반 배정 → 통지표 ──
let BATCH=[];
const AREA_OF = n => n<=12 ? '듣기' : n<=20 ? '어휘' : n<=31 ? '문법' : '독해';
const AREA_CNT = {'듣기':12,'어휘':8,'문법':11,'독해':14};
const C5 = ['–','①','②','③','④','⑤'];

function gradeCard(ans, F){
  const K = KEYS[F];
  let total=0, d=0;
  const areas={'듣기':[0,0],'어휘':[0,0],'문법':[0,0],'독해':[0,0]};   // [득점,만점]
  const cnt={'듣기':0,'어휘':0,'문법':0,'독해':0};                     // 정답 문항수
  const marks=[];
  for(let n=1;n<=45;n++){
    const pt = K.p3.includes(n)?3:2, a=AREA_OF(n), ok = ans[n]===K.key[n-1];
    areas[a][1]+=pt;
    if(ok){ total+=pt; areas[a][0]+=pt; cnt[a]++; if(pt===3)d++; }
    marks.push({n, ok, given:ans[n]||0, pt});
  }
  const rows=K.cuts;
  let idx=rows.findIndex(r=> total>=r[1] && total<=r[2]);
  if(idx<0) idx=0;
  const meets=r=> (r[3]==null||areas['문법'][0]>=r[3]) && (r[4]==null||areas['독해'][0]>=r[4]) && (r[5]==null||d>=r[5]);
  let level=rows[idx][0], note='';
  if(!meets(rows[idx])){ level=rows[Math.max(idx-1,0)][0]; note='문법·독해 점수가 이 반 기준에 못 미쳐 한 단계 아래 반으로 정했습니다.'; }
  else if(idx+1<rows.length){ const nx=rows[idx+1];
    if(total>=nx[1]-2 && nx[5]!=null && d>=nx[5]+2 && meets(nx)){ level=nx[0]; note='총점은 경계선이지만 어려운 문항을 잘 풀어서 위 반으로 정했습니다.'; } }
  let retake=null;
  (K.retake||[]).forEach(x=>{ if((x[0]==='hi'&&total>=x[1])||(x[0]==='lo'&&total<=x[1])) retake=x[2]; });
  const LG={'H-AD':1,'H-H':1,'H-M':2,'H-L':3,'M-AD':4,'M-H':5,'M-M':6,'GI':6,'M-L':7,'GB':7,'E-A':8,'JA':8,'HI':9,'JI':9,'HB':9,'JB':9,'LD':9};let g9 = LG[(level||'').replace(' 이상','').replace(' 이하','').split('~')[0].trim()] || 9;if((level||'').indexOf('이하')>=0) g9=Math.min(9,g9+1);
  return {total, d, areas, cnt, marks, level, note, retake, g9};
}

function regrade(){
  const F=document.getElementById('formsel').value;
  BATCH.forEach(r=>{ r.g = gradeCard(r.ans, F); r.form=F; });
}

function ltLine(r){
  return '듣기 '+r.g.cnt['듣기']+'/12 · 어휘 '+r.g.cnt['어휘']+'/8 · 문법 '+r.g.cnt['문법']+'/11 · 독해 '+r.g.cnt['독해']+'/14';
}

  });
  document.getElementById('btab').innerHTML=h;
  document.querySelectorAll('.nm').forEach(el=>el.addEventListener('input',e=>{BATCH[+e.target.dataset.i].name=e.target.value;}));
  document.querySelectorAll('.rpbtn').forEach(el=>el.addEventListener('click',e=>printNotices([BATCH[+e.target.dataset.i]])));
  document.querySelectorAll('.cpbtn').forEach(el=>el.addEventListener('click',async e=>{
    const r=BATCH[+e.target.dataset.i];
    await navigator.clipboard.writeText(ltLine(r)+' · 총점 '+r.g.total+'/100 · 추천 반 '+r.g.level+' · 어려운 문항 '+r.g.d+'/10개');
    document.getElementById('summary').textContent=(r.name||'학생')+' 입력값 복사됨 — 앱 신규진단에 붙여넣으세요.';
  }));
  const n=BATCH.length, amb=BATCH.filter(r=>r.amb.length).length;
  document.getElementById('summary').textContent='판독 '+n+'명 완료 · 검토 필요 '+amb+'명 · 성명 입력 후 [통지표]를 누르세요.';
}

}

function batchCSV(){
  const F=document.getElementById('formsel').value;
  const date=document.getElementById('examdate').value || new Date().toISOString().slice(0,10);
  const NL=String.fromCharCode(10);
  const head=['수험번호','성명','생년월일','성별','출신교','form','응시일']
    .concat(Array.from({length:45},(_,i)=>'답'+(i+1))).concat(['검토']).join(',');
  const rows=BATCH.map(r=>{
    const b=r.birth.every(x=>x!=null)?r.birth.join(''):'';
    return ['',(r.name||''),b,'','',F,date]
      .concat(Array.from({length:45},(_,q)=>r.ans[q+1]||0))
      .concat([r.amb.length?('문항 '+r.amb.join(' ')):'']).join(',');
  });
  return String.fromCharCode(0xFEFF)+head+NL+rows.join(NL);
}

function processToResult(){
  if(!curImg) return null;
  const b=readAuto();
  render(b.r,b.c); return b.r;
}
function loadImage(f){return new Promise(res=>{const img=new Image();
  img.onload=()=>res(img); img.src=URL.createObjectURL(f);});}

async function addFiles(files){
  for(const f of files){
    curImg=await loadImage(f); rot=0;
    const r=processToResult();
    if(r) BATCH.push({file:f.name||'붙여넣기',birth:r.birth,ans:r.ans,amb:r.amb,name:''});
  }
  renderBatch();
}
document.getElementById('file').addEventListener('change',e=>{
  addFiles([...e.target.files]); e.target.value='';
});
window.addEventListener('paste',e=>{
  const imgs=[...(e.clipboardData||{}).items||[]].filter(it=>it.type&&it.type.startsWith('image'))
    .map(it=>it.getAsFile()).filter(Boolean);
  if(imgs.length) addFiles(imgs);
});
document.getElementById('rotbtn').addEventListener('click',()=>{
  rot=(rot+90)%360;
  const r=processToResult();
  if(r&&BATCH.length){const last=BATCH[BATCH.length-1];
    last.birth=r.birth;last.ans=r.ans;last.amb=r.amb;renderBatch();}
});
